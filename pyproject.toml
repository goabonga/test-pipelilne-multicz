[project]
name = "shomer-workspace"
version = "0.0.0"
description = "Shomer monorepo (api, job, cli) — uv workspace root."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]
# `web` is a Node project (TS / CSS / Jinja templates that
# build into packages/ssr/src/shomer_ssr/{static,templates}/). uv
# should ignore it — it has no pyproject.toml.
exclude = ["packages/web"]

[tool.uv.sources]
shomer-api = { workspace = true }
shomer-job = { workspace = true }
shomer-cli = { workspace = true }
shomer-ssr = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.15",
]
doc = [
    "zensical>=0.0.45",
]
favicon = [
    # scripts/generate_favicon.py — one-off branding asset tooling.
    "cairosvg>=2.7",
    "pillow>=10.0",
]
# BDD end-to-end tests. Lives in its own group so CI's lint / unit
# pipelines don't drag the playwright browser binaries in: only the
# e2e-api / e2e-ssr jobs install this group (and call `playwright
# install chromium` for the ssr browser-driven scenarios).
e2e = [
    "behave>=1.2.6",
    "httpx>=0.27",
    # Pinned for the ssr Playwright-driven feature suite. The Python
    # client is shipped alongside the browser binaries (`playwright
    # install chromium` in CI) — see .github/workflows/ci.yml e2e-ssr.
    "playwright>=1.45",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/api/tests",
    "packages/job/tests",
    "packages/cli/tests",
    "packages/ssr/tests",
]
addopts = "-q"
