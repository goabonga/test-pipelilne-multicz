[project]
name = "shomer-workspace"
version = "0.0.0"
description = "Shomer monorepo (api, worker, cli) — uv workspace root."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]
# `web-frontend` is a Node project (TS / CSS / Jinja templates that
# build into packages/web/src/shomer_web/{static,templates}/). uv
# should ignore it — it has no pyproject.toml.
exclude = ["packages/web-frontend"]

[tool.uv.sources]
shomer-api = { workspace = true }
shomer-worker = { workspace = true }
shomer-cli = { workspace = true }
shomer-web = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
doc = [
    "zensical>=0.0.37",
]
favicon = [
    # scripts/generate_favicon.py — one-off branding asset tooling.
    "cairosvg>=2.7",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/api/tests",
    "packages/worker/tests",
    "packages/cli/tests",
    "packages/web/tests",
]
addopts = "-q"
