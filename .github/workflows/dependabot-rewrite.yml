name: dependabot-rewrite

# Re-author and GPG-sign Dependabot commits with Conventional-Commits
# scopes that match the multicz components.
#
# Triggered by `workflow_run` (from dependabot-rewrite-signal.yml)
# rather than `pull_request_target` so that a fork PR cannot directly
# reach this code-execution surface — only the no-op signal workflow
# can fire from a PR, and forks have no secrets access through it.
# Plumber's ISSUE-802 is happy with this shape.
#
# Defence in depth: the rewrite script is checked out from `main` into
# `trusted/`, while the PR's commits go into `pr/`. The rebase runs
# inside `pr/` but execs the script from `trusted/`, so a malicious PR
# cannot tamper with the script that processes its own commits — even
# if the PR diff happens to touch `scripts/rewrite-dependabot-commit.sh`,
# the version that runs is the one from main.

on:
  workflow_run:
    workflows: [dependabot-rewrite-signal]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  rewrite:
    name: rewrite dependabot commits
    # Three gates: the upstream signal must have completed successfully
    # (which already requires actor==dependabot per its own `if`),
    # AND must have been triggered by a real pull_request event,
    # AND the actor on the upstream run must still be dependabot. The
    # last one is redundant with the signal's gate but cheap to check
    # and useful as a tripwire if the signal workflow is ever edited.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      # Each Dependabot PR has its own branch name (e.g.
      # dependabot/uv/uvicorn-standard--gte-0.48.0); one slot per branch
      # so a second push to the same PR cancels the previous rewrite.
      group: dependabot-rewrite-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - name: Check GPG availability
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            {
              echo "## Dependabot rewrite: skipped"
              echo ""
              echo "GPG_PRIVATE_KEY and/or GPG_PASSPHRASE are not configured. "
              echo "The Dependabot PR ships with bot-authored, web-signed commits."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GPG secrets unset; leaving Dependabot commits as-is"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted code: scripts/rewrite-dependabot-commit.sh as it lives
      # on main. We run the rebase script from THIS checkout, never from
      # the PR — that's what makes the workflow_run pattern actually
      # safer than gated pull_request_target.
      - name: Checkout main into trusted/
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted

      # PR commits — pure data, never executed as code.
      - name: Checkout PR head into pr/
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          # head_sha (not head_branch) pins the rewrite to the exact
          # commits the signal observed — no race if Dependabot pushes
          # again between signal and rewrite.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
          # RELEASE_PAT (when configured) makes the eventual force-push
          # to the dependabot/* branch surface as the PAT-owning user
          # rather than github-actions[bot]. The GPG key + commit author
          # are already the maintainer's; the PAT keeps the pusher
          # consistent so the audit log reads "goabonga pushed her own
          # signed commit" rather than "bot pushed a commit signed by
          # someone else". Falls back to GITHUB_TOKEN if the secret
          # isn't set.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          path: pr

      # uv is needed inside the rebase loop: the rewrite script bumps the
      # affected `packages/<pkg>/pyproject.toml` to match the new resolved
      # version, then runs `uv lock` so the lockfile's requires-dist mirror
      # stays consistent with pyproject — Dependabot's uv FileUpdater only
      # touches the lockfile mirror for `>=X` specifiers, so without this
      # we'd ship a silent drift the next release commit would undo.
      - name: Install uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: "3.12"
          # uv is only used for an occasional `uv lock` inside the rebase
          # loop; most bumps (JS / Actions / Docker) never touch it, so
          # there's nothing to cache and the post-job `cache prune` fails
          # the whole job with "Cache path … does not exist". Disable the
          # cache to drop that spurious failure.
          enable-cache: false

      - name: Configure GPG and git identity from the imported key
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          UID_LINE=$(gpg --list-keys --with-colons "$KEY_ID" | awk -F: '/^uid/{print $10; exit}')
          NAME="${UID_LINE%% <*}"
          EMAIL=$(printf '%s' "$UID_LINE" | sed -nE 's/.*<([^>]+)>.*/\1/p')
          git config user.name  "$NAME"
          git config user.email "$EMAIL"
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true

      - name: Rewrite commits with scope-aware messages
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          # `--exec` uses the trusted script from main, not the version
          # of the same script that may live in the PR. The absolute
          # path via $GITHUB_WORKSPACE guards against any chdir games
          # the rebase machinery might do.
          git rebase "$BASE_SHA" --exec "$GITHUB_WORKSPACE/trusted/scripts/rewrite-dependabot-commit.sh"

      - name: Force-push rewritten branch
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          git push --force-with-lease origin "HEAD:$HEAD_REF"

      # File a tracking issue for the bump and cross-link it to the PR, so
      # dependency updates are visible on the issue board and not only as
      # PRs. Idempotent: keyed off a hidden marker in a PR comment, so
      # Dependabot re-runs / re-pushes (each of which retriggers this
      # rewrite) don't pile up duplicate issues.
      - name: Open a tracking issue linked to the PR
        if: steps.gate.outputs.skip != 'true'
        env:
          # RELEASE_PAT so the issue + comment surface as the maintainer,
          # consistent with the re-authored commits.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          marker="<!-- dependabot-tracking -->"
          if gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' \
               | grep -qF "$marker"; then
            echo "PR #$PR_NUMBER already has a tracking issue; nothing to do"
            exit 0
          fi
          title=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          issue=$(gh issue create \
            --title "track: $title" \
            --label "dependencies" \
            --body "$(printf 'Tracking the Dependabot update in #%s.\n\nThe PR commits were re-authored and GPG-signed on their branch by `dependabot-rewrite`. Close this issue when the PR is merged or dropped.' "$PR_NUMBER")")
          gh pr comment "$PR_NUMBER" \
            --body "$(printf '%s\nTracking issue: %s' "$marker" "$issue")"
          echo "opened tracking issue $issue for PR #$PR_NUMBER"

      # Docker bump PRs: build the new image, run grype against it, and
      # reconcile the per-component .grype.yaml so the next CI run is
      # actionable rather than a wall of fresh CVE noise. The human still
      # has to review what we did — that's why we post a PR comment with
      # the diff before merging is even an option.
      - name: Detect Dockerfile bumps in this PR
        if: steps.gate.outputs.skip != 'true'
        id: detect-docker
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          set -euo pipefail
          components=$(
            git diff --name-only "origin/$BASE_REF...HEAD" -- 'packages/*/Dockerfile' \
              | sed -nE 's|packages/([^/]+)/Dockerfile|\1|p' \
              | sort -u
          )
          if [ -z "$components" ]; then
            echo "no Dockerfile changes; grype-sync skipped"
          fi
          {
            echo "components<<EOF"
            echo "$components"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install grype
        if: steps.gate.outputs.skip != 'true' && steps.detect-docker.outputs.components != ''
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Sync .grype.yaml against the bumped base image(s)
        if: steps.gate.outputs.skip != 'true' && steps.detect-docker.outputs.components != ''
        id: grype-sync
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          COMPONENTS: ${{ steps.detect-docker.outputs.components }}
        run: |
          set -euo pipefail
          : > /tmp/grype-sync.md
          synced_any=false
          while IFS= read -r comp; do
            [ -n "$comp" ] || continue
            # Each component runs through the trusted-checkout script,
            # not the version sitting in the PR — same defence-in-depth
            # rationale as the rewrite step above.
            python3 "$GITHUB_WORKSPACE/trusted/scripts/dependabot-grype-sync.py" \
              "$comp" >> /tmp/grype-sync.md
            printf '\n' >> /tmp/grype-sync.md
            # Commit per-component so the resulting changelog reads
            # "fix(api): sync grype" / "fix(ssr): sync grype" — matches
            # the per-component atomic-commit pattern multicz already
            # consumes for everything else under packages/<comp>/.
            if ! git diff --quiet -- "packages/$comp/.grype.yaml"; then
              git add "packages/$comp/.grype.yaml"
              # -F /tmp/commit-msg keeps the multi-line body out of the
              # YAML scanner — embedding it as -m "..." in a `run: |`
              # block trips on lines that start at column 0.
              cat > /tmp/commit-msg <<EOF
          fix($comp): sync grype allowlist against the bumped base image

          Auto-generated by .github/workflows/dependabot-rewrite.yml on
          top of the Dependabot Docker bump that introduced the new
          FROM revision. The PR comment lists what changed in the
          allowlist (kept / resolved / newly-added) so the human
          reviewer can validate each entry before merging.
          EOF
              # Strip the leading shell-indent we added so YAML stays happy.
              sed -i 's/^          //' /tmp/commit-msg
              git commit -F /tmp/commit-msg
              synced_any=true
            fi
          done <<< "$COMPONENTS"
          if [ "$synced_any" = "true" ]; then
            git push --force-with-lease origin "HEAD:$HEAD_REF"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment summarising the grype sync
        if: steps.gate.outputs.skip != 'true' && steps.grype-sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          {
            # Marker comment lets a future iteration upsert (find +
            # delete the stale comment, post a fresh one) instead of
            # piling identical bodies onto the PR if Dependabot pushes
            # the bump again.
            printf '%s\n\n' '<!-- dependabot-grype-sync -->'
            cat /tmp/grype-sync.md
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md

      - name: Write step summary
        if: steps.gate.outputs.skip != 'true' && success()
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          {
            echo "## Dependabot rewrite: applied"
            echo ""
            echo "PR branch \`$HEAD_REF\` rewritten:"
            echo ""
            echo "- Conventional-commits scope inferred from changed files / dev-group membership"
            echo "- Authored and GPG-signed as \`$(git config user.name) <$(git config user.email)>\`"
          } >> "$GITHUB_STEP_SUMMARY"
