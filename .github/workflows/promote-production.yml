# Promote the chart versions currently running in staging to production, by
# opening a PR that moves the production pins.
#
# This workflow only PROPOSES. It writes the pins and the version bump onto
# `gitops/production-<version>` and opens a PR into `gitops/production`;
# merging that PR runs gitops-apply.yml, which is where the `production`
# Environment gate and the push to main live.
#
# The same shape as infra-plan / infra-apply, for the same reason: the PR
# never targets main, so no workflow watching PRs into main opens an empty
# run on it. `on.pull_request` can only filter the base branch, and no
# job-level `if` prevents the run record itself.
#
# What this workflow deliberately does NOT do is touch a cluster. Flux pulls
# from git, so no credential here can reach production. A job that ran
# `helm upgrade` against a kubeconfig would put production one workflow
# injection away from CI — the thing the pull model exists to prevent.

name: promote-production

# Runs after ci, like infra-plan, and for the same reason: this job reads
# the staging pins off main, so it must not read a main that is still being
# written. release-bump is not the last job in ci — promote-staging pushes
# after it, and promote-staging is exactly what moves the staging pins this
# job promotes.
#
# It proposes on every completion and opens nothing when the pins already
# match, so a quiet cycle costs one short job. Dispatch remains, for a
# promotion decided rather than detected.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this promotion (recorded in the PR body).
        required: false
        default: ""

concurrency:
  group: promote-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    # A failed or cancelled ci has not finished writing to main, so the pins
    # it would read are not the ones that will be there. workflow_dispatch
    # has no parent run, hence the second clause.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # No `environment:` here. This job proposes; gitops-apply.yml gates.
    # Gating both would ask for the same approval twice, and the useful
    # place to ask is the one that changes what production runs.
    permissions:
      contents: write        # push the promotion branch
      pull-requests: write   # open / update the PR
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1

      - name: Copy the staging pins onto production
        id: pins
        run: |
          set -euo pipefail
          # Staging is the source of truth for "what has been exercised".
          # Promotion is therefore a copy, never a fresh version lookup —
          # so production can only ever run something staging ran first.
          for c in api job ssr migrations; do
            V=$(sed -n 's/^      version: "\(.*\)"$/\1/p' "gitops/apps/staging/${c}.yaml")
            [ -n "$V" ] || { echo "::error::no pin found for ${c} in staging"; exit 1; }
            scripts/gitops-pin.sh production "$c" "$V"
          done
          if git diff --quiet -- gitops/apps/production; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "production already matches staging — nothing to promote"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- gitops/apps/production
          fi

      - name: Bump gitops-production and open the promotion PR
        if: steps.pins.outputs.moved == 'true'
        env:
          # github.token, not RELEASE_PAT. The PAT is needed to PUSH to the
          # protected branches — it is the checkout token for exactly that
          # reason — but `gh pr` goes through GraphQL, and resolving a login
          # there needs the `read:org` scope the PAT does not carry:
          #
          #   GraphQL: ... The 'login' field requires one of the following
          #   scopes: ['read:org']
          #
          # The branches were pushed and then no PR was opened. infra-plan
          # has always used github.token for its `gh` calls; this matches it.
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/apps/production
          git commit -m "deploy(production): promote chart pins from staging"

          # The bump rides in the same proposal, so the diff a reviewer
          # approves is the whole change: the pins AND the version they will
          # be released as. gitops-apply reads that number back with
          # `multicz get` rather than recomputing it.
          multicz bump --component gitops-production --force gitops-production:patch \
            --commit --output json > /tmp/bump.json
          VERSION=$(jq -s -r '[.[] | .bumps // {}] | add | ."gitops-production".next_version // empty' /tmp/bump.json)
          [ -n "$VERSION" ] || { echo "::error::gitops-production bumped to nothing"; exit 1; }

          # STRIP THE SKIP-CI MARKER — same reason as infra-plan.
          #
          # multicz's release_commit_message carries it so release commits
          # pushed to main do not start another ci run, and GitHub applies
          # that marker to `pull_request` events too. Left in place, this
          # commit becomes the head of the promotion PR and suppresses the
          # `closed` event gitops-apply triggers on: the PR merges and
          # nothing runs. That is exactly what happened to the deploy PR.
          git commit --amend --no-edit \
            -m "chore(release): promote chart pins, bump gitops-production to v${VERSION}" \
            -m "Released by gitops-apply once this PR is merged and the production environment reviewers approve."

          BASE="gitops/production"
          TOPIC="gitops/production-${VERSION}"

          # Create the gate branch on first use — it carries no protection
          # and no history, it only exists to be a PR target.
          #
          # Force: gitops/<env> is levelled with main at the start of every
          # promotion. After a merge it holds a merge commit and main is then
          # fast-forwarded onto it, so the two converge — but only once
          # gitops-apply has run. Resetting here guarantees a clean base
          # either way. Safe with a PR open: its head carries a commit the
          # base does not, so moving the base cannot merge it.
          git push --force origin "origin/main:refs/heads/${BASE}"
          git push --force origin "HEAD:refs/heads/${TOPIC}"

          BODY=$(mktemp)
          {
            echo "Promotes the chart versions currently pinned in **staging** to **production**,"
            echo "and releases \`gitops-production\` **v${VERSION}**."
            echo
            echo '```'
            for c in api job ssr migrations; do
              printf '%-12s %s\n' "$c" "$(sed -n 's/^      version: "\(.*\)"$/\1/p' "gitops/apps/production/${c}.yaml")"
            done
            echo '```'
            echo
            if [ -n "${REASON}" ]; then echo "Reason: ${REASON}"; echo; fi
            echo "Merging this asks the \`production\` environment reviewers to approve, then"
            echo "lands the commit on \`main\` and tags it. Flux reconciles from \`main\`, so that"
            echo "commit is the deploy."
          } > "$BODY"

          PR=$(gh pr list --base "$BASE" --head "$TOPIC" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --base "$BASE" --head "$TOPIC" \
              --title "deploy(production): promote chart pins, release gitops-production v${VERSION}" \
              --body-file "$BODY"
          else
            gh pr edit "$PR" --body-file "$BODY"
            echo "updated existing PR #${PR}"
          fi

          # A superseded proposal at another version: its pins and its
          # release number are both stale, and two open PRs would each claim
          # to promote production.
          gh pr list --base "$BASE" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName != "'"$TOPIC"'") | .number' \
          | while read -r stale; do
              gh pr comment "$stale" --body "Superseded by gitops-production v${VERSION}. Closing."
              gh pr close "$stale" --delete-branch
            done

      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: promote-production
          body: 'Copied the staging pins onto `gitops/apps/production/`, bumped `gitops-production` and opened the promotion PR into `gitops/production`.'
