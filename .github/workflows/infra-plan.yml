# Plans each environment that owes a deploy, and turns a non-empty plan into
# a pull request whose merge applies it.
#
# THE CYCLE
#
#   ci.yml finishes on main
#     -> this workflow runs, once, against the final state of main
#     -> for each environment multicz reports as changed:
#          deploy/<env> is reset to main and the configs-<env> bump
#            committed on it
#          terragrunt plans that bumped tree
#          drift  -> PR deploy/<env> -> main, plan attached
#          clean  -> branch left level with main, any open PR closed
#     -> merging the PR runs infra-apply.yml: apply, then tag
#
# WHY workflow_run AND NOT A DISPATCH FROM release-bump
#
# It used to be dispatched from ci.yml's release-bump job, which is not the
# last job in that workflow. On one run infra-plan was dispatched at
# 12:29:54 and planned main at 4ba1726, while release-gitops-production and
# promote-staging pushed three more commits to main by 12:31:26. The plan
# described a main that no longer existed. `workflow_run` on completion is
# the only trigger that guarantees ci.yml has finished writing to main.
#
# WHY THE PR RUNS deploy/<env> -> main, AND NOT THE OTHER WAY
#
# The bump has to reach main eventually, and main's ruleset allows exactly
# one way in: a reviewed pull request, rebase-merged, signed. Pointing the
# PR at main means the release commit arrives through that door instead of
# being pushed at it. infra-apply used to `git push origin HEAD:main` after
# applying, which that ruleset rejects with GH013 — the push simply had no
# way of working.
#
# The single commit on deploy/<env> is the `configs-<env>` bump, and it is
# exactly what the merge authorises: deploy this, release it as this
# version. It is also what makes the plan honest — config.yaml's `version:`
# is stamped onto every resource as the `config-version` tag, so the plan
# must be computed against the version that will actually be applied.
#
# deploy/<env> is machine-owned and reset to main every cycle, so it holds
# no history: a rebase-merge rewrites the commit onto main under a new SHA,
# which means the branch is never again an ancestor of main and a plain
# fast-forward would fail. That is why the reset is forced. The branch
# allows force-pushes and requires no review; main carries the review.
#
# infra-apply does NOT bump and pushes no branch. The bump is already on
# main via the merge; that job applies it and creates the tag.
#
# NO CLOUD PROVIDER IS WIRED YET (see infrastructure/root.hcl). Until one is,
# state is local to the job so every plan reports a first apply.

name: infra-plan

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: infra-plan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover-envs:
    name: discover-envs
    # A failed or cancelled ci run has not finished writing to main, so
    # planning against it would repeat the bug this trigger fixes.
    # workflow_dispatch has no parent run, hence the second clause.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0   # multicz compares against each component's last tag
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - id: changed
        run: |
          set -euo pipefail
          multicz changed --output json | tee /tmp/changed.json
      - id: list
        # An environment is planned when its `configs-<env>` component has
        # undeployed changes — the question this workflow exists to answer,
        # and one multicz already computes. It covers the indirect cases for
        # free: a module or a services/** change cascades onto every
        # configs-<env> through depends_on, so all of them get planned; a
        # change to one environment's config.yaml marks only that one.
        #
        # release-bump never releases configs-*, so an environment stays
        # pending from the moment something lands until an apply clears it.
        run: |
          set -euo pipefail
          envs=$(jq -c '[
            .changed[]
            | select(startswith("configs-"))
            | sub("^configs-"; "")
          ]' /tmp/changed.json)
          # Guard against a component whose config directory was deleted
          # without removing the multicz component: terragrunt would fail
          # deep inside the plan with a confusing "file not found".
          for e in $(echo "$envs" | jq -r '.[]'); do
            if [ ! -f "infrastructure/configs/${e}/config.yaml" ]; then
              echo "::error::component configs-${e} has no infrastructure/configs/${e}/config.yaml"
              exit 1
            fi
          done
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "environments with pending changes: $envs"

  plan:
    name: plan (${{ matrix.env }})
    needs: [discover-envs]
    # GitHub errors out on an empty matrix vector ("does not contain any
    # values") rather than skipping it, so nothing-pending has to be caught
    # here.
    if: needs.discover-envs.outputs.envs != '[]'
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.discover-envs.outputs.envs) }}
    runs-on: ubuntu-latest
    # A GitHub Environment separate from the apply one, so protecting the
    # apply environment with required reviewers does not block this
    # automatic plan. Once a provider is wired, give it its own read-only
    # credentials — a genuinely separate identity, not the apply
    # credentials behind a different name.
    environment: ${{ matrix.env }}-plan
    permissions:
      contents: write        # force-push the bump onto deploy/<env>
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ENV_NAME: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # deploy/* is protected and the bot is not an admin, so GITHUB_TOKEN
          # is refused with GH006 on the fast-forward. The owner's PAT is not
          # (enforce_admins is false).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      - uses: ./.github/actions/setup-terragrunt
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1

      # TODO(provider): add the cloud login here (OIDC, no long-lived
      # secret) with READ-ONLY permissions — plan must not be able to
      # mutate anything, including acquiring a state lock.

      - name: Require the deploy branch to exist
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/branches/deploy/${ENV_NAME}" >/dev/null 2>&1; then
            echo "::error::branch deploy/${ENV_NAME} does not exist — create it once from main, then protect it (required reviewers)"
            exit 1
          fi

      - name: Bump configs-<env>
        id: bump
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Committed locally only. Nothing reaches deploy/<env> unless the
          # plan below actually finds work — a clean plan must leave no
          # trace, or the branch would carry a bump for a deploy that never
          # happened.
          #
          # Writes config.yaml's `version:`, the component CHANGELOG and the
          # zensical.toml mirror. No --tag: the tag records a completed
          # apply, so infra-apply creates it.
          multicz bump --component "configs-${ENV_NAME}" --commit --output json \
            > /tmp/bump.json
          VERSION=$(jq -s -r --arg c "configs-${ENV_NAME}" \
            '[.[] | .bumps // {}] | add | .[$c].next_version // empty' /tmp/bump.json)
          if [ -z "$VERSION" ]; then
            # discover-envs only lists environments multicz reports as
            # changed, so an empty bump means the two disagree — a bug, not
            # a quiet no-op.
            echo "::error::configs-${ENV_NAME} was reported changed but bumps to nothing"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "planning ${ENV_NAME} as configs-${ENV_NAME} v${VERSION}"

      - name: Terragrunt plan
        id: tg
        run: |
          set +e
          # Output goes to a file, never straight to the log: job logs are
          # public on a public repo and a real plan carries resource names
          # and attributes. Only the "Plan: N to add, ..." lines are echoed
          # below.
          terragrunt --non-interactive --working-dir infrastructure/services \
            run --all -- plan -detailed-exitcode -no-color -input=false \
            > "plan-${ENV_NAME}.txt" 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Show plan summary
        run: |
          grep -E '^Plan: ' "plan-${ENV_NAME}.txt" \
            || echo "(no summary line — see exit code / job status)"

      - name: Show plan error
        # Without this a real error is invisible: it went to the file and
        # the summary grep finds nothing. Terraform/HCL error text carries
        # no resource detail, so it is safe to print.
        if: steps.tg.outputs.exit_code == '1'
        run: cat "plan-${{ matrix.env }}.txt"

      - name: Fail on plan error
        if: steps.tg.outputs.exit_code == '1'
        run: exit 1

      - name: Upload full plan
        if: steps.tg.outputs.exit_code == '2'
        # WARNING: on a public repo, workflow artifacts are downloadable by
        # anyone who can read the repo. This is tolerable only while no
        # unit declares real resources.
        # TODO(provider): move this to a private object-storage container
        # and post no bearer link — reviewers fetch it with their own
        # credentials.
        uses: actions/upload-artifact@v7
        with:
          name: plan-${{ matrix.env }}-v${{ steps.bump.outputs.version }}
          path: plan-${{ matrix.env }}.txt
          retention-days: 7

      - name: Open or update the deploy PR
        if: steps.tg.outputs.exit_code == '2'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="deploy/${ENV_NAME}"

          # --force, and it is not a shortcut. main's ruleset rebase-merges,
          # which replays this commit onto main under a new SHA — so once a
          # deploy lands, the branch is no longer an ancestor of main and no
          # fast-forward exists. The branch is a per-cycle proposal, not
          # history: it is reset to main plus one bump every time.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          SUMMARY=$(grep -E '^Plan: ' "plan-${ENV_NAME}.txt" || echo "(no per-unit summary line found)")
          BODY_FILE=$(mktemp)
          {
            echo "Terragrunt found pending changes for **${ENV_NAME}**."
            echo
            echo "Merging this PR applies them and releases \`configs-${ENV_NAME}\` **v${VERSION}**."
            echo "The bump in the diff is the whole authorisation: \`version:\` is stamped"
            echo "onto every resource as the \`config-version\` tag, so the plan below was"
            echo "computed with v${VERSION} already in place. What you approve is what runs."
            echo
            echo "**Summary**"
            echo '```'
            echo "$SUMMARY"
            echo '```'
            echo
            echo "Full plan: artifact \`plan-${ENV_NAME}-v${VERSION}\` on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > "$BODY_FILE"

          PR_NUMBER=$(gh pr list --base main --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "deploy(${ENV_NAME}): apply and release configs-${ENV_NAME} v${VERSION}" \
              --body-file "$BODY_FILE"
          else
            # The force-push above already updated the diff; this records
            # the new plan against it.
            gh pr edit "$PR_NUMBER" \
              --title "deploy(${ENV_NAME}): apply and release configs-${ENV_NAME} v${VERSION}" \
              --body-file "$BODY_FILE"
            gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
          fi

      - name: Reset the deploy branch (plan is clean)
        if: steps.tg.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          BRANCH="deploy/${ENV_NAME}"
          PR_NUMBER=$(gh pr list --base main --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "Plan is now clean — nothing to apply. Closing."
            gh pr close "$PR_NUMBER"
          fi
          # Drop the local bump commit: it described a deploy that is not
          # owed. The branch goes back to being exactly main, so the next
          # cycle starts from a clean slate and nothing stale is left for a
          # reviewer to stumble on.
          #
          # The branch is never deleted — infra-plan requires it to exist,
          # and recreating a protected branch needs permissions this job
          # deliberately does not have.
          git push --force origin "origin/main:refs/heads/${BRANCH}"
          echo "no drift for ${ENV_NAME} — ${BRANCH} left level with main"
