# Plans each environment that owes a deploy, and turns a non-empty plan into
# a pull request whose merge applies it.
#
# THE CYCLE
#
#   ci.yml finishes on main
#     -> this workflow runs, once, against the final state of main
#     -> for each environment multicz reports as changed:
#          deploy/<env> is reset to main
#          the configs-<env> bump is committed on deploy/<env>-<version>
#          terragrunt plans that bumped tree
#          drift  -> PR deploy/<env>-<version> -> deploy/<env>, plan attached
#          clean  -> topic branch dropped, deploy/<env> left level with main
#     -> merging the PR runs infra-apply.yml: apply, tag, then main is
#        fast-forwarded onto deploy/<env>
#
# WHY workflow_run AND NOT A DISPATCH FROM release-bump
#
# It used to be dispatched from ci.yml's release-bump job, which is not the
# last job in that workflow. On one run infra-plan was dispatched at
# 12:29:54 and planned main at 4ba1726, while release-gitops-production and
# promote-staging pushed three more commits to main by 12:31:26. The plan
# described a main that no longer existed. `workflow_run` on completion is
# the only trigger that guarantees ci.yml has finished writing to main.
#
# WHY THE PR TARGETS deploy/<env> AND NOT main
#
# Because `on.pull_request` can only filter the BASE branch, never the head.
# A PR into main matches every workflow listening for PRs into main — ci and
# dependabot-rewrite-signal both opened empty runs on the deploy PR, and no
# job-level `if` can stop the run record from existing. Targeting
# deploy/<env> means the trigger simply does not match: no run, nothing to
# filter, nothing to explain.
#
# The single commit on deploy/<env>-<version> is the `configs-<env>` bump,
# and it is exactly what the merge authorises: deploy this, release it as
# this version. It is also what makes the plan honest — config.yaml's
# `version:` is stamped onto every resource as the `config-version` tag, so
# the plan must be computed against the version that will be applied.
#
# main is reached afterwards, by infra-apply, once the apply has actually
# succeeded — so main never records a version that was not deployed. That
# push is authenticated with RELEASE_PAT, whose owner is a bypass actor on
# main's ruleset. An earlier attempt failed with GH013 not because the
# ruleset forbids it but because the job checked out with GITHUB_TOKEN.
#
# deploy/<env> is machine-owned and force-reset to main every cycle, so it
# carries no history worth keeping: it is a per-cycle proposal.
#
# NO CLOUD PROVIDER IS WIRED YET (see infrastructure/root.hcl). Until one is,
# state is local to the job so every plan reports a first apply.

name: infra-plan

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: infra-plan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover-envs:
    name: discover-envs
    # A failed or cancelled ci run has not finished writing to main, so
    # planning against it would repeat the bug this trigger fixes.
    # workflow_dispatch has no parent run, hence the second clause.
    # A `chore(release): bump configs-<env>` commit is what infra-apply
    # pushes AFTER a deploy has been applied and released. It reaches main
    # without the skip marker on purpose — the marker on the proposal
    # commit would have suppressed the pull_request event the applier
    # triggers on — so it starts a ci run, whose completion lands here.
    #
    # There is nothing to plan on it. The environment it names was just
    # released, so multicz reports it as not pending, and every one of
    # these runs discovered an empty set and stopped. Skipping is one
    # fewer run per deploy, not a behaviour change.
    #
    # Deliberately narrow. `gitops-` bumps are NOT skipped: promote-staging
    # moves the staging pins in the same breath, which is exactly when
    # production may have something new to promote.
    #
    # `head_commit` on a workflow_run event is the commit the parent run
    # was for — the release commit itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release): bump configs-'))
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0   # multicz compares against each component's last tag
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - id: changed
        run: |
          set -euo pipefail
          multicz changed --output json | tee /tmp/changed.json
      - id: list
        # An environment is planned when its `configs-<env>` component has
        # undeployed changes — the question this workflow exists to answer,
        # and one multicz already computes. It covers the indirect cases for
        # free: a module or a services/** change cascades onto every
        # configs-<env> through depends_on, so all of them get planned; a
        # change to one environment's config.yaml marks only that one.
        #
        # release-bump never releases configs-*, so an environment stays
        # pending from the moment something lands until an apply clears it.
        run: |
          set -euo pipefail
          envs=$(jq -c '[
            .changed[]
            | select(startswith("configs-"))
            | sub("^configs-"; "")
          ]' /tmp/changed.json)
          # Guard against a component whose config directory was deleted
          # without removing the multicz component: terragrunt would fail
          # deep inside the plan with a confusing "file not found".
          for e in $(echo "$envs" | jq -r '.[]'); do
            if [ ! -f "infrastructure/configs/${e}/config.yaml" ]; then
              echo "::error::component configs-${e} has no infrastructure/configs/${e}/config.yaml"
              exit 1
            fi
          done
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "environments with pending changes: $envs"

  plan:
    name: plan (${{ matrix.env }})
    needs: [discover-envs]
    # GitHub errors out on an empty matrix vector ("does not contain any
    # values") rather than skipping it, so nothing-pending has to be caught
    # here.
    if: needs.discover-envs.outputs.envs != '[]'
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.discover-envs.outputs.envs) }}
    runs-on: ubuntu-latest
    # A GitHub Environment separate from the apply one, so protecting the
    # apply environment with required reviewers does not block this
    # automatic plan. Once a provider is wired, give it its own read-only
    # credentials — a genuinely separate identity, not the apply
    # credentials behind a different name.
    environment: ${{ matrix.env }}-plan
    permissions:
      contents: write        # force-push the bump onto deploy/<env>
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ENV_NAME: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # deploy/* is protected and the bot is not an admin, so GITHUB_TOKEN
          # is refused with GH006 on the fast-forward. The owner's PAT is not
          # (enforce_admins is false).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      - uses: ./.github/actions/setup-terragrunt
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1

      # TODO(provider): add the cloud login here (OIDC, no long-lived
      # secret) with READ-ONLY permissions — plan must not be able to
      # mutate anything, including acquiring a state lock.

      - name: Require the deploy branch to exist
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/branches/deploy/${ENV_NAME}" >/dev/null 2>&1; then
            echo "::error::branch deploy/${ENV_NAME} does not exist — create it once from main, then protect it (required reviewers)"
            exit 1
          fi

      # The proposal commit is what a reviewer sees in the deploy PR, so it
      # is signed here too. The applier rebases and re-signs it on the way
      # to main; this is about the PR being reviewable, not about main.
      - uses: ./.github/actions/setup-signing
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Bump configs-<env>
        id: bump
        run: |
          set -euo pipefail

          # Committed locally only. Nothing is pushed unless the plan below
          # actually finds work — a clean plan must leave no trace, or a
          # branch would carry a bump for a deploy that never happened.
          #
          # Writes config.yaml's `version:`, the component CHANGELOG and the
          # zensical.toml mirror. No --tag: the tag records a completed
          # apply, so infra-apply creates it.
          multicz bump --component "configs-${ENV_NAME}" --commit --output json \
            > /tmp/bump.json
          VERSION=$(jq -s -r --arg c "configs-${ENV_NAME}" \
            '[.[] | .bumps // {}] | add | .[$c].next_version // empty' /tmp/bump.json)
          if [ -z "$VERSION" ]; then
            # discover-envs only lists environments multicz reports as
            # changed, so an empty bump means the two disagree — a bug, not
            # a quiet no-op.
            echo "::error::configs-${ENV_NAME} was reported changed but bumps to nothing"
            exit 1
          fi
          # STRIP THE SKIP-CI MARKER.
          #
          # multicz's release_commit_message carries it so a release commit
          # pushed to main does not start another ci run. That marker is
          # inherited here — and GitHub applies it to `pull_request` events
          # as well as `push`, so this commit, once it became the head of the
          # deploy PR, silently suppressed the `closed` event infra-apply
          # triggers on. PR #185 merged and nothing ran at all.
          #
          # The message is rewritten rather than the template changed: main
          # still wants the marker on the release commits ci itself pushes.
          # When infra-apply later lands this commit on main it costs one ci
          # run, which finds nothing pending and skips its whole matrix.
          git commit --amend --no-edit \
            -m "chore(release): bump configs-${ENV_NAME} to v${VERSION}" \
            -m "Applied by infra-apply once this deploy PR is merged and the ${ENV_NAME} environment reviewers approve."

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "planning ${ENV_NAME} as configs-${ENV_NAME} v${VERSION}"

      - name: Terragrunt plan
        id: tg
        run: |
          set +e
          # Output goes to a file, never straight to the log: job logs are
          # public on a public repo and a real plan carries resource names
          # and attributes. Only the "Plan: N to add, ..." lines are echoed
          # below.
          terragrunt --non-interactive --working-dir infrastructure/services \
            run --all -- plan -detailed-exitcode -no-color -input=false \
            > "plan-${ENV_NAME}.txt" 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Show plan summary
        run: |
          grep -E '^Plan: ' "plan-${ENV_NAME}.txt" \
            || echo "(no summary line — see exit code / job status)"

      - name: Show plan error
        # Without this a real error is invisible: it went to the file and
        # the summary grep finds nothing. Terraform/HCL error text carries
        # no resource detail, so it is safe to print.
        if: steps.tg.outputs.exit_code == '1'
        run: cat "plan-${{ matrix.env }}.txt"

      - name: Fail on plan error
        if: steps.tg.outputs.exit_code == '1'
        run: exit 1

      - name: Upload full plan
        if: steps.tg.outputs.exit_code == '2'
        # WARNING: on a public repo, workflow artifacts are downloadable by
        # anyone who can read the repo. This is tolerable only while no
        # unit declares real resources.
        # TODO(provider): move this to a private object-storage container
        # and post no bearer link — reviewers fetch it with their own
        # credentials.
        uses: actions/upload-artifact@v7
        with:
          name: plan-${{ matrix.env }}-v${{ steps.bump.outputs.version }}
          path: plan-${{ matrix.env }}.txt
          retention-days: 7

      - name: Open or update the deploy PR
        if: steps.tg.outputs.exit_code == '2'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          BASE="deploy/${ENV_NAME}"
          TOPIC="deploy/${ENV_NAME}-${VERSION}"

          # The base first: level it with main so the PR diff is the bump and
          # nothing else. Forced because after a merge deploy/<env> carries a
          # merge commit, and main is then fast-forwarded onto it — the two
          # converge, but only after infra-apply has run. Resetting here is
          # what guarantees a clean starting point either way.
          #
          # Safe with a PR open: the head is deploy/<env>-<version>, which
          # carries a commit the base does not, so moving the base cannot make
          # the head reachable from it. That is the distinction sync-deploy-
          # branches got wrong when it merged PR #174 by fast-forwarding.
          git push --force origin "origin/main:refs/heads/${BASE}"

          # Then the proposal. Named with the version so an abandoned cycle
          # is identifiable rather than being silently overwritten by the
          # next one.
          git push --force origin "HEAD:refs/heads/${TOPIC}"

          SUMMARY=$(grep -E '^Plan: ' "plan-${ENV_NAME}.txt" || echo "(no per-unit summary line found)")
          BODY_FILE=$(mktemp)
          {
            echo "Terragrunt found pending changes for **${ENV_NAME}**."
            echo
            echo "Merging this PR applies them and releases \`configs-${ENV_NAME}\` **v${VERSION}**."
            echo "The bump in the diff is the whole authorisation: \`version:\` is stamped"
            echo "onto every resource as the \`config-version\` tag, so the plan below was"
            echo "computed with v${VERSION} already in place. What you approve is what runs."
            echo
            echo "**Summary**"
            echo '```'
            echo "$SUMMARY"
            echo '```'
            echo
            echo "Full plan: artifact \`plan-${ENV_NAME}-v${VERSION}\` on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > "$BODY_FILE"

          PR_NUMBER=$(gh pr list --base "$BASE" --head "$TOPIC" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base "$BASE" --head "$TOPIC" \
              --title "deploy(${ENV_NAME}): apply and release configs-${ENV_NAME} v${VERSION}" \
              --body-file "$BODY_FILE"
          else
            # The force-push above already updated the diff; this records
            # the new plan against it.
            gh pr edit "$PR_NUMBER" --body-file "$BODY_FILE"
            gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
          fi

          # A superseded proposal for the same environment at a different
          # version: the plan moved on, so its diff and its attached plan are
          # both stale. Left open, two PRs would claim to deploy the same
          # environment.
          gh pr list --base "$BASE" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName != "'"$TOPIC"'") | .number' \
          | while read -r stale; do
              gh pr comment "$stale" --body "Superseded by configs-${ENV_NAME} v${VERSION}. Closing."
              gh pr close "$stale" --delete-branch
            done

      - name: Drop the proposal (plan is clean)
        if: steps.tg.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          BASE="deploy/${ENV_NAME}"
          # Every open proposal for this environment, whatever version it
          # named: nothing is owed, so none of them describe reality.
          gh pr list --base "$BASE" --state open --json number \
            --jq '.[].number' \
          | while read -r pr; do
              gh pr comment "$pr" --body "Plan is now clean — nothing to apply. Closing."
              gh pr close "$pr" --delete-branch
            done
          # The local bump commit is simply discarded with the runner: it
          # described a deploy that is not owed and was never pushed.
          #
          # deploy/<env> is still levelled with main so the next cycle starts
          # from a clean slate. It is never deleted — infra-plan requires it
          # to exist, and recreating a protected branch needs permissions
          # this job deliberately does not have.
          git push --force origin "origin/main:refs/heads/${BASE}"
          echo "no drift for ${ENV_NAME} — ${BASE} left level with main"
