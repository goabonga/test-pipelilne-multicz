name: grype-allowlist-sweep

# Weekly sweep over packages/*/.grype.yaml expiration markers.
#
# For each entry whose `# expires:` date has passed, the sweep script
# re-runs grype against the component's latest published GHCR image and
# decides:
#
#   - CVE no longer matched  -> the entry is mergeable garbage; we
#                                rewrite the YAML and open a PR (the
#                                normal *-grype CI jobs gate the merge).
#   - CVE still matched OR
#     no image to scan       -> the entry needs human re-evaluation;
#                                we open or update a tracking issue.
#
# Workflow_dispatch is exposed for one-off manual runs; the cron itself
# fires Monday at 06:00 Europe/Paris (05:00 UTC) to align with the
# dependabot schedule.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

concurrency:
  group: grype-allowlist-sweep
  cancel-in-progress: false

env:
  ISSUE_LABEL: grype-allowlist-expired
  PR_BRANCH: grype-allowlist/auto-sweep

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          # RELEASE_PAT (not GITHUB_TOKEN) so the branches grype-refresh
          # pushes below surface as the maintainer and — crucially — the
          # PRs it opens actually trigger CI. Branches/PRs created with
          # GITHUB_TOKEN are deliberately barred from triggering further
          # workflow runs, which would leave the refresh PRs un-checked.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      # grype-refresh builds each component's Dockerfile locally, so the
      # sweep job needs a buildx builder (the to_review path only).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR so grype can pull private images
        # grype shells out to the OCI distribution APIs and re-uses
        # ~/.docker/config.json credentials. The default GITHUB_TOKEN
        # carries `packages: read` for the same repo.
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the sweep
        id: sweep
        run: |
          python scripts/grype-allowlist-sweep.py check --scan > sweep-report.json
          echo "=== sweep report ==="
          jq . sweep-report.json
          to_remove=$(jq '.to_remove | length' sweep-report.json)
          to_review=$(jq '.to_review | length' sweep-report.json)
          echo "to_remove=$to_remove" >> "$GITHUB_OUTPUT"
          echo "to_review=$to_review" >> "$GITHUB_OUTPUT"

      - name: Apply removals to .grype.yaml files
        if: steps.sweep.outputs.to_remove != '0'
        run: |
          python scripts/grype-allowlist-sweep.py apply-removal \
            --report sweep-report.json
          git --no-pager diff -- packages/*/.grype.yaml

      - name: Build PR body
        if: steps.sweep.outputs.to_remove != '0'
        id: prbody
        run: |
          {
            echo 'body<<PRBODY_EOF'
            echo '## Auto-removed expired grype allowlist entries'
            echo ''
            echo "Weekly sweep on $(date -u +%F): each removed entry had a \`# expires:\` date"
            echo 'in the past **and** grype against the latest published image of its'
            echo 'component no longer reports the listed CVE. The repo `*-grype` jobs'
            echo 'gate the merge — green = the upstream fix really did land.'
            echo ''
            echo '<details><summary>Sweep report</summary>'
            echo ''
            echo '```json'
            jq '.to_remove' sweep-report.json
            echo '```'
            echo ''
            echo '</details>'
            echo 'PRBODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open auto-sweep PR
        if: steps.sweep.outputs.to_remove != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: ${{ env.PR_BRANCH }}
          delete-branch: true
          commit-message: "ci: drop expired grype allowlist entries (auto-sweep)"
          title: "ci: drop expired grype allowlist entries (auto-sweep)"
          body: ${{ steps.prbody.outputs.body }}
          labels: |
            ci
            dependencies

      - name: Ensure tracking label exists
        if: steps.sweep.outputs.to_review != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$ISSUE_LABEL" \
            --color FFA500 \
            --description "Expired grype allowlist entries needing human review" \
            || true

      - name: Open or update review issue
        id: review-issue
        if: steps.sweep.outputs.to_review != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          count=${{ steps.sweep.outputs.to_review }}

          {
            echo "## Sweep on $today"
            echo ""
            echo "**$count expired allowlist entr$( [ "$count" -eq 1 ] && echo 'y' || echo 'ies' )** still need attention."
            echo "Either the CVE is still matched against the latest image, or no"
            echo "published image was available to verify. For each, decide:"
            echo ""
            echo "1. Bump the \`# expires:\` date with a fresh justification, or"
            echo "2. Remove the entry (and accept the failing \`*-grype\` job until the"
            echo "   underlying CVE is fixed)."
            echo ""
            echo '<details><summary>Sweep report</summary>'
            echo ''
            echo '```json'
            jq '.to_review' sweep-report.json
            echo '```'
            echo ''
            echo '</details>'
          } > /tmp/issue-body.md

          existing=$(gh issue list \
            --label "$ISSUE_LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md
            echo "Updated issue #$existing"
            number="$existing"
          else
            url=$(gh issue create \
              --title "grype allowlist: $count expired entr$( [ "$count" -eq 1 ] && echo 'y' || echo 'ies' ) need review" \
              --label "$ISSUE_LABEL,ci" \
              --body-file /tmp/issue-body.md)
            echo "$url"
            number=$(printf '%s' "$url" | sed -nE 's#.*/issues/([0-9]+).*#\1#p')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # For each component with an expired-but-unverifiable entry, build
      # the Dockerfile locally, bump the Chainguard base digest, reconcile
      # the allowlist and open ONE signed PR per component — linked back to
      # the review issue above. This is what turns the issue from "here's a
      # list, go fix it by hand" into actionable, CI-checked PRs.
      # grype-refresh skips any component whose allowlist is already in sync.
      - name: Open per-component refresh PRs
        if: steps.sweep.outputs.to_review != '0'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          REVIEW_ISSUE: ${{ steps.review-issue.outputs.number }}
        run: |
          set -euo pipefail
          # Start from a clean tree: the to_remove path above may have left
          # .grype.yaml edits in the working copy, and grype-refresh needs
          # to branch off a pristine main.
          git reset --hard
          # Sign the refresh commits with the maintainer key when the
          # secrets are present (same setup as dependabot-rewrite / the
          # release job); otherwise fall back to an unsigned bot identity.
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
              --pinentry-mode loopback --sign > /dev/null
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
            UID_LINE=$(gpg --list-keys --with-colons "$KEY_ID" | awk -F: '/^uid/{print $10; exit}')
            git config user.name  "${UID_LINE%% <*}"
            git config user.email "$(printf '%s' "$UID_LINE" | sed -nE 's/.*<([^>]+)>.*/\1/p')"
            git config user.signingkey "$KEY_ID"
            git config commit.gpgsign true
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
          fi
          if [ -n "$REVIEW_ISSUE" ]; then
            python scripts/grype-refresh.py --all --issue "$REVIEW_ISSUE"
          else
            python scripts/grype-refresh.py --all
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo '## grype-allowlist-sweep'
            echo ''
            echo "- to_remove (auto-PR): \`${{ steps.sweep.outputs.to_remove }}\`"
            echo "- to_review (issue):   \`${{ steps.sweep.outputs.to_review }}\`"
            echo ''
            if [ -f sweep-report.json ]; then
              echo '<details><summary>Full report</summary>'
              echo ''
              echo '```json'
              cat sweep-report.json
              echo '```'
              echo ''
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
