# Runs `terragrunt apply` for an environment when its deploy PR — opened by
# infra-plan.yml from `deploy/<env>-<version>` into `deploy/<env>` — is
# MERGED, then fast-forwards main onto the result.
#
# WHY THE PR STOPS AT deploy/<env>
#
# `on.pull_request` can only filter the base branch, never the head. A PR
# into main therefore matches every workflow watching for PRs into main —
# ci and dependabot-rewrite-signal both opened empty runs on it, and no
# job-level `if` can stop a run record from being created. Keeping the PR
# inside deploy/* means those triggers simply do not match.
#
# main is reached from here instead, after the apply has succeeded, so main
# never records a version that was not deployed.
#
# THE PUSH TO main
#
# Authenticated with RELEASE_PAT. Its owner is a bypass actor on main's
# ruleset (`bypass_mode: always`), so the push is not subject to the
# pull_request / required_signatures / non_fast_forward rules. An earlier
# attempt at this push failed with GH013 — not because the ruleset forbids
# it, but because the job checked out with GITHUB_TOKEN. The review has not
# been skipped, it happened on the deploy PR.
#
# `closed` fires on both merge and close-without-merge, hence the
# `merged == true` guard: abandoning a deploy PR must not deploy.
#
# WHAT THIS JOB DOES NOT DO
#
# It does not bump. infra-plan wrote the version into config.yaml on
# deploy/<env>, terragrunt planned against it, and a reviewer approved that
# exact diff — the number is settled before this runs. Re-deriving it here
# could only produce a different answer, and a different answer would mean
# applying something other than what was approved.
#
# ORDER, AND WHAT A FAILURE LEAVES BEHIND
#
# apply, then tag. A failed apply leaves main carrying the version but no
# tag and no release, so nothing claims to have been deployed. multicz then
# sees configs-<env> as released-at-nothing and the next cycle proposes the
# following version — the environment stays visibly owed rather than
# silently marked done.
#
# NO CLOUD PROVIDER IS WIRED YET — see infrastructure/root.hcl and the TODO
# below. Until then an apply is a no-op against local state.

name: infra-apply

on:
  pull_request:
    # `branches:` filters on the PR's BASE, so this is "PRs targeting a
    # deploy branch". `*` does not match `/`, so this catches
    # deploy/staging but not a nested name.
    branches: ["deploy/*"]
    types: [closed]

concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-env:
    name: resolve-env
    # Merged, not merely closed.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.name.outputs.env }}
    steps:
      - id: name
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        # The BASE names the environment: deploy/staging -> staging. The
        # head carries the version too (deploy/staging-0.1.0) and is
        # deliberately not used for this — the version is read from the
        # merged tree, which is the only copy that was planned against.
        run: echo "env=${BASE#deploy/}" >> "$GITHUB_OUTPUT"

  apply:
    name: apply (${{ needs.resolve-env.outputs.env }})
    needs: [resolve-env]
    runs-on: ubuntu-latest
    # Second gate on top of the branch protection: Settings -> Environments
    # -> required reviewers.
    environment: ${{ needs.resolve-env.outputs.env }}
    # Serialised per environment only. This job no longer writes to main,
    # so it does not need the repo-wide push-to-main lock; two environments
    # applying at once is fine and desirable.
    concurrency:
      group: infra-apply-${{ needs.resolve-env.outputs.env }}
      cancel-in-progress: false
    permissions:
      contents: write   # push the release tag
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit itself, not the branch tip: what was approved
          # is what gets applied, even if the branch moves meanwhile.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          # RELEASE_PAT, not GITHUB_TOKEN. The owner is a bypass actor on
          # main's ruleset; the bot is not, and the push below is refused
          # with GH013 under GITHUB_TOKEN. Falling back to it keeps the
          # apply and the tag working on a fork or without the secret — the
          # push to main is the only step that then fails, and it fails
          # loudly.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      - uses: ./.github/actions/setup-terragrunt

      # TODO(provider): add the cloud login here (OIDC). This identity is
      # the write one — keep it distinct from the read-only identity
      # infra-plan.yml uses.

      - name: Guard against an unknown environment
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          # A `deploy/<anything>` branch triggers this workflow. Without
          # this check, `deploy/oops` would run an apply with ENV=oops,
          # terragrunt would fail to find the config, and the failure would
          # read as an infrastructure problem rather than a typo.
          if [ ! -f "infrastructure/configs/${ENV}/config.yaml" ]; then
            echo "::error::no infrastructure/configs/${ENV}/config.yaml — '${ENV}' is not a known environment"
            exit 1
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1

      - name: Read the version this deploy releases
        id: version
        run: |
          set -euo pipefail
          # `multicz get` READS the component's version from its bump_file;
          # it computes nothing. That distinction is the whole design here:
          # infra-plan already ran `multicz bump`, wrote this number into
          # config.yaml and had terragrunt plan against it, and a reviewer
          # approved that exact diff. Running `multicz bump` again would see
          # an already-bumped config.yaml with no tag yet and propose
          # 0.1.0 -> 0.2.0 — releasing a version nobody planned and applying
          # something other than what was approved.
          VERSION=$(multicz get "configs-${ENV}")
          if [ -z "$VERSION" ]; then
            echo "::error::multicz could not read the version of configs-${ENV}"
            exit 1
          fi

          TAG="configs-${ENV}-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            # Re-merging a branch, or a rerun after the push already landed.
            # Applying again would be harmless (terraform converges) but
            # moving a published tag would not.
            echo "::error::${TAG} already exists — this deploy has already been released"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "applying and releasing ${TAG}"
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}

      - name: Configure git
        # Through `env:`, never interpolated into the `run:` body — the
        # login is attacker-influenced (anyone can open the PR) and `${{ }}`
        # is substituted before bash sees the line.
        #
        # `github.event.head_commit` does not exist on a pull_request event;
        # it was left over from the old `push` trigger and silently resolved
        # to empty, so every release commit was authored by the bot anyway.
        # The merger is the meaningful attribution here: they are the one who
        # approved the deploy.
        env:
          ACTOR: ${{ github.event.pull_request.merged_by.login }}
        run: |
          git config user.name  "${ACTOR:-github-actions[bot]}"
          git config user.email "${ACTOR:-41898282+github-actions[bot]}@users.noreply.github.com"

      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      # ── apply, THEN tag ──────────────────────────────────────────────
      #
      # Nothing leaves this runner until the apply succeeds, so a failed
      # apply publishes no tag and no release.
      - name: Terragrunt apply
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          # The merged tree already carries the version infra-plan planned
          # against, so this applies the reviewed plan rather than a fresh
          # one computed here.
          terragrunt --non-interactive --working-dir infrastructure/services \
            run --all -- apply -auto-approve -input=false

      - name: Rebase onto main, tag, and push atomically
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ENV: ${{ needs.resolve-env.outputs.env }}
          # Through env:, never interpolated into the run: body — a login is
          # attacker-influenced and ${{ }} is substituted before bash sees it.
          MERGER: ${{ github.event.pull_request.merged_by.login }}
          MERGER_ID: ${{ github.event.pull_request.merged_by.id }}
        run: |
          set -euo pipefail
          SIGN_FLAG=""
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then SIGN_FLAG="-s"; fi

          # WHY A REBASE AND NOT A PLAIN PUSH
          #
          # deploy/<env> was levelled with main when infra-plan built the
          # proposal, but the reviewer takes as long as they take. Any push
          # to main in between — and ci.yml writes a chore(release) commit
          # on most runs — leaves this push non-fast-forward. A plain
          # `git push HEAD:main` would simply be rejected AFTER the apply had
          # already run, leaving the infrastructure changed and nothing on
          # main saying so.
          #
          # The rebase replays a single commit: the configs-<env> bump. The
          # merge commit is dropped, which is what we want — main takes the
          # bump, not the branch topology.
          #
          # WHY --atomic
          #
          # `git push origin HEAD:main refs/tags/X` is NOT atomic by default:
          # the tag can land while the branch is rejected. That has happened
          # here three times, most memorably leaving both environments tagged
          # v0.1.0 with config.yaml still reading 0.0.0. --atomic makes the
          # server take both or neither.
          #
          # The tag is created inside the loop, after the rebase, because the
          # rebase gives the commit a new SHA each time.
          pushed=false
          for attempt in 1 2 3; do
            git fetch --quiet origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              # CHANGELOG.md and zensical.toml are the realistic conflicts:
              # both are rewritten by every release. This is not something to
              # resolve blind — the apply has already run, so the
              # infrastructure is live and only the record is missing.
              echo "::error::the ${TAG} bump conflicts with main. The apply SUCCEEDED — infrastructure is live but unrecorded. Rebase infrastructure/configs/${ENV} onto main by hand, then tag ${TAG} and push."
              exit 1
            fi

            # Re-attribute the commit to whoever merged.
            #
            # The bump is written by the planner, long before anyone merges,
            # so at creation time the merger is unknown and the author is the
            # bot. The rebase rewrites the commit anyway — this is the first
            # moment the answer exists, and the last moment it can be set.
            #
            # `Configure git` above only fixes the COMMITTER; a rebase keeps
            # the original author, which is why release commits on main read
            # "github-actions[bot]" with a human committer.
            if [ -n "${MERGER:-}" ]; then
              git commit --amend --no-edit \
                --author="${MERGER} <${MERGER_ID}+${MERGER}@users.noreply.github.com>"
            fi

            git tag -f -a $SIGN_FLAG -m "configs-${ENV} v${VERSION} (applied)" "$TAG"

            if git push --atomic origin "HEAD:main" "refs/tags/${TAG}"; then
              pushed=true
              echo "main fast-forwarded onto the ${TAG} bump"
              break
            fi
            echo "main moved during attempt ${attempt} — refetching and replaying"
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::could not land ${TAG} on main after 3 attempts. The apply SUCCEEDED — infrastructure is live but unrecorded. Push the bump and the tag by hand."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Same shape as every release-<component> job in ci.yml: multicz
          # renders the notes for the tag, gh publishes them. `--tag` reads
          # a tag that already exists, which is why this runs after the push
          # and not before.
          #
          # The notes carry the upstream section multicz's upstream-notes
          # plugin builds from this component's depends_on — the infra and
          # infra-modules-* commits this deploy actually shipped. That is the
          # part a reader of the release wants and cannot reconstruct from
          # a version number.
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
