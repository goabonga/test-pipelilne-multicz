# Runs `terragrunt apply` for an environment once its deploy PR (opened by
# infra-plan.yml) is merged into `deploy/<env>`.
#
# THE GATE IS THE BRANCH, NOT THIS FILE. Protect every `deploy/*` branch
# with a required approving review, and protect the matching GitHub
# Environment with required reviewers, or anything that can push to
# `deploy/<env>` applies straight to that environment.
#
# On a successful apply the `configs-<env>` component is bumped: if commits
# touching configs/<env>/config.yaml already justify a bump, that drives
# the version and kind; otherwise the deploy is still real and is recorded
# as a forced patch. Either way multicz's `upstream-notes` plugin pulls in
# the `infra` / `infra-modules-*` commits that deploy shipped (from the
# component's depends_on, see multicz.toml). The release commit and tag go
# to `deploy/<env>` first, then fast-forward onto `main`.
#
# WHY NOTHING IS PUSHED TO deploy/<env>
#
# The bump commit goes to `main` only. Two independent reasons, either of
# which is sufficient:
#
#   1. deploy/<env> is protected — changes must go through a pull request —
#      so a bot push is declined (GH006). The branch is a gate, not a place
#      history lives; it picks the release commit up through the next deploy
#      PR, which is cut from main anyway.
#
#   2. This workflow triggers on `push` to deploy/*. Pushing here would
#      re-trigger it, and the `--force <component>:patch` fallback below
#      guarantees a bump every time — an unbounded apply/bump loop. It does
#      not happen today only because GITHUB_TOKEN pushes deliberately do not
#      fire workflow events. Swapping that checkout to a PAT to get past
#      reason 1 would remove that guard and make the loop real, which is why
#      the fix is to stop writing to the branch rather than to authenticate
#      harder.
#
# NO CLOUD PROVIDER IS WIRED YET — see infrastructure/root.hcl and the TODO
# below. Until then an apply is a no-op against local state.

name: infra-apply

on:
  push:
    branches: ["deploy/*"]

concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-env:
    name: resolve-env
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.name.outputs.env }}
    steps:
      - id: name
        run: echo "env=${GITHUB_REF_NAME#deploy/}" >> "$GITHUB_OUTPUT"

  apply:
    name: apply (${{ needs.resolve-env.outputs.env }})
    needs: [resolve-env]
    runs-on: ubuntu-latest
    # Second gate on top of the branch protection: Settings -> Environments
    # -> required reviewers.
    environment: ${{ needs.resolve-env.outputs.env }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      - uses: ./.github/actions/setup-terragrunt

      # TODO(provider): add the cloud login here (OIDC). This identity is
      # the write one — keep it distinct from the read-only identity
      # infra-plan.yml uses.

      - name: Guard against an unknown environment
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          # A `deploy/<anything>` branch triggers this workflow. Without
          # this check, `deploy/oops` would run an apply with ENV=oops,
          # terragrunt would fail to find the config, and the failure would
          # read as an infrastructure problem rather than a typo.
          if [ ! -f "infrastructure/configs/${ENV}/config.yaml" ]; then
            echo "::error::no infrastructure/configs/${ENV}/config.yaml — '${ENV}' is not a known environment"
            exit 1
          fi

      - name: Terragrunt apply
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          terragrunt --non-interactive --working-dir infrastructure/services \
            run --all -- apply -auto-approve -input=false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1

      - name: Configure git
        # Through `env:`, never interpolated into the `run:` body — commit
        # author metadata is attacker-controllable and `${{ }}` is
        # substituted before bash sees the line.
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: Bump configs-<env> and sync main
        env:
          COMPONENT: configs-${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          SIGN_FLAG=""
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then SIGN_FLAG="--sign"; fi

          PENDING=$(multicz plan --output json | jq -r --arg c "$COMPONENT" '.bumps[$c] // empty')
          # Note: no --push. See the "why nothing is pushed to deploy/<env>"
          # note in the workflow header.
          if [ -n "$PENDING" ]; then
            multicz bump --component "$COMPONENT" --commit --tag $SIGN_FLAG --output json
          else
            # Nothing in configs/<env>/config.yaml itself justified a bump —
            # the apply was driven by an infra/** or modules/** change. The
            # deploy still happened, so record it.
            multicz bump --force "${COMPONENT}:patch" --commit --tag $SIGN_FLAG --output json
          fi

          # The release commit goes to main, and --follow-tags carries the
          # release tag with it so the tag can never land without the commit
          # that explains it. That split is not hypothetical: when the push
          # to the protected deploy branch was declined, the tags had
          # already gone through and left both environments tagged v0.1.0
          # with config.yaml still reading 0.0.0.
          #
          # Plain push, not forced: if main has diverged since the deploy PR
          # merged, this fails loudly rather than rewriting someone else's
          # history — reconcile by hand.
          git push origin "HEAD:main" --follow-tags
