# Runs `terragrunt apply` for an environment when its deploy PR — opened by
# infra-plan.yml from `deploy/<env>` into `main` — is MERGED.
#
# THE PR GOES INTO main, NOT INTO deploy/<env>
#
# The bump has to reach main, and main's ruleset allows exactly one way in:
# a reviewed pull request, rebase-merged. This workflow used to apply first
# and then `git push origin HEAD:main`, which that ruleset rejects with
# GH013 — there was no version of that push that could have worked. Now the
# release commit arrives through the merge, and this job pushes no branch at
# all. Only a tag, which no branch rule governs.
#
# `closed` fires on both merge and close-without-merge, hence the
# `merged == true` guard: abandoning a deploy PR must not deploy. The head
# check is what separates a deploy PR from every other PR into main.
#
# WHAT THIS JOB DOES NOT DO
#
# It does not bump. infra-plan wrote the version into config.yaml on
# deploy/<env>, terragrunt planned against it, and a reviewer approved that
# exact diff — the number is settled before this runs. Re-deriving it here
# could only produce a different answer, and a different answer would mean
# applying something other than what was approved.
#
# ORDER, AND WHAT A FAILURE LEAVES BEHIND
#
# apply, then tag. A failed apply leaves main carrying the version but no
# tag and no release, so nothing claims to have been deployed. multicz then
# sees configs-<env> as released-at-nothing and the next cycle proposes the
# following version — the environment stays visibly owed rather than
# silently marked done.
#
# NO CLOUD PROVIDER IS WIRED YET — see infrastructure/root.hcl and the TODO
# below. Until then an apply is a no-op against local state.

name: infra-apply

on:
  pull_request:
    # `branches:` filters on the PR's BASE, which is now main. The head
    # branch is what identifies a deploy PR, and that is checked below —
    # `on:` has no head filter.
    branches: [main]
    types: [closed]

concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-env:
    name: resolve-env
    # Merged, not merely closed — and a deploy PR, not any other PR into
    # main. Every ordinary PR reaches this workflow now that the base is
    # main, so the head-branch check is load-bearing, not decoration.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'deploy/')
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.name.outputs.env }}
    steps:
      - id: name
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: echo "env=${HEAD#deploy/}" >> "$GITHUB_OUTPUT"

  apply:
    name: apply (${{ needs.resolve-env.outputs.env }})
    needs: [resolve-env]
    runs-on: ubuntu-latest
    # Second gate on top of the branch protection: Settings -> Environments
    # -> required reviewers.
    environment: ${{ needs.resolve-env.outputs.env }}
    # Serialised per environment only. This job no longer writes to main,
    # so it does not need the repo-wide push-to-main lock; two environments
    # applying at once is fine and desirable.
    concurrency:
      group: infra-apply-${{ needs.resolve-env.outputs.env }}
      cancel-in-progress: false
    permissions:
      contents: write   # push the release tag
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge result, not the branch tip: what was approved is what
          # gets applied. main's ruleset rebase-merges, so this SHA is the
          # replayed commit on main — which is also where the tag belongs.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      - uses: ./.github/actions/setup-terragrunt

      # TODO(provider): add the cloud login here (OIDC). This identity is
      # the write one — keep it distinct from the read-only identity
      # infra-plan.yml uses.

      - name: Guard against an unknown environment
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          # A `deploy/<anything>` branch triggers this workflow. Without
          # this check, `deploy/oops` would run an apply with ENV=oops,
          # terragrunt would fail to find the config, and the failure would
          # read as an infrastructure problem rather than a typo.
          if [ ! -f "infrastructure/configs/${ENV}/config.yaml" ]; then
            echo "::error::no infrastructure/configs/${ENV}/config.yaml — '${ENV}' is not a known environment"
            exit 1
          fi

      # No multicz here any more. This job reads the version out of the
      # merged tree and tags it; it never computes one. Installing the tool
      # would only invite someone to re-derive a number that has already
      # been reviewed.

      - name: Read the version this deploy releases
        id: version
        run: |
          set -euo pipefail
          # The version comes from the merged tree, not from a fresh
          # computation. infra-plan wrote it into config.yaml on the PR
          # branch and terragrunt planned against it, so re-deriving it here
          # could only produce a different answer — and a different answer
          # would mean applying something other than what was approved.
          VERSION=$(grep -oP '^version:\s*\K\S+' \
            "infrastructure/configs/${ENV}/config.yaml")
          if [ -z "$VERSION" ]; then
            echo "::error::no version: key in infrastructure/configs/${ENV}/config.yaml"
            exit 1
          fi

          TAG="configs-${ENV}-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            # Re-merging a branch, or a rerun after the push already landed.
            # Applying again would be harmless (terraform converges) but
            # moving a published tag would not.
            echo "::error::${TAG} already exists — this deploy has already been released"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "applying and releasing ${TAG}"
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}

      - name: Configure git
        # Through `env:`, never interpolated into the `run:` body — the
        # login is attacker-influenced (anyone can open the PR) and `${{ }}`
        # is substituted before bash sees the line.
        #
        # `github.event.head_commit` does not exist on a pull_request event;
        # it was left over from the old `push` trigger and silently resolved
        # to empty, so every release commit was authored by the bot anyway.
        # The merger is the meaningful attribution here: they are the one who
        # approved the deploy.
        env:
          ACTOR: ${{ github.event.pull_request.merged_by.login }}
        run: |
          git config user.name  "${ACTOR:-github-actions[bot]}"
          git config user.email "${ACTOR:-41898282+github-actions[bot]}@users.noreply.github.com"

      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      # ── apply, THEN tag ──────────────────────────────────────────────
      #
      # Nothing leaves this runner until the apply succeeds, so a failed
      # apply publishes no tag and no release.
      - name: Terragrunt apply
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          # The merged tree already carries the version infra-plan planned
          # against, so this applies the reviewed plan rather than a fresh
          # one computed here.
          terragrunt --non-interactive --working-dir infrastructure/services \
            run --all -- apply -auto-approve -input=false

      - name: Tag the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          SIGN_FLAG=""
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then SIGN_FLAG="-s"; fi
          # An annotated tag on the merged commit — which is on main, so the
          # tag can never point at something main does not contain. That was
          # a real failure before: tags landed while the commit explaining
          # them was rejected, leaving both environments tagged v0.1.0 with
          # config.yaml still reading 0.0.0. With the commit arriving through
          # the merge, the ordering is no longer ours to get wrong.
          #
          # No `multicz bump` here: the bump is already in the tree, written
          # by infra-plan and reviewed in the PR. Re-running it would compute
          # 0.1.0 -> 0.2.0 off the already-bumped config.yaml and release a
          # version nobody planned.
          git tag -a $SIGN_FLAG -m "configs-${ENV} v${VERSION} (applied)" "$TAG"

      - name: Push the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag, and nothing else. No branch is written by this workflow —
          # main's ruleset would refuse the push, and it has nothing to say
          # that the merge has not already said.
          git push origin "refs/tags/${TAG}"
