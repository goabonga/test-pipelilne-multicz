# Runs `terragrunt apply` for an environment when its deploy PR (opened by
# infra-plan.yml) is MERGED into `deploy/<env>`.
#
# The trigger is `pull_request: [closed]` gated on `merged == true`, not
# `push`. On `push` any write to deploy/* started an apply — a manual push,
# or a branch fast-forward — so an apply could run without anyone approving
# the PR, which is exactly what happened: configs-staging-v0.1.0 and
# configs-production-v0.1.0 were tagged off a hand-pushed branch update
# while the PR was still open.
#
# `closed` fires on both merge and close-without-merge, hence the
# `merged == true` guard: abandoning a deploy PR must not deploy.
#
# The `configs-<env>` component is bumped BEFORE the apply, and the release
# is pushed only once the apply succeeds. config.yaml's `version:` is a plan
# input — services/example stamps it on every resource as `config-version` —
# so bumping afterwards left the infrastructure permanently one version
# behind the release naming it. infra-plan previews the same version, so the
# plan a reviewer approved is the plan that runs.
#
# multicz's `upstream-notes` plugin pulls the `infra` / `infra-modules-*`
# commits that deploy shipped into the changelog (from the component's
# depends_on, see multicz.toml).
#
# WHY NOTHING IS PUSHED TO deploy/<env>
#
# The bump commit goes to `main` only. Two independent reasons, either of
# which is sufficient:
#
#   1. deploy/<env> is protected — changes must go through a pull request —
#      so a bot push is declined (GH006). The branch is a gate, not a place
#      history lives; it picks the release commit up through the next deploy
#      PR, which is cut from main anyway.
#
#   2. Historically this workflow triggered on `push` to deploy/*, so
#      pushing here re-triggered it. That is no longer the trigger, but
#      writing to the branch would still be pointless: the branch is a gate,
#      and main is where the release history belongs.
#
# NO CLOUD PROVIDER IS WIRED YET — see infrastructure/root.hcl and the TODO
# below. Until then an apply is a no-op against local state.

name: infra-apply

on:
  pull_request:
    # `branches:` filters on the PR's BASE, so this is "PRs targeting a
    # deploy branch".
    branches: ["deploy/*"]
    types: [closed]

concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-env:
    name: resolve-env
    # Merged, not merely closed.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.name.outputs.env }}
    steps:
      - id: name
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: echo "env=${BASE#deploy/}" >> "$GITHUB_OUTPUT"

  apply:
    name: apply (${{ needs.resolve-env.outputs.env }})
    needs: [resolve-env]
    runs-on: ubuntu-latest
    # Second gate on top of the branch protection: Settings -> Environments
    # -> required reviewers.
    environment: ${{ needs.resolve-env.outputs.env }}
    # Same lock as ci.yml's main-writing jobs — this workflow pushes the
    # bump commit to main too, from a different run entirely.
    concurrency:
      group: push-to-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit itself, not the branch tip: what was approved
          # is what gets applied, even if the branch moves meanwhile.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      - uses: ./.github/actions/setup-terragrunt

      # TODO(provider): add the cloud login here (OIDC). This identity is
      # the write one — keep it distinct from the read-only identity
      # infra-plan.yml uses.

      - name: Guard against an unknown environment
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          # A `deploy/<anything>` branch triggers this workflow. Without
          # this check, `deploy/oops` would run an apply with ENV=oops,
          # terragrunt would fail to find the config, and the failure would
          # read as an infrastructure problem rather than a typo.
          if [ ! -f "infrastructure/configs/${ENV}/config.yaml" ]; then
            echo "::error::no infrastructure/configs/${ENV}/config.yaml — '${ENV}' is not a known environment"
            exit 1
          fi

      # No multicz here any more. This job reads the version out of the
      # merged tree and tags it; it never computes one. Installing the tool
      # would only invite someone to re-derive a number that has already
      # been reviewed.

      - name: Read the version this deploy releases
        id: version
        run: |
          set -euo pipefail
          # The version comes from the merged tree, not from a fresh
          # computation. infra-plan wrote it into config.yaml on the PR
          # branch and terragrunt planned against it, so re-deriving it here
          # could only produce a different answer — and a different answer
          # would mean applying something other than what was approved.
          VERSION=$(grep -oP '^version:\s*\K\S+' \
            "infrastructure/configs/${ENV}/config.yaml")
          if [ -z "$VERSION" ]; then
            echo "::error::no version: key in infrastructure/configs/${ENV}/config.yaml"
            exit 1
          fi

          TAG="configs-${ENV}-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            # Re-merging a branch, or a rerun after the push already landed.
            # Applying again would be harmless (terraform converges) but
            # moving a published tag would not.
            echo "::error::${TAG} already exists — this deploy has already been released"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "applying and releasing ${TAG}"
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}

      - name: Configure git
        # Through `env:`, never interpolated into the `run:` body — the
        # login is attacker-influenced (anyone can open the PR) and `${{ }}`
        # is substituted before bash sees the line.
        #
        # `github.event.head_commit` does not exist on a pull_request event;
        # it was left over from the old `push` trigger and silently resolved
        # to empty, so every release commit was authored by the bot anyway.
        # The merger is the meaningful attribution here: they are the one who
        # approved the deploy.
        env:
          ACTOR: ${{ github.event.pull_request.merged_by.login }}
        run: |
          git config user.name  "${ACTOR:-github-actions[bot]}"
          git config user.email "${ACTOR:-41898282+github-actions[bot]}@users.noreply.github.com"

      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      # ── apply, THEN tag, THEN push ───────────────────────────────────
      #
      # Nothing leaves this runner until the apply succeeds. A failed apply
      # therefore leaves no tag and no release: configs-<env> stays pending,
      # which is exactly the state that makes infra-plan open the PR again.
      - name: Terragrunt apply
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          # The merged tree already carries the version infra-plan planned
          # against, so this applies the reviewed plan rather than a fresh
          # one computed here.
          terragrunt --non-interactive --working-dir infrastructure/services \
            run --all -- apply -auto-approve -input=false

      - name: Tag the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          SIGN_FLAG=""
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then SIGN_FLAG="-s"; fi
          # An annotated tag on the merge commit. No `multicz bump` here:
          # the bump is already in the tree, made by infra-plan and reviewed
          # in the PR. Re-running it would compute 0.1.0 -> 0.2.0 off the
          # already-bumped config.yaml and release a version nobody planned.
          git tag -a $SIGN_FLAG -m "configs-${ENV} v${VERSION} (applied)" "$TAG"

      - name: Push the release to main
        run: |
          set -euo pipefail
          # --follow-tags carries the release tag with the commit, so the tag
          # can never land without the commit that explains it. That split is
          # not hypothetical: when the push to the protected deploy branch was
          # declined, the tags had already gone through and left both
          # environments tagged v0.1.0 with config.yaml still reading 0.0.0.
          #
          # Plain push, not forced: if main has diverged since the deploy PR
          # merged, this fails loudly rather than rewriting someone else's
          # history — reconcile by hand.
          git push origin "HEAD:main" --follow-tags
