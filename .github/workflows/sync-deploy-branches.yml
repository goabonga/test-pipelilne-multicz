# Fast-forward each deploy/<env> branch onto main whenever that environment
# owes no deploy.
#
# WHY THIS EXISTS
#
# infra-plan opens its PR from main into deploy/<env>, so the diff is the
# whole repository, not just infrastructure/. The branch only advanced when
# a deploy PR merged, so everything landing on main in between piled up:
# 51 commits behind, 106 files and 3109 insertions in the PR, of which 12
# files and 133 insertions were actually infrastructure. A reviewer asked to
# approve an apply was reading 95% noise.
#
# Keeping the branch level with main when nothing is pending means the next
# deploy PR shows only what is genuinely being applied.
#
# WHY THE PENDING CHECK
#
# `configs-<env>` pending in multicz IS the ledger of what is owed. If it is
# pending, the branch must stay put — fast-forwarding it would erase the very
# diff the deploy PR needs to show, and the apply would be approved blind.
#
# WHY RELEASE_PAT
#
# GITHUB_TOKEN was the first choice, precisely because its pushes fire no
# workflow events and so could not start an apply. It does not work: the
# deploy branches are protected, and the bot is not an admin, so the push is
# declined with GH006. The owner's PAT bypasses that (enforce_admins is
# false).
#
# The consequence — a PAT push to deploy/* does trigger infra-apply — is
# handled at the other end rather than here: infra-apply now checks whether
# a deploy is actually owed and no-ops when it is not. That check is worth
# having on its own; before it, any push to deploy/* force-bumped
# configs-<env>, recording a release for a deploy that deployed nothing.

name: sync-deploy-branches

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: sync-deploy-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The PAT, not GITHUB_TOKEN — see the header.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1

      - name: Fast-forward the branches that owe nothing
        run: |
          set -euo pipefail
          PENDING=$(multicz plan --output json | jq -s -r '[.[] | .bumps // {}] | add | keys[]')

          for dir in infrastructure/configs/*/; do
            ENV_NAME=$(basename "$dir")
            BRANCH="deploy/${ENV_NAME}"

            if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "  ${BRANCH}: absent, skipping"
              continue
            fi

            # An open deploy PR is the hard stop, and it is checked FIRST
            # because it is the only signal that cannot be wrong.
            #
            # Fast-forwarding a branch up to the head of a PR that targets
            # it IS merging that PR: GitHub marks it merged the moment the
            # head commits become reachable from the base. infra-apply
            # triggers on `merged == true`, so this workflow silently
            # approved a deploy on its own — PR #174 was created at
            # 12:30:42 and merged by this job at 12:31:51, with nobody
            # having looked at the plan.
            #
            # The pending check below was supposed to prevent that, and it
            # is genuinely useful, but it answers a different question:
            # "does multicz think work is owed", not "is a human currently
            # being asked to approve something". Those disagreed exactly
            # once and that was enough — a stray release had cleared
            # configs-* while the PR sat open.
            OPEN_PR=$(gh pr list --base "$BRANCH" --head main --state open \
              --json number --jq '.[0].number // empty')
            if [ -n "$OPEN_PR" ]; then
              echo "  ${BRANCH}: deploy PR #${OPEN_PR} is open — moving the branch would merge it"
              continue
            fi

            if echo "$PENDING" | grep -qx "configs-${ENV_NAME}"; then
              echo "  ${BRANCH}: a deploy is owed — left where it is so the PR shows it"
              continue
            fi

            BEHIND=$(git rev-list --count "origin/${BRANCH}..origin/main")
            if [ "$BEHIND" = "0" ]; then
              echo "  ${BRANCH}: already level with main"
              continue
            fi

            # No --force: a non-fast-forward means the branch carries commits
            # main does not have, which is not something to paper over.
            if git push origin "origin/main:refs/heads/${BRANCH}"; then
              echo "  ${BRANCH}: fast-forwarded ${BEHIND} commits onto main"
            else
              echo "::warning::${BRANCH} is not a fast-forward of main — reconcile by hand"
            fi
          done

      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: sync-deploy-branches
          body: 'Fast-forwarded each `deploy/<env>` onto `main` where that environment owed no deploy, so the next deploy PR diffs only what is being applied.'
