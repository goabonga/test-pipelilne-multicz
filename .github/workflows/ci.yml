    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci   # root install — hoists the npm workspace (lib + web)
      - name: Biome lint — web
        run: npm run lint
        working-directory: packages/web
      - name: Summary
