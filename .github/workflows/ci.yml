      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - name: helm lint — chart-worker
        run: helm lint packages/worker/chart
      - name: helm template smoke — chart-worker
        run: helm template ci packages/worker/chart > /tmp/chart-worker.yaml
