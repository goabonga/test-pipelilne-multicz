  web-build:
    # Build the JS/CSS bundle + Jinja templates and publish them as
    # the `web-dist` artifact. The downstream Python ssr
    # package consumes the artifact (ssr-test / ssr-container /
    # ssr-deb) so a stale committed dist on a contributor's branch
