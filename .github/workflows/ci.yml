# CI gate. Per-component named jobs — no matrix, every job is its own
# graph node. Shape per component (python/buildable/chart/js):
#
#                   ┌─ X-lint       ─┐                       ┌─ X-container ─ X-sbom ─ X-grype
#   detect ─ headers ─ X-format     ─┼─ X-test ─ X-bandit ─┐ │
#                   ├─ X-typecheck  ─┘                     │ ├─ X-deb
#                   └─ ...                                  ─┤
#                                            audit ────────┘ │
#                                                            └─ (per-component fan-out)
#
# Always-on (no needs.detect): headers, validate, docs.
#
# Per-component conditional `if:` uses
# `contains(fromJson(needs.detect.outputs.changed), '<name>')` —
# detect must be in `needs:` directly because GitHub Actions only
# exposes outputs for direct needs, not transitive.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ─────────────────────── always-on (detect, headers, validate) and docs (gated) ───────────────────────

  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.json }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changed
        uses: goabonga/multicz-action/changed@v1
        with:
          output: json
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: detect
          body: |
            Changed components: `${{ steps.changed.outputs.json }}`

  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: SPDX license headers
        run: |
          uv run python scripts/add_license_header.py --path packages --check
          uv run python scripts/add_license_header.py --path scripts --check
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: headers
          body: SPDX header check on `packages/` and `scripts/`.

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: goabonga/multicz-action@v1
      - name: multicz validate
        run: multicz validate --strict
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: '`multicz validate --strict` on the workspace config.'

  docs-build:
    # Pure smoke check — fires on PR + main when something
    # docs-related changed. Validates the zensical build doesn't
    # break, nothing else. No artifact, no Pages-specific tooling.
    # docs-deploy gates on this passing before it does its own
    # full-chain build + upload + deploy.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Install workspace + doc group
        run: uv sync --frozen --all-packages --group doc
      - name: Zensical build
        run: uv run zensical build
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs-build
          body: '`zensical build` smoke check.'

  docs-deploy:
    # Self-contained: re-runs the build, uploads it as a Pages
    # artifact, deploys, then bumps + tags + cuts the GitHub
    # Release. Gated on main; auto-skipped when docs-build skipped
    # (no docs change) or fails (broken build).
    needs: [docs-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # multicz bump push
      pages: write      # actions/deploy-pages
      id-token: write   # OIDC for actions/deploy-pages + actions/upload-pages-artifact
    concurrency:
      # Pages best-practice — one in-flight deploy per repo, cancel
      # any older run when a fresher push lands.
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace + doc group
        run: uv sync --frozen --all-packages --group doc

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: goabonga/multicz-action@v1

      # ─── 1. write-only bump: VERSION line + pyproject get the new
      #    docs version on disk, nothing committed / tagged / pushed yet.
      - name: Bump docs (write only)
        run: multicz bump --component docs

      # ─── 2. build with the just-bumped values in the working tree.
      - name: Zensical build
        run: uv run zensical build

      # ─── 3. publish the built site to Pages.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # ─── 4. now that the build + deploy succeeded, materialise the
      #    release in git: commit (chore(release): bump docs ...),
      #    tag (docs-vX.Y.Z), push --follow-tags.
      #
      #    A second `multicz bump` is idempotent — it re-plans, sees
      #    the same target version, re-writes the bump_files no-op,
      #    then `git add` the already-dirty files and creates the
      #    release commit + tag.
      - name: Commit, tag, push docs
        run: multicz bump --component docs --commit --tag --push

      - name: Cut GitHub Release for the docs tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in
              docs-v*) ;;
              *) continue ;;
            esac
            multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file -
          done
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs-deploy
          body: |
            Deployed to: ${{ steps.deploy.outputs.page_url }}

  # ─────────────────────── api ───────────────────────

  api-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — api
        run: uv run ruff check packages/api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-lint
          body: '`ruff check` on `packages/api/`.'

  api-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — api
        run: uv run ruff format --check packages/api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-format
          body: '`ruff format --check` on `packages/api/`.'

  api-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — api
        run: uv run --with mypy mypy --strict packages/api/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-typecheck
          body: '`mypy --strict` on `packages/api/src/`.'

  api-test:
    needs: [api-lint, api-format, api-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest — api
        run: uv run pytest packages/api/tests -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-test
          body: '`pytest` on `packages/api/tests/`.'

  api-bandit:
    needs: [api-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — api
        run: bandit -r packages/api/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-bandit
          body: '`bandit -r` on `packages/api/src/`.'

  api-container:
    needs: [api-bandit, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: packages/api
          load: true
          tags: api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Save image tarball
        run: docker save api:ci -o /tmp/api.tar
      - uses: actions/upload-artifact@v7
        with: { name: api-image, path: /tmp/api.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-container
          body: 'Built `api:ci` (saved to artifact `api-image`).'

  api-sbom:
    needs: [api-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6   # need .github/actions/summary on disk
      - uses: actions/download-artifact@v8
        with: { name: api-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/api.tar -o spdx-json=/tmp/api.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: api-sbom, path: /tmp/api.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-sbom
          body: 'SPDX SBOM via `syft` (artifact `api-sbom`).'

  api-grype:
    needs: [api-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: api-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        run: grype sbom:/tmp/api.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-grype
          body: '`grype --fail-on high` on the api SBOM.'

  api-deb:
    # Smoke-build the .deb on every change so packaging regressions
    # surface in PR CI, not only when release.yml fires.
    needs: [api-bandit, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build api .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-api
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/api "$WORK/shomer-api"
          cd "$WORK/shomer-api"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-api_*.deb "$WORK"/shomer-api_*.buildinfo "$WORK"/shomer-api_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: api-deb, path: /tmp/shomer-api_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-deb
          body: 'Built `shomer-api_*.deb` (artifact `api-deb`).'

  api-deb-validate:
    # Three independent gates against the just-built .deb (lintian,
    # pytest, systemd-analyze security). On any failure the artifact
    # is deleted so a broken build can't be mistaken for a working
    # one downstream. See `.github/actions/validate-deb/action.yml`.
    needs: [api-deb]
    runs-on: ubuntu-latest
    permissions:
      actions: write   # delete-artifact (cleanup on validation failure)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-deb-validate
          body: 'lintian + `tests/install/test_api.py` + `systemd-analyze security` (display score ≤ 1.0).'

  # ─────────────────────── worker ───────────────────────

  worker-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'worker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — worker
        run: uv run ruff check packages/worker
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-lint
          body: '`ruff check` on `packages/worker/`.'

  worker-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'worker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — worker
        run: uv run ruff format --check packages/worker
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-format
          body: '`ruff format --check` on `packages/worker/`.'

  worker-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'worker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — worker
        run: uv run --with mypy mypy --strict packages/worker/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-typecheck
          body: '`mypy --strict` on `packages/worker/src/`.'

  worker-test:
    needs: [worker-lint, worker-format, worker-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest — worker
        run: uv run pytest packages/worker/tests -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-test
          body: '`pytest` on `packages/worker/tests/`.'

  worker-bandit:
    needs: [worker-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — worker
        run: bandit -r packages/worker/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-bandit
          body: '`bandit -r` on `packages/worker/src/`.'

  worker-container:
    needs: [worker-bandit, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@v4
      - name: Build worker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: packages/worker
          load: true
          tags: worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Save image tarball
        run: docker save worker:ci -o /tmp/worker.tar
      - uses: actions/upload-artifact@v7
        with: { name: worker-image, path: /tmp/worker.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-container
          body: 'Built `worker:ci` (saved to artifact `worker-image`).'

  worker-sbom:
    needs: [worker-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: worker-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/worker.tar -o spdx-json=/tmp/worker.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: worker-sbom, path: /tmp/worker.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-sbom
          body: 'SPDX SBOM via `syft` (artifact `worker-sbom`).'

  worker-grype:
    needs: [worker-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: worker-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        run: grype sbom:/tmp/worker.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-grype
          body: '`grype --fail-on high` on the worker SBOM.'

  worker-deb:
    needs: [worker-bandit, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build worker .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-worker
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/worker "$WORK/shomer-worker"
          cd "$WORK/shomer-worker"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-worker_*.deb "$WORK"/shomer-worker_*.buildinfo "$WORK"/shomer-worker_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: worker-deb, path: /tmp/shomer-worker_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-deb
          body: 'Built `shomer-worker_*.deb` (artifact `worker-deb`).'

  worker-deb-validate:
    needs: [worker-deb]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: worker
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: worker-deb-validate
          body: 'lintian + `tests/install/test_worker.py` + `systemd-analyze security` (display score ≤ 1.0).'

  # ─────────────────────── web ───────────────────────

  web-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — web
        run: uv run ruff check packages/web
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-lint
          body: '`ruff check` on `packages/web/`.'

  web-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — web
        run: uv run ruff format --check packages/web
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-format
          body: '`ruff format --check` on `packages/web/`.'

  web-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — web
        run: uv run --with mypy mypy --strict packages/web/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-typecheck
          body: '`mypy --strict` on `packages/web/src/`.'

  web-test:
    needs: [web-lint, web-format, web-typecheck, web-frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/download-artifact@v8
        with: { name: web-frontend-dist, path: . }   # restores packages/web/src/shomer_web/{static,templates}/
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest — web
        run: uv run pytest packages/web/tests -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-test
          body: '`pytest` on `packages/web/tests/`.'

  web-bandit:
    needs: [web-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — web
        run: bandit -r packages/web/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-bandit
          body: '`bandit -r` on `packages/web/src/`.'

  web-container:
    needs: [web-bandit, audit, web-frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/download-artifact@v8
        with: { name: web-frontend-dist, path: . }
      - uses: docker/setup-buildx-action@v4
      - name: Build web image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: packages/web
          load: true
          tags: web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Save image tarball
        run: docker save web:ci -o /tmp/web.tar
      - uses: actions/upload-artifact@v7
        with: { name: web-image, path: /tmp/web.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-container
          body: 'Built `web:ci` (saved to artifact `web-image`).'

  web-sbom:
    needs: [web-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: web-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/web.tar -o spdx-json=/tmp/web.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: web-sbom, path: /tmp/web.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-sbom
          body: 'SPDX SBOM via `syft` (artifact `web-sbom`).'

  web-grype:
    needs: [web-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: web-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        run: grype sbom:/tmp/web.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-grype
          body: '`grype --fail-on high` on the web SBOM.'

  web-deb:
    needs: [web-bandit, audit, web-frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/download-artifact@v8
        with: { name: web-frontend-dist, path: . }
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build web .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-web
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/web "$WORK/shomer-web"
          cd "$WORK/shomer-web"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-web_*.deb "$WORK"/shomer-web_*.buildinfo "$WORK"/shomer-web_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: web-deb, path: /tmp/shomer-web_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-deb
          body: 'Built `shomer-web_*.deb` (artifact `web-deb`).'

  web-deb-validate:
    needs: [web-deb]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: web
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-deb-validate
          body: 'lintian + `tests/install/test_web.py` + `systemd-analyze security` (display score ≤ 1.0).'

  # ─────────────────────── cli (no container) ───────────────────────

  cli-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'cli')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
