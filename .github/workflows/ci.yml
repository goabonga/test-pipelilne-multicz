      - run: npm ci
      - run: npm run format:check -w packages/lib
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lib-format
          body: '`biome format --check` on `packages/lib/`.'

  lib-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'lib')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w packages/lib
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lib-typecheck
          body: '`tsc --noEmit` on `packages/lib/`.'

  lib-test:
    needs: [lib-lint, lib-format, lib-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test -w packages/lib
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lib-test
          body: '`vitest` on `packages/lib/`.'

  # ─────────────────────── app (React Native) ───────────────────────
  # @shomer/app is NOT a workspace member (RN/Metro hoisting), so its
  # jobs install in packages/app and cache against its own lockfile. It
  # consumes @shomer/lib from ../lib (file: dep / Metro alias), so every
  # job checks out the full repo. DevSecOps surface mirrors the Python
  # chain: lint/format/typecheck/test, supply-chain (npm audit + SBOM +
  # grype), secrets (gitleaks), mobile SAST (mobsfscan), then per-OS
  # build + Maestro E2E (Android on ubuntu, iOS on macOS — both free on
  # this public repo; the iOS simulator needs no Apple account).

  app-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'app')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        working-directory: packages/app
      - run: npm run lint
        working-directory: packages/app
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-lint
          body: '`biome lint` on `packages/app/src`.'

  app-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'app')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        working-directory: packages/app
      - run: npm run format:check
        working-directory: packages/app
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-format
          body: '`biome format --check` on `packages/app/src`.'

  app-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'app')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        working-directory: packages/app
      - run: npm run typecheck
        working-directory: packages/app
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-typecheck
          body: '`tsc --noEmit` on `packages/app/` (resolves @shomer/lib via tsconfig path).'

  app-test:
    needs: [app-lint, app-format, app-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        working-directory: packages/app
      - run: npm test
        working-directory: packages/app
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-test
          body: '`jest` on `packages/app/` — exercises the shared @shomer/lib validation.'

  app-audit:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'app')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        working-directory: packages/app
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-audit
          body: '`npm audit --audit-level=high` on `packages/app/package-lock.json`.'

  app-sbom:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'app')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        working-directory: packages/app
      - name: Generate CycloneDX SBOM
        working-directory: packages/app
        # --ignore-npm-errors: @shomer/lib is linked from ../lib, so its
        # dev-only deps resolve from the root workspace, not packages/app
        # — `npm ls` flags them missing. They aren't shipped, so tolerate
        # the noise and still emit a complete SBOM of the real deps.
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --ignore-npm-errors --output-format JSON --output-file /tmp/app.sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with: { name: app-sbom, path: /tmp/app.sbom.cdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-sbom
          body: 'CycloneDX SBOM via `@cyclonedx/cyclonedx-npm` (artifact `app-sbom`).'

  app-grype:
    needs: [app-sbom]
    if: '!failure() && !cancelled() && needs.app-sbom.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: app-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        run: grype sbom:/tmp/app.sbom.cdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-grype
          body: '`grype --fail-on high` on the app SBOM.'

  app-secrets:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'app')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (filesystem scan)
        run: gitleaks dir packages/app --no-banner --redact --verbose
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-secrets
          body: '`gitleaks` filesystem scan of `packages/app/`.'

  app-mobsfscan:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'app')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv tool install mobsfscan
      - name: mobsfscan (mobile SAST, fail on ERROR/WARNING)
        # Static analysis of the native Android/iOS sources + RN JS for
        # hardcoded secrets, weak crypto, insecure storage/network config.
        # mobsfscan exits non-zero on ANY finding (incl. INFO hardening
        # nags that every RN app trips), so we gate explicitly: fail only
        # on ERROR/WARNING, minus an allowlist of accepted scaffold
        # findings. INFO is reported but advisory.
        run: |
          set -uo pipefail
          uv tool run mobsfscan --json -o /tmp/mobsf.json \
            packages/app/android packages/app/ios packages/app/src || true
          python3 - <<'PY'
          import json, sys

          # Accepted for the RN scaffold (mitigated / not applicable):
          #   task_hijacking on the singleTask launcher activity is RN's
          #   standard launch mode; StrandHogg is mitigated at runtime by
          #   android:taskAffinity="" on MainActivity.
          ACCEPTED = {"android_task_hijacking1", "android_task_hijacking2"}
          GATE = {"ERROR", "WARNING"}

          data = json.load(open("/tmp/mobsf.json"))
          blocking = []
          for rule, info in sorted(data.get("results", {}).items()):
              sev = (info.get("metadata", {}).get("severity") or "").upper()
              print(f"{sev:8} {rule}")
              if sev in GATE and rule not in ACCEPTED:
                  blocking.append(f"{sev} {rule}")
          if blocking:
              print("\nFAIL — unaccepted high-severity findings:")
              print("\n".join(blocking))
              sys.exit(1)
          print("\nOK — no unaccepted ERROR/WARNING findings (INFO is advisory).")
          PY
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-mobsfscan
          body: '`mobsfscan` (MobSF static analysis) on the native + RN sources.'

  app-android-build:
    needs: [app-test]
    if: '!failure() && !cancelled() && needs.app-test.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        working-directory: packages/app
      # assembleRelease embeds the JS bundle and is debug-signed by the
      # RN template, so the APK runs standalone (no Metro) on the
      # emulator and needs no signing secret in PR CI.
      - name: Gradle assembleRelease
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: app-apk
          path: packages/app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-android-build
          body: '`./gradlew assembleRelease` → `app-release.apk` (artifact `app-apk`).'

  app-android-e2e:
    needs: [app-android-build]
    if: '!failure() && !cancelled() && needs.app-android-build.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with: { name: app-apk, path: /tmp }
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # KVM permissions so the x86_64 emulator boots with hardware accel
      # on the (free, public-repo) ubuntu runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r /tmp/app-release.apk
            maestro test packages/app/.maestro
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-android-e2e
          body: 'Android emulator (API 34) + `maestro test packages/app/.maestro` against the installed release APK.'

  app-ios-build:
    needs: [app-test]
    if: '!failure() && !cancelled() && needs.app-test.result == ''success'''
    # First macOS runner in the graph — free on this public repo.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        working-directory: packages/app
      - name: CocoaPods install
        working-directory: packages/app/ios
        run: pod install
      # Unsigned simulator build — no Apple Developer account needed.
      - name: xcodebuild (iphonesimulator)
        working-directory: packages/app/ios
        run: |
          xcodebuild -workspace ShomerApp.xcworkspace -scheme ShomerApp \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip the .app
        working-directory: packages/app/ios
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" /tmp/ShomerApp-sim.app.zip
      - uses: actions/upload-artifact@v7
        with: { name: app-ios-app, path: /tmp/ShomerApp-sim.app.zip, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-ios-build
          body: 'Unsigned `xcodebuild -sdk iphonesimulator` → `ShomerApp.app` (artifact `app-ios-app`).'

  app-ios-e2e:
    needs: [app-ios-build]
    if: '!failure() && !cancelled() && needs.app-ios-build.result == ''success'''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with: { name: app-ios-app, path: /tmp }
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot simulator + install app
        run: |
          set -euo pipefail
          unzip -q /tmp/ShomerApp-sim.app.zip -d /tmp/ios-app
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '\([0-9A-F-]{36}\)' | tr -d '()')
          xcrun simctl boot "$UDID" || true
          # Block until the device is actually usable. `simctl boot` returns
          # as soon as the boot is *requested*, so without this the install
          # and Maestro's XCTest driver both race a simulator that is still
          # coming up — which is what "iOS driver not ready in time" means
          # in practice.
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$(find /tmp/ios-app -maxdepth 1 -name '*.app' | head -n1)"
      - name: Maestro E2E on iOS simulator
        env:
          # Maestro's own error message names this variable. The hosted
          # macos runner hands the XCTest driver over more slowly than the
          # default allows, especially on a cold simulator.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          set -euo pipefail
          # One retry. Driver startup is the flaky part and each attempt is
          # a fresh process, so a retry genuinely re-rolls it rather than
          # hiding a real failure — a broken flow fails both times.
          maestro test packages/app/.maestro || {
            echo "::warning::maestro driver startup failed — retrying once"
            maestro test packages/app/.maestro
          }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: app-ios-e2e
          body: 'iOS simulator + `maestro test packages/app/.maestro` against the installed unsigned app.'

  # ─────────────────────── release (main only, full graph green) ───────────────────────

  # ─────────────────────── infrastructure (terragrunt) ───────────────────────
  #
  # One job per component, gated on multicz's changed set — the same shape
  # every uv-workspace package uses (api-lint / api-test / api-bandit …).
  # No matrix: a module is a component like any other, so it gets its own
  # named jobs, and a red badge says which module broke without expanding
  # anything.
  #
  # Adding a module therefore means adding its four jobs here.
  # scripts/new-terraform-module.sh prints the block to paste.
  #
  # `_template` has no jobs of its own: it is a scaffold, nothing consumes
  # it and it declares no resources, so testing or scanning it reports on
  # code that never runs. Its formatting rides along with `infra`, which is
  # the component it ships in.

  infra-fmt:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'infra')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      - uses: ./.github/actions/setup-terragrunt
      - run: make infra-fmt-check-root
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: infra-fmt
          body: '`terragrunt hcl format --check` on `infrastructure/` + `terraform fmt -check` on the module template.'

  # ── infra-modules-example ──────────────────────────────────────────────

  infra-modules-example-fmt:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'infra-modules-example')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      - run: make infra-fmt-check M=example
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: infra-modules-example-fmt
          body: '`terraform fmt -check` on `infrastructure/modules/example/`.'

  infra-modules-example-test:
    needs: [infra-modules-example-fmt]
    if: >-
      !failure() && !cancelled() &&
      needs.infra-modules-example-fmt.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_wrapper: false
      # No cloud login: the tests use `mock_provider`, which intercepts
      # every provider call. They never reach a real API.
      - run: make infra-test M=example
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: infra-modules-example-test
          body: '`terraform test` on `infrastructure/modules/example/tests/` (offline, `mock_provider`).'

  infra-modules-example-checkov:
    # Same action and pin the chart-*-checkov jobs use, `--framework
    # terraform` instead of helm.
    needs: [infra-modules-example-fmt]
    if: >-
      !failure() && !cancelled() &&
      needs.infra-modules-example-fmt.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7  # v12
        with:
          directory: infrastructure/modules/example
          framework: terraform
          quiet: true
          output_format: cli
          soft_fail: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: infra-modules-example-checkov
          body: '`checkov --framework terraform` on `infrastructure/modules/example/`.'

  infra-modules-example-docs:
    # The module records its version in README.md and gets its
    # terraform-docs block regenerated by a multicz post_bump hook. Add a
    # variable without re-running `make infra-docs` and the next release
    # publishes a README describing the previous interface — silently.
    needs: [infra-modules-example-fmt]
    if: >-
      !failure() && !cancelled() &&
      needs.infra-modules-example-fmt.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-terraform-docs
      - run: make infra-docs-check M=example
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: infra-modules-example-docs
          body: '`terraform-docs --output-check` on `infrastructure/modules/example/README.md`.'

  release-bump:
    # Single bump stage that the whole CI graph funnels into. multicz
    # discovers which components changed since their last tag,
    # commits + tags + pushes ALL of them in one atomic commit. The
    # bumped versions are exposed as job outputs; downstream
    # `release-<component>` publish jobs consume those outputs to
    # decide whether to run.
    #
    # Triple gate:
    #   1. On `main` only — PRs and other branches skip.
    #   2. The HEAD commit must NOT itself be a chore(release) bump
    #      (otherwise the release commit re-triggers CI and we loop).
    #   3. All upstream test / validate / scan needs passed (or were
    #      skipped). Any failure aborts the release.
    needs:
      - detect
      - validate
      - detect            # needed for the per-component if: gate below
      - owasp-api
      - owasp-ssr
      - api-deb-validate
      - job-deb-validate
      - ssr-deb-validate
      - cli-deb-validate
      - chart-api-package
      - chart-api-verify-policy
      - chart-job-package
      - chart-job-verify-policy
      - chart-ssr-package
      - chart-ssr-verify-policy
      - migrations-grype
      - chart-migrations-package
      - chart-migrations-verify-policy
      - docs-build
      - app-android-e2e
      - app-ios-e2e
      - app-grype
      - app-mobsfscan
      - app-secrets
      - app-audit
      - infra-fmt
      - infra-modules-example-fmt
      - infra-modules-example-test
      - infra-modules-example-checkov
      - infra-modules-example-docs
    # Per-component success-required gate. The earlier
    # `!failure() && !cancelled() && main && !chore(release)` shape
    # was too permissive: it accepted skipped upstreams as "fine",
    # which covered the legitimate partial-change case (job not
    # changed → owasp-job skipped, normal) but ALSO covered the
    # dangerous "run was cancelled before the validations dispatched
    # → all queued upstreams marked skipped" case (run 27471716895:
    # release-bump fired anyway, multicz pushed `api-v0.2.1` /
    # `chart-api-v1.0.4` tags before being cancelled, no Docker /
    # .deb / GitHub release ever followed).
    #
    # The fix is structural: for each component, require either
    # (a) it isn't in `detect.outputs.changed` so its validations
    # don't apply, or (b) its final-stage validation actually
    # SUCCEEDED. owasp-X covers the upstream container/sbom/grype
    # transitively (owasp can't succeed without them); same for
    # *-deb-validate and chart-X-package on their stacks.
    if: >-
      !failure() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'api') ||
       (needs.owasp-api.result == 'success' && needs.api-deb-validate.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'ssr') ||
       (needs.owasp-ssr.result == 'success' && needs.ssr-deb-validate.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'job') ||
       needs.job-deb-validate.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'cli') ||
       needs.cli-deb-validate.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api') ||
       (needs.chart-api-package.result == 'success' &&
        needs.chart-api-verify-policy.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'chart-job') ||
       (needs.chart-job-package.result == 'success' &&
        needs.chart-job-verify-policy.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'chart-ssr') ||
       (needs.chart-ssr-package.result == 'success' &&
        needs.chart-ssr-verify-policy.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'migrations') ||
       needs.migrations-grype.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'chart-migrations') ||
       (needs.chart-migrations-package.result == 'success' &&
        needs.chart-migrations-verify-policy.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'docs') ||
       needs.docs-build.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'app') ||
       (needs.app-android-e2e.result == 'success' &&
        needs.app-ios-e2e.result == 'success' &&
        needs.app-grype.result == 'success' &&
        needs.app-mobsfscan.result == 'success' &&
        needs.app-secrets.result == 'success' &&
        needs.app-audit.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'infra') ||
       needs.infra-fmt.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'infra-modules-example') ||
       (needs.infra-modules-example-test.result == 'success' &&
        needs.infra-modules-example-checkov.result == 'success' &&
        needs.infra-modules-example-docs.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push release commit + tags
      actions: write    # dispatch infra-plan.yml, see the last step
    outputs:
      api_version: ${{ steps.bump.outputs.api_version }}
      job_version: ${{ steps.bump.outputs.job_version }}
      cli_version: ${{ steps.bump.outputs.cli_version }}
      ssr_version: ${{ steps.bump.outputs.ssr_version }}
      chart_api_version: ${{ steps.bump.outputs.chart_api_version }}
      chart_job_version: ${{ steps.bump.outputs.chart_job_version }}
      chart_ssr_version: ${{ steps.bump.outputs.chart_ssr_version }}
      migrations_version: ${{ steps.bump.outputs.migrations_version }}
      chart_migrations_version: ${{ steps.bump.outputs.chart_migrations_version }}
      docs_version: ${{ steps.bump.outputs.docs_version }}
      app_version: ${{ steps.bump.outputs.app_version }}
      infra_version: ${{ steps.bump.outputs.infra_version }}
      infra_modules_example_version: ${{ steps.bump.outputs.infra_modules_example_version }}
      owner: ${{ steps.owner.outputs.value }}
      repo: ${{ steps.names.outputs.repo }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"

      - name: Install workspace (post_bump hooks need uv lock)
        run: uv sync --frozen --all-packages

      # Node is required for web's post_bump hook
      # (`npm run build` regenerates packages/ssr/src/shomer_ssr/{static,templates}/).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web deps
        run: npm ci   # root install — hoists the npm workspace (lib + web)

      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1

      # Every infra-modules-* component has a `post_bump` hook that
      # regenerates its README, and multicz shells out to terraform-docs
      # from inside the bump. Without this the release dies mid-flight with
      # a FileNotFoundError raised from multicz — nothing in this job's own
      # steps hints that the tool is needed.
      - uses: ./.github/actions/setup-terraform-docs

      - name: Configure git
        # Author name + email come from the head commit's metadata, which
        # is controllable by anyone who can land a commit on this branch.
        # Plumber's ISSUE-207 catches the previous form where these flowed
        # directly into the `run:` block — a crafted commit message with
        # a bash sequence in the author field would execute. Funnelling
        # through `env:` makes the values plain shell variables that bash
        # interpolates safely under quoted expansion.
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: multicz validate
        run: multicz validate --strict

      - name: multicz plan
        id: plan
        run: |
          set -euo pipefail
          multicz plan --summary "$GITHUB_STEP_SUMMARY" \
            --output json | tee /tmp/plan.json
          # `configs-<env>` components are deployment state, not libraries:
          # they represent what is actually applied in an environment and
          # are bumped only by infra-apply.yml, after a real `terragrunt
          # apply`. Releasing them from here would tag a deploy that never
          # happened. The rule is the name prefix, so a new environment
          # needs no edit in this file.
          # `-s` and `.bumps // {}`: multicz emits TWO json documents here,
          # the plan itself and a trailing `{"advice": ...}` object. A bare
          # `.bumps | keys[]` dies on the second one with "null has no
          # keys" — and the `.bumps | length` this replaced was no better,
          # it printed one number per document and compared "N\n0" against
          # "0", so it read as "something to release" no matter what.
          BUMPS=$(jq -s '[.[] | .bumps // {}] | add' /tmp/plan.json)
          COMPONENTS=$(echo "$BUMPS" | jq -r 'keys[] | select(startswith("configs-") | not)')
          DEFERRED=$(echo "$BUMPS" | jq -r 'keys[] | select(startswith("configs-"))' | paste -sd, -)
          if [ -n "$DEFERRED" ]; then
            echo "[release-bump] deploy-gated, not released here: $DEFERRED"
          fi
          # Explicit --component flags, one per releasable component. A
          # bare `multicz bump` would bump EVERYTHING pending, configs-*
          # included — which is exactly what this filter exists to prevent.
          ARGS=""
          for c in $COMPONENTS; do ARGS="$ARGS --component $c"; done
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          if [ -z "$COMPONENTS" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag, push (signed)
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available == 'true'
        run: |
          set -euo pipefail
          multicz bump ${{ steps.plan.outputs.args }} --commit --tag --push --sign \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.raw
          # multicz interleaves `post_bump: ...` progress lines on
          # stdout BEFORE the final JSON object, so the raw tee
          # output isn't pure JSON. Strip everything before the
          # first standalone `{` (the document's opening brace) so
          # jq downstream sees parseable input, then validate to
          # fail fast if anything's still off — otherwise the empty
          # versions silently skip every release-<component> job
          # (which is exactly the symptom that surfaced run 27469758939).
          sed -n '/^{$/,$p' /tmp/release.raw > /tmp/release.json
          jq . /tmp/release.json > /dev/null

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available != 'true'
        run: |
          set -euo pipefail
          multicz bump ${{ steps.plan.outputs.args }} --commit --tag --push \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.raw
          # Same noise-stripping + JSON sanity check as the signed
          # variant above — both bump steps feed the same downstream
          # Extract step.
          sed -n '/^{$/,$p' /tmp/release.raw > /tmp/release.json
          jq . /tmp/release.json > /dev/null

      - name: Extract bumped versions
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          API=$(jq -r          '.bumps.api.next_version           // empty' /tmp/release.json)
          JOB=$(jq -r       '.bumps.job.next_version        // empty' /tmp/release.json)
          CLI=$(jq -r          '.bumps.cli.next_version           // empty' /tmp/release.json)
          SSR=$(jq -r          '.bumps.ssr.next_version           // empty' /tmp/release.json)
          CHART_API=$(jq -r    '.bumps["chart-api"].next_version    // empty' /tmp/release.json)
          CHART_JOB=$(jq -r '.bumps["chart-job"].next_version // empty' /tmp/release.json)
          CHART_SSR=$(jq -r    '.bumps["chart-ssr"].next_version    // empty' /tmp/release.json)
          MIGRATIONS=$(jq -r       '.bumps.migrations.next_version       // empty' /tmp/release.json)
          CHART_MIGRATIONS=$(jq -r '.bumps["chart-migrations"].next_version // empty' /tmp/release.json)
          DOCS=$(jq -r         '.bumps.docs.next_version          // empty' /tmp/release.json)
          APP=$(jq -r          '.bumps.app.next_version           // empty' /tmp/release.json)
          INFRA=$(jq -r        '.bumps.infra.next_version         // empty' /tmp/release.json)
          INFRA_MOD_EXAMPLE=$(jq -r '.bumps["infra-modules-example"].next_version // empty' /tmp/release.json)
          # Surface what we extracted so the workflow log makes the
          # downstream skip/run decision auditable without having to
          # re-resolve via gh api.
          printf '[release-bump] extracted versions:\n  api=%s job=%s ssr=%s cli=%s migrations=%s app=%s\n  chart-api=%s chart-job=%s chart-ssr=%s chart-migrations=%s docs=%s\n' \
            "$API" "$JOB" "$SSR" "$CLI" "$MIGRATIONS" "$APP" "$CHART_API" "$CHART_JOB" "$CHART_SSR" "$CHART_MIGRATIONS" "$DOCS"
          echo "api_version=$API"                   >> "$GITHUB_OUTPUT"
          echo "job_version=$JOB"             >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI"                   >> "$GITHUB_OUTPUT"
          echo "ssr_version=$SSR"                   >> "$GITHUB_OUTPUT"
          echo "chart_api_version=$CHART_API"       >> "$GITHUB_OUTPUT"
          echo "chart_job_version=$CHART_JOB" >> "$GITHUB_OUTPUT"
          echo "chart_ssr_version=$CHART_SSR"       >> "$GITHUB_OUTPUT"
          echo "migrations_version=$MIGRATIONS"     >> "$GITHUB_OUTPUT"
          echo "chart_migrations_version=$CHART_MIGRATIONS" >> "$GITHUB_OUTPUT"
          echo "docs_version=$DOCS"                 >> "$GITHUB_OUTPUT"
          echo "app_version=$APP"                   >> "$GITHUB_OUTPUT"
          echo "infra_version=$INFRA"               >> "$GITHUB_OUTPUT"
          echo "infra_modules_example_version=$INFRA_MOD_EXAMPLE" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Output the bare repo name for downstream publish jobs to build
      # their image/chart names (`<repo>-<component>`). Lets a fork
      # publish under its own namespace without overwriting upstream.
      - name: Compute repo name
        id: names
        run: |
          echo "repo=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"

      - name: Trigger infra-plan
        # infra-plan.yml has no push trigger — this is its only entry
        # point, so the decision to plan lives here, next to `detect`.
        #
        # The signal is a `configs-*` component in the changed set. multicz
        # marks an environment changed both when its own config.yaml is
        # edited and when infra/** or a module cascades onto it through
        # depends_on, so one condition covers a config edit, a module
        # change and a services/** change alike.
        #
        # NOT gated on steps.plan.outputs.release: a config-only change
        # bumps nothing in this job (configs-* are deploy-gated and
        # filtered out of the bump), so `release` would be 'false' and the
        # plan would never fire — on precisely the change that most needs
        # one.
        #
        # Dispatch rather than relying on the release commit's own push
        # event: that push uses RELEASE_PAT when set, and falls back to
        # GITHUB_TOKEN, whose anti-recursion rule fires nothing at all.
        if: contains(join(fromJson(needs.detect.outputs.changed).changed, ','), 'configs-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run infra-plan.yml --ref main

      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-bump
          body: |
            `multicz bump --commit --tag --push` (signed when
            `GPG_PRIVATE_KEY` + `GPG_PASSPHRASE` are set). Per-component
            publish jobs (`release-<component>`) read this job's
            outputs to know what to publish.

  # ─────────────────────── per-component publish jobs ───────────────────────

  release-api:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.api_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      packages: write   # docker push
      actions: write    # delete-artifact (cleanup after publish)
      id-token: write   # cosign keyless via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - uses: ./.github/actions/publish-image
        with:
          component: api
          version: ${{ needs.release-bump.outputs.api_version }}
          owner: ${{ needs.release-bump.outputs.owner }}
          repo: ${{ needs.release-bump.outputs.repo }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-deb
        with:
          component: api
      # The .deb has no registry to hold its signature, so it is signed
      # with sign-blob and ships alongside its .sig and .pem.
      - uses: ./.github/actions/sign-blob
        id: sign_deb
        with:
          path: /tmp/shomer-api_*.deb
      - name: gh release create api-v${{ needs.release-bump.outputs.api_version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="api-v${{ needs.release-bump.outputs.api_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file - ${{ steps.sign_deb.outputs.files }}
      # Published — the CI artifacts are now obsolete (image lives in
      # ghcr, .deb is a release asset). Drop them so the workflow
      # run page doesn't carry duplicates after retention.
      - name: Delete consumed CI artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118  # v6
        with:
          name: |
            api-image
            api-deb
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-api
          body: |
            Pushed `ghcr.io/${{ needs.release-bump.outputs.owner }}/${{ needs.release-bump.outputs.repo }}-api:${{ needs.release-bump.outputs.api_version }}` (+ `latest`),
            built `shomer-api_${{ needs.release-bump.outputs.api_version }}-1_all.deb`, cut GitHub Release `api-v${{ needs.release-bump.outputs.api_version }}` with the .deb attached.
            CI artifacts (`api-image`, `api-deb`) deleted post-publish.

  release-job:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.job_version != ''
