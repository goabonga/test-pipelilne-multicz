      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
