    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web-frontend/package-lock.json
      - run: npm ci
        working-directory: packages/web-frontend
      - name: Biome lint — web-frontend
        run: npm run lint
