          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - uses: ./.github/actions/publish-image
        with:
          component: migrations
          version: ${{ needs.release-bump.outputs.migrations_version }}
          owner: ${{ needs.release-bump.outputs.owner }}
          repo: ${{ needs.release-bump.outputs.repo }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - name: gh release create migrations-v${{ needs.release-bump.outputs.migrations_version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="migrations-v${{ needs.release-bump.outputs.migrations_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Delete consumed CI artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118  # v6
        with:
          name: |
            migrations-image
            migrations-sbom
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-migrations
          body: |
            Pushed `ghcr.io/${{ needs.release-bump.outputs.owner }}/${{ needs.release-bump.outputs.repo }}-migrations:${{ needs.release-bump.outputs.migrations_version }}` (+ `latest`),
            cut GitHub Release `migrations-v${{ needs.release-bump.outputs.migrations_version }}`.
            CI artifacts (`migrations-image`, `migrations-sbom`) deleted post-publish.

  release-chart-migrations:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.chart_migrations_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
      id-token: write   # keyless cosign signing (Fulcio/Rekor)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - uses: ./.github/actions/publish-chart
        with:
          component: migrations
          owner: ${{ needs.release-bump.outputs.owner }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - name: gh release create chart-migrations-v${{ needs.release-bump.outputs.chart_migrations_version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="chart-migrations-v${{ needs.release-bump.outputs.chart_migrations_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Delete consumed CI artifact
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118  # v6
        with:
          name: chart-migrations-tgz
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-chart-migrations
          body: |
            Pushed `oci://ghcr.io/${{ needs.release-bump.outputs.owner }}/charts/${{ needs.release-bump.outputs.repo }}-migrations:${{ needs.release-bump.outputs.chart_migrations_version }}`,
            cut GitHub Release `chart-migrations-v${{ needs.release-bump.outputs.chart_migrations_version }}`.
            CI artifact (`chart-migrations-tgz`) deleted post-publish.

  # ── infrastructure GitHub Releases ─────────────────────────────────────
  #
  # release-bump tags every component it bumps, but a tag is not a Release:
  # the Release object, with the multicz-generated notes, is cut by a
  # per-component job — which the infrastructure components were missing,
  # so infra-v0.1.0 and infra-modules-example-v0.1.0 existed as tags with
  # nothing on the Releases page.
  #
  # Neither ships an artifact: terragrunt units and local modules are
  # consumed from the repo, not downloaded. The Release is the changelog
  # entry, and for `infra` it is also where upstream-notes surfaces what a
  # given deploy shipped.

  release-infra:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.infra_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - name: gh release create infra-v${{ needs.release-bump.outputs.infra_version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="infra-v${{ needs.release-bump.outputs.infra_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-infra
          body: 'GitHub Release for the terragrunt root wiring.'

  release-infra-modules-example:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.infra_modules_example_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - name: gh release create infra-modules-example-v${{ needs.release-bump.outputs.infra_modules_example_version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="infra-modules-example-v${{ needs.release-bump.outputs.infra_modules_example_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-infra-modules-example
          body: 'GitHub Release for the `example` Terraform module.'

  release-docs:
    # Consume the already-built `docs-site` artifact (produced by
    # `docs-build` earlier in this run with the same bump-previewed
    # version that `release-bump` then committed) — no rebuild. Upload
    # to GitHub Pages, then cut the docs-vX.Y.Z GitHub Release.
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.docs_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      pages: write      # actions/deploy-pages
      id-token: write   # OIDC for upload-pages-artifact + deploy-pages
      actions: write    # delete-artifact (cleanup after publish)
    concurrency:
      group: pages      # one in-flight Pages deploy per repo
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
      - name: gh release create docs-v${{ needs.release-bump.outputs.docs_version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="docs-v${{ needs.release-bump.outputs.docs_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Delete consumed CI artifact
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118  # v6
        with:
          name: docs-site
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-docs
          body: |
            Reused `docs-site` artifact from `docs-build`, deployed docs `${{ needs.release-bump.outputs.docs_version }}` to ${{ steps.deploy.outputs.page_url }},
            cut GitHub Release `docs-v${{ needs.release-bump.outputs.docs_version }}`.
            CI artifact (`docs-site`) deleted post-publish.
