  # ─────────────────────── OWASP baseline (kind + ZAP, per HTTP service) ───────────────────────

  owasp-api:
    # Spin up an ephemeral kind cluster, deploy the FULL stack
    # (api + job + ssr) so the scan target has its real
    # neighbours, then port-forward api and run an OWASP ZAP baseline.
    # Images come from CI artifacts when their component changed this
    # run, else are pulled from `ghcr.io/.../<X>:latest` (the load-image
    # composite handles the fallback). Runs as long as SOMETHING
    # upstream succeeded — a single api/chart change is enough.
    #
    # `e2e-api` is on the needs list so a behave regression short-
    # circuits the ZAP scan: ZAP is expensive (kind+helm+ZAP run is
    # ~5-7 min) and gives misleading signal on a functionally broken
    # build. !failure() && !cancelled() in the if clause lets owasp-
    # api still run when e2e-api was skipped (component didn't
    # change) so we don't lose coverage on partial-change PRs.
    needs:
      - detect
      - api-grype
      - job-grype
      - ssr-grype
      - chart-api-checkov
      - chart-job-checkov
      - chart-ssr-checkov
      - migrations-container
      - chart-migrations-checkov
      - e2e-api
    # Run when any component that feeds the deployed stack is in
    # changed — semantics are direct ("we have something new to
    # smoke") rather than indirect ("a downstream validation
    # succeeded"). `multicz changed` propagates the api/job/ssr →
    # chart-X cascade upstream, so listing the parent components is
    # enough; chart-X gets pulled in automatically when its parent
    # changes. `!failure()` keeps the safety net intact — any
    # upstream validation that genuinely failed still skips this job.
    if: >-
      !failure() && !cancelled() && (
        contains(fromJson(needs.detect.outputs.changed).changed, 'api') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'job') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'ssr') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'web') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-job') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-ssr') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'migrations') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-migrations')
      )
    runs-on: ubuntu-latest
    permissions:
      packages: read   # load-image's ghcr.io fallback pull
      actions: read   # gh api artifact-existence probe in load-image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/owasp-scan
        with:
          component: api
          port: "8000"
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp-api
          body: 'kind + helm install api/job/ssr (fresh artifact when changed, ghcr `:latest` otherwise) + OWASP ZAP baseline on api (`zap-api-baseline`).'

  owasp-ssr:
    # Same shape as owasp-api but targeting ssr. Both jobs install
    # the same 3 charts; only the ZAP-scan target differs. Gates on
    # e2e-ssr for the same reason owasp-api gates on e2e-api: a
    # browser-driven regression in ui.feature kills the ZAP scan
    # early instead of letting it ramble against a broken page.
    needs:
      - detect
      - api-grype
      - job-grype
      - ssr-grype
      - chart-api-checkov
      - chart-job-checkov
      - chart-ssr-checkov
      - migrations-container
      - chart-migrations-checkov
      - e2e-ssr
    # Run when any component that feeds the deployed stack is in
    # changed — semantics are direct ("we have something new to
    # smoke") rather than indirect ("a downstream validation
    # succeeded"). `multicz changed` propagates the api/job/ssr →
    # chart-X cascade upstream, so listing the parent components is
    # enough; chart-X gets pulled in automatically when its parent
    # changes. `!failure()` keeps the safety net intact — any
    # upstream validation that genuinely failed still skips this job.
    if: >-
      !failure() && !cancelled() && (
        contains(fromJson(needs.detect.outputs.changed).changed, 'api') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'job') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'ssr') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'web') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-job') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-ssr') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'migrations') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-migrations')
      )
    runs-on: ubuntu-latest
    permissions:
      packages: read
      actions: read   # gh api artifact-existence probe in load-image
    steps:
