      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        working-directory: packages/bdd/migrations
        run: grype sbom:/tmp/migrations.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: migrations-grype
          body: '`grype --fail-on high` on the migrations SBOM.'

  # ─────────────────────── audit (workspace-wide) ───────────────────────

  audit:
    # Single workspace-level audit on the locked, non-dev dependency
    # closure. Fans into every container job — but doesn't require
    # every test to have run (audits the workspace lockfile, not a
    # specific component's tests). So we drop the default "all needs
    # must succeed" gate and run as long as the workflow hasn't
    # failed or been cancelled. Without this, a partial-change PR
    # (e.g. only api changed → cli-test skipped) would skip audit
    # → skip every container → no fresh image artifact for owasp.
    #
    # The `detect.changed != '[]'` gate filters out commits that
    # touch only workflow files (`ci:` bumps) or docs — they leave
    # the lockfile untouched, so re-running pip-audit on the same
    # closure produces an identical result. The fresh-CVE catch is
    # still covered weekly by grype-allowlist-sweep on each published
    # image.
    needs: [api-test, job-test, ssr-test, cli-test, database-test, migrations-test, detect]
    # The earlier `needs.detect.outputs.changed != '[]'` gate was a
    # category error: `detect.outputs.changed` is the FULL multicz
    # JSON object (`{"changed": [...], "unchanged": [...]}`), not
    # the bare array, so the string comparison against '[]' was
    # never true and audit ran on every commit — including pure
    # `fix(ci):` / `chore(release):` ones that don't touch any
    # resolved dependency. Use the same `contains(fromJson(...).changed,
    # '<comp>')` idiom the per-component gates already use, with
    # the audit's actual scope (api / job / ssr / cli) baked in so
    # doc-only or chart-only changes also skip cleanly.
    if: >-
      !failure() && !cancelled() &&
      (contains(fromJson(needs.detect.outputs.changed).changed, 'api') ||
       contains(fromJson(needs.detect.outputs.changed).changed, 'job') ||
       contains(fromJson(needs.detect.outputs.changed).changed, 'ssr') ||
       contains(fromJson(needs.detect.outputs.changed).changed, 'cli') ||
       contains(fromJson(needs.detect.outputs.changed).changed, 'database') ||
       contains(fromJson(needs.detect.outputs.changed).changed, 'migrations'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv tool install pip-audit
      - name: Audit resolved dependencies
        run: |
          uv export --no-dev --no-emit-project \
            --format requirements-txt -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --no-deps
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: audit
          body: '`pip-audit` on the resolved, non-dev dependency closure (`uv export --no-dev`).'

  # ─────────────────────── helm charts ───────────────────────

  chart-api-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
      - name: helm lint — chart-api
        run: helm lint packages/api/chart
      - name: helm template smoke — chart-api
        run: helm template ci packages/api/chart > /tmp/chart-api.yaml
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-api-lint
          body: '`helm lint` + `helm template` smoke on `packages/api/chart/`.'

  chart-api-checkov:
    needs: [chart-api-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7  # v12
        with:
          directory: packages/api/chart
          framework: helm
          quiet: true
