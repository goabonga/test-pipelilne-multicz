# CI gate. Eleven independent jobs:
#
#   detect    → resolves the matrix (one entry per package whose files
#               actually moved on this push / PR, via `multicz changed`).
#   quality   → ruff lint + ruff format check + SPDX header check.
#   validate  → `multicz validate --strict` against the repo state.
#   typecheck → mypy --strict across the workspace.
#   test      → matrix job, only fires for changed packages.
#   audit     → pip-audit on the locked, non-dev dependency closure.
#   bandit    → AST-based source scan for python security smells.
#   container → matrix [api,worker]: build the docker image (no push),
#               save the tarball as an artifact for sbom + grype.
#   sbom      → matrix [api,worker]: syft on the saved tarball,
#               emits an SPDX-JSON consumed by grype.
#   grype     → matrix [api,worker]: vuln scan against the SBOM,
#               --fail-on high. medium/low are reported only.
#   docs      → `zensical build` smoke (catches broken markdown / config).
#
# `release.yml` keys off this workflow's `ci` name via workflow_run; if
# any job here fails or is cancelled, no release fires.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: changed
        uses: goabonga/multicz-action/changed@v1
        with:
          output: json

      - id: list
        env:
          CHANGED_JSON: ${{ steps.changed.outputs.json }}
        run: |
          set -euo pipefail
          echo "list=$(echo "$CHANGED_JSON" | jq -c '.changed')" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: Ruff lint
        run: uv run ruff check packages scripts

      - name: Ruff format check
        run: uv run ruff format --check packages scripts

      - name: SPDX license headers
        run: |
          uv run python scripts/add_license_header.py --path packages --check
          uv run python scripts/add_license_header.py --path scripts --check

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: goabonga/multicz-action@v1

      - name: multicz validate
        run: multicz validate --strict

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: Mypy (strict)
        run: |
          set -euo pipefail
          uv run --with mypy mypy --strict \
            packages/api/src \
            packages/worker/src \
            packages/cli/src | tee /tmp/mypy.out
          {
            echo "## typecheck"
            echo
            echo "**mypy --strict**"
            echo
            echo '```'
            cat /tmp/mypy.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: detect
    if: needs.detect.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.list) }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: Pytest for ${{ matrix.package }}
        run: |
          set -euo pipefail
          # `chart-api` / `chart-worker` are Helm-only components — they
          # have no tests/ directory to point pytest at.
          if [ -d "packages/${{ matrix.package }}/tests" ]; then
            uv run pytest packages/${{ matrix.package }}/tests -q
          else
            echo "no tests/ for ${{ matrix.package }} — skipping"
          fi

  audit:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Audit resolved dependencies
        # `uv export` materialises the locked, non-dev resolution as a
        # requirements.txt; `--no-emit-project` skips the editable
        # workspace members that have no PyPI hash. Without `--no-deps`,
        # pip-audit re-resolves and warns about hash absence; we trust
        # uv.lock and pass `--no-deps` to make pip-audit only audit
        # what's already pinned.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          uv export --no-dev --no-emit-project \
            --format requirements-txt -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --no-deps | tee /tmp/audit.out
          RC=${PIPESTATUS[0]}
          {
            echo "## audit"
            echo
            echo "**pip-audit** \`requirements (no-dev)\` — exit $RC"
            echo
            echo '```'
            cat /tmp/audit.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  bandit:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: uv tool install bandit

      - name: Bandit (AST-based source scan)
        # Recursive scan of src/ only — tests/ are intentionally
        # excluded (assert/subprocess patterns there are noise).
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          bandit -r \
            packages/api/src \
            packages/worker/src \
            packages/cli/src | tee /tmp/bandit.out
          RC=${PIPESTATUS[0]}
          {
            echo "## bandit"
            echo
            echo "**bandit** \`src/\` — exit $RC"
            echo
            echo '```'
            cat /tmp/bandit.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  container:
    needs: [audit, bandit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, worker]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.package }} image (load locally, no push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: packages/${{ matrix.package }}
          load: true
          tags: ${{ matrix.package }}:ci
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}

      - name: Save image tarball
        run: docker save ${{ matrix.package }}:ci -o /tmp/${{ matrix.package }}.tar

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-image
          path: /tmp/${{ matrix.package }}.tar
          retention-days: 1

      - name: Summarise ${{ matrix.package }} image
        run: |
          {
            echo "## container — ${{ matrix.package }}"
            echo
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- imageid: \`${{ steps.build.outputs.imageid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sbom:
    needs: container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, worker]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package }}-image
          path: /tmp

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft docker-archive:/tmp/${{ matrix.package }}.tar \
            -o spdx-json=/tmp/${{ matrix.package }}.sbom.spdx.json \
            -o table > /tmp/sbom.txt
          {
            echo "## sbom — ${{ matrix.package }}"
            echo
            echo "**syft** \`docker-archive:/tmp/${{ matrix.package }}.tar\` → \`spdx-json\`"
            echo
            echo '```'
            head -n 30 /tmp/sbom.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-sbom
          path: /tmp/${{ matrix.package }}.sbom.spdx.json
          retention-days: 1

  grype:
    needs: sbom
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, worker]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package }}-sbom
          path: /tmp

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan SBOM (--fail-on high)
        # high or critical findings exit non-zero; medium / low are
        # reported only. Tighten to `medium` for stricter gating.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          grype sbom:/tmp/${{ matrix.package }}.sbom.spdx.json \
            --fail-on high | tee /tmp/grype.out
          RC=${PIPESTATUS[0]}
          {
            echo "## grype — ${{ matrix.package }}"
            echo
            echo "**grype** \`sbom:${{ matrix.package }}.sbom.spdx.json\` --fail-on high — exit $RC"
            echo
            echo '```'
            cat /tmp/grype.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace + doc group
        run: uv sync --frozen --all-packages --group doc

      - name: Zensical build
        run: uv run zensical build
