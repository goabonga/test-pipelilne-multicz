      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: packages/bdd/migrations/Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: migrations-hadolint
          body: '`hadolint` on `packages/bdd/migrations/Dockerfile`.'

  migrations-container:
    # Build the migration-runner image (shomer-migrations + driver). Consumed
    # by the e2e / owasp db-stack (loaded into kind to run alembic upgrade head)
    # and by release-migrations. Build context is packages/bdd — the image
    # needs the sibling shomer-database.
    needs: [migrations-bandit, audit, migrations-hadolint, detect]
    if: '!failure() && !cancelled() && contains(fromJson(needs.detect.outputs.changed).changed, ''migrations'')'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      # The three OCI annotation values that cannot be static. The rest
      # are LABELs in the Dockerfile itself, so a local `docker build`
      # carries them too and — the Dockerfile being in the component's
      # multicz paths — editing them actually releases an image that has
      # them. bump-preview has already rewritten VERSION to the version
      # this build will be released as.
      - name: OCI image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(sed -n 's/^migrations=//p' VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build migrations image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: packages/bdd
          file: packages/bdd/migrations/Dockerfile
          load: true
          tags: migrations:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations,ignore-error=true
      - name: Assert the OCI annotations landed
        run: |
          set -euo pipefail
          for k in version revision created source title licenses; do
            v=$(docker image inspect migrations:ci \
                  --format "{{ index .Config.Labels \"org.opencontainers.image.$k\" }}")
            [ -n "$v" ] || { echo "::error::org.opencontainers.image.$k is empty"; exit 1; }
            printf '  %-14s %s\n' "$k" "$v"
          done
      - name: Save image tarball
        run: docker save migrations:ci -o /tmp/migrations.tar
      - uses: actions/upload-artifact@v7
        with: { name: migrations-image, path: /tmp/migrations.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: migrations-container
          body: 'Built `migrations:ci` (saved to artifact `migrations-image`).'

  migrations-sbom:
    needs: [migrations-container]
    if: '!failure() && !cancelled() && needs.migrations-container.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: migrations-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/migrations.tar -o spdx-json=/tmp/migrations.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: migrations-sbom, path: /tmp/migrations.sbom.spdx.json, retention-days: 1 }
      - name: Summary
