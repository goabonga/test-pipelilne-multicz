        with:
          python-version: "3.12"
      - name: Install e2e dependency-group
        run: uv sync --frozen --group e2e --no-install-project
      # `--with-deps` installs the Linux libs Chromium needs (libnss3,
      # libxkbcommon, etc.) — the ubuntu-latest runner doesn't ship
      # them all. Without `--with-deps`, the headless Chromium fails
      # to boot the first time a scenario calls page.goto().
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: behave packages/ssr/features
        env:
          SHOMER_SSR_URL: http://localhost:8080
        run: uv run behave packages/ssr/features
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: e2e-ssr
          body: 'kind + helm install api/job/ssr + Playwright (headless Chromium) + `behave packages/ssr/features` against the port-forwarded ssr on `localhost:8080`.'

  # ─────────────────────── web (Node) ───────────────────────

  web-lint:
    needs: [detect, headers]
