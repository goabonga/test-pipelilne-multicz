# CI + release pipeline. Per-component named jobs — no matrix, every
# job is its own graph node so dependencies are explicit and the
# GitHub Actions UI tells you at a glance which component broke.
#
# ─── Graph entry (linear, every job downstream skips on failure):
#
#   validate ── detect ── headers ──> per-component chains
#                                     docs-build
#
# ─── Per-component chain (python/buildable — api / job / ssr):
#
#                    ┌─ X-lint     ─┐                            ┌─ X-container ─ X-sbom ─ X-grype ─┐
#   detect, headers ─┼─ X-format   ─┼─ X-test ─ X-bandit ─ audit ┤                                  ├─ owasp-X (kind+ZAP, ssr/api only)
#                    └─ X-typecheck┘                             └─ X-deb ─ X-deb-validate ────────┘
#
# - cli has the same lint/test/bandit/deb chain, no container/sbom/grype/owasp.
# - charts (chart-{api,job,ssr}) have chart-X-lint → chart-X-checkov.
# - web has its own JS chain that feeds web-build,
#   consumed by ssr-{test,container,deb} via `web-dist` artifact.
#
# Per-component change-gating uses
#   `if: contains(fromJson(needs.detect.outputs.changed).changed, '<name>')`
# on the *-lint/format/typecheck/test entry points. The skip then
# cascades down via `needs:` so unchanged components produce no work.
# detect must sit in `needs:` directly because GitHub Actions only
# exposes outputs for *direct* needs, not transitive.
#
# ─── Release fan-out (main only, !chore(release), all upstream green):
#
#   owasp-api ─┐
#   owasp-ssr ─┤
#   *-deb-validate (4) ─┤
#   docs-build         ─┼─> release-bump  ┬─> release-api          (docker + .deb + gh release)
#   validate           ─┘                 ├─> release-job       (idem)
#                                         ├─> release-ssr          (idem)
#                                         ├─> release-cli          (.deb + gh release, no docker)
#                                         ├─> release-chart-api    (helm OCI push + gh release)
#                                         ├─> release-chart-job (idem)
#                                         ├─> release-chart-ssr    (idem)
#                                         └─> release-docs         (zensical build + Pages + gh release)
#
# release-bump runs `multicz bump --commit --tag --push` for ALL
# components that bumped — one atomic commit, N per-component tags.
# Each downstream `release-<X>` job has `if: needs.release-bump.outputs.<X>_version != ''`,
# so a component that didn't bump produces no publish.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ─────────────────────── graph entry: validate ─ detect ─ headers + docs-build ───────────────────────

  detect:
    # Gate on validate so a broken multicz.toml fails loudly upfront
    # rather than cryptically inside the `changed` action below.
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.json }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changed
        uses: goabonga/multicz-action/changed@v1
        with:
          output: json
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: detect
          body: |
            Changed components: `${{ steps.changed.outputs.json }}`

  headers:
    # Same gate as `detect`: validate-first means a broken multicz
    # config kills the run upstream, before headers (and everything
    # downstream) bothers to start.
    needs: [detect]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: SPDX license headers
        run: |
          uv run python scripts/add_license_header.py --path packages --check
          uv run python scripts/add_license_header.py --path scripts --check
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: headers
          body: SPDX header check on `packages/` and `scripts/`.

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: goabonga/multicz-action@v1
      - name: multicz validate
        run: multicz validate --strict
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: '`multicz validate --strict` on the workspace config.'

  docs-build:
    # Build the zensical site on every docs change (PR + main). On
    # main, `release-docs` reuses the resulting `docs-site` artifact
    # instead of rebuilding — bump-preview already wrote the next
    # version into the working tree, so the bytes are identical to
    # what release-docs would produce.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Install workspace + doc group
        run: uv sync --frozen --all-packages --group doc
      - name: Zensical build
        run: uv run zensical build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs-build
          body: '`zensical build` → uploaded as `docs-site` for `release-docs` to consume.'

  # docs-deploy is gone. The bump for `docs` now happens in
  # `release-bump` alongside the other components; the build +
  # Pages deploy + GitHub Release moved to `release-docs` (after
  # `release-bump`, mirroring `release-api` / `release-chart-X`).

  # ─────────────────────── api ───────────────────────

  api-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — api
        run: uv run ruff check packages/api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-lint
          body: '`ruff check` on `packages/api/`.'

  api-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — api
        run: uv run ruff format --check packages/api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-format
          body: '`ruff format --check` on `packages/api/`.'

  api-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — api
        run: uv run --with mypy mypy --strict packages/api/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-typecheck
          body: '`mypy --strict` on `packages/api/src/`.'

  api-test:
    needs: [api-lint, api-format, api-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest — api
        run: uv run pytest packages/api/tests -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-test
          body: '`pytest` on `packages/api/tests/`.'

  api-bandit:
    needs: [api-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — api
        run: bandit -r packages/api/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-bandit
          body: '`bandit -r` on `packages/api/src/`.'

  api-hadolint:
    # Dockerfile lint — runs parallel to the Python lint family,
    # gates `api-container` so a broken Dockerfile fails before
    # consuming a builder.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/api/Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-hadolint
          body: '`hadolint` on `packages/api/Dockerfile`.'

  api-container:
    needs: [api-bandit, audit, api-hadolint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: packages/api
          load: true
          # `provenance` / `sbom` flags are incompatible with `load:
          # true` (manifest lists don't go through the docker
          # exporter). Provenance + SBOM attestation are attached at
          # push time via cosign in `.github/actions/publish-image`.
          tags: api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Save image tarball
        run: docker save api:ci -o /tmp/api.tar
      - uses: actions/upload-artifact@v7
        with: { name: api-image, path: /tmp/api.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-container
          body: 'Built `api:ci` (saved to artifact `api-image`).'

  api-sbom:
    needs: [api-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6   # need .github/actions/summary on disk
      - uses: actions/download-artifact@v8
        with: { name: api-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/api.tar -o spdx-json=/tmp/api.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: api-sbom, path: /tmp/api.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-sbom
          body: 'SPDX SBOM via `syft` (artifact `api-sbom`).'

  api-grype:
    needs: [api-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: api-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        working-directory: packages/api
        run: grype sbom:/tmp/api.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-grype
          body: '`grype --fail-on high` on the api SBOM.'

  api-deb:
    # Smoke-build the .deb on every change so packaging regressions
    # surface in PR CI, not only when release.yml fires.
    needs: [api-bandit, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build api .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-api
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/api "$WORK/shomer-api"
          cd "$WORK/shomer-api"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-api_*.deb "$WORK"/shomer-api_*.buildinfo "$WORK"/shomer-api_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: api-deb, path: /tmp/shomer-api_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-deb
          body: 'Built `shomer-api_*.deb` (artifact `api-deb`).'

  api-deb-validate:
    # Three independent gates against the just-built .deb (lintian,
    # pytest, systemd-analyze security). On any failure the artifact
    # is deleted so a broken build can't be mistaken for a working
    # one downstream. See `.github/actions/validate-deb/action.yml`.
    needs: [api-deb]
    runs-on: ubuntu-latest
    permissions:
      actions: write   # delete-artifact (cleanup on validation failure)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-deb-validate
          body: 'lintian + `tests/install/test_api.py` + `systemd-analyze security` (display score ≤ 1.0).'

  # ─────────────────────── job ───────────────────────

  job-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — job
        run: uv run ruff check packages/job
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-lint
          body: '`ruff check` on `packages/job/`.'

  job-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — job
        run: uv run ruff format --check packages/job
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-format
          body: '`ruff format --check` on `packages/job/`.'

  job-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — job
        run: uv run --with mypy mypy --strict packages/job/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-typecheck
          body: '`mypy --strict` on `packages/job/src/`.'

  job-test:
    needs: [job-lint, job-format, job-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest — job
        run: uv run pytest packages/job/tests -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-test
          body: '`pytest` on `packages/job/tests/`.'

  job-bandit:
    needs: [job-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — job
        run: bandit -r packages/job/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-bandit
          body: '`bandit -r` on `packages/job/src/`.'

  job-hadolint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/job/Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-hadolint
          body: '`hadolint` on `packages/job/Dockerfile`.'

  job-container:
    needs: [job-bandit, audit, job-hadolint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@v4
      - name: Build job image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: packages/job
          load: true
          # See api-container: attestations done via cosign post-push.
          tags: job:ci
          cache-from: type=gha,scope=job
          cache-to: type=gha,mode=max,scope=job
      - name: Save image tarball
        run: docker save job:ci -o /tmp/job.tar
      - uses: actions/upload-artifact@v7
        with: { name: job-image, path: /tmp/job.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-container
          body: 'Built `job:ci` (saved to artifact `job-image`).'

  job-sbom:
    needs: [job-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: job-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/job.tar -o spdx-json=/tmp/job.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: job-sbom, path: /tmp/job.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-sbom
          body: 'SPDX SBOM via `syft` (artifact `job-sbom`).'

  job-grype:
    needs: [job-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: job-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        working-directory: packages/job
        run: grype sbom:/tmp/job.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-grype
          body: '`grype --fail-on high` on the job SBOM.'

  job-deb:
    needs: [job-bandit, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build job .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-job
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/job "$WORK/shomer-job"
          cd "$WORK/shomer-job"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-job_*.deb "$WORK"/shomer-job_*.buildinfo "$WORK"/shomer-job_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: job-deb, path: /tmp/shomer-job_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-deb
          body: 'Built `shomer-job_*.deb` (artifact `job-deb`).'

  job-deb-validate:
    needs: [job-deb]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: job
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-deb-validate
          body: 'lintian + `tests/install/test_job.py` + `systemd-analyze security` (display score ≤ 1.0).'

  # ─────────────────────── ssr ───────────────────────

  ssr-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — ssr
        run: uv run ruff check packages/ssr
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-lint
          body: '`ruff check` on `packages/ssr/`.'

  ssr-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — ssr
        run: uv run ruff format --check packages/ssr
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-format
          body: '`ruff format --check` on `packages/ssr/`.'

  ssr-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — ssr
        run: uv run --with mypy mypy --strict packages/ssr/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-typecheck
          body: '`mypy --strict` on `packages/ssr/src/`.'

  ssr-test:
    needs: [ssr-lint, ssr-format, ssr-typecheck, web-build]
    # Run if ssr changed (lint/format/typecheck succeeded) OR
    # web changed (build succeeded). When only one side
    # changes, the other's needs entry is `skipped` — the OR keeps
    # us going.
    if: >-
      !failure() && !cancelled() && (
        needs.ssr-lint.result == 'success' ||
        needs.web-build.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      # Only overwrite the committed `static/` + `templates/` if the
      # frontend was actually rebuilt this run; otherwise pytest uses
      # whatever is on disk (= the committed dist on `main`).
      - if: needs.web-build.result == 'success'
        uses: actions/download-artifact@v8
        with: { name: web-dist, path: . }
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest — ssr
        run: uv run pytest packages/ssr/tests -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-test
          body: '`pytest` on `packages/ssr/tests/`.'

  ssr-bandit:
    needs: [ssr-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — ssr
        run: bandit -r packages/ssr/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-bandit
          body: '`bandit -r` on `packages/ssr/src/`.'

  ssr-hadolint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/ssr/Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-hadolint
          body: '`hadolint` on `packages/ssr/Dockerfile`.'

  ssr-container:
    needs: [ssr-bandit, audit, web-build, ssr-hadolint]
    # Run when the ssr image actually needs rebuilding — i.e. ssr's
    # Python passed bandit AND audit succeeded. web-build
    # being skipped is fine: we fall back to the committed dist.
    if: >-
      !failure() && !cancelled() &&
      needs.ssr-bandit.result == 'success' &&
      needs.audit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - if: needs.web-build.result == 'success'
        uses: actions/download-artifact@v8
        with: { name: web-dist, path: . }
      - uses: docker/setup-buildx-action@v4
      - name: Build ssr image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: packages/ssr
          load: true
          # See api-container: attestations done via cosign post-push.
          tags: ssr:ci
          cache-from: type=gha,scope=ssr
          cache-to: type=gha,mode=max,scope=ssr
      - name: Save image tarball
        run: docker save ssr:ci -o /tmp/ssr.tar
      - uses: actions/upload-artifact@v7
        with: { name: ssr-image, path: /tmp/ssr.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-container
          body: 'Built `ssr:ci` (saved to artifact `ssr-image`).'

  ssr-sbom:
    needs: [ssr-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: ssr-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/ssr.tar -o spdx-json=/tmp/ssr.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: ssr-sbom, path: /tmp/ssr.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-sbom
          body: 'SPDX SBOM via `syft` (artifact `ssr-sbom`).'

  ssr-grype:
    needs: [ssr-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: ssr-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        working-directory: packages/ssr
        run: grype sbom:/tmp/ssr.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-grype
          body: '`grype --fail-on high` on the ssr SBOM.'

  ssr-deb:
    needs: [ssr-bandit, audit, web-build]
    if: >-
      !failure() && !cancelled() &&
      needs.ssr-bandit.result == 'success' &&
      needs.audit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - if: needs.web-build.result == 'success'
        uses: actions/download-artifact@v8
        with: { name: web-dist, path: . }
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build ssr .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-ssr
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/ssr "$WORK/shomer-ssr"
          cd "$WORK/shomer-ssr"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-ssr_*.deb "$WORK"/shomer-ssr_*.buildinfo "$WORK"/shomer-ssr_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: ssr-deb, path: /tmp/shomer-ssr_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-deb
          body: 'Built `shomer-ssr_*.deb` (artifact `ssr-deb`).'

  ssr-deb-validate:
    needs: [ssr-deb]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: ssr
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-deb-validate
          body: 'lintian + `tests/install/test_ssr.py` + `systemd-analyze security` (display score ≤ 1.0).'

  # ─────────────────────── cli (no container) ───────────────────────

  cli-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'cli')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — cli
        run: uv run ruff check packages/cli
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: cli-lint
          body: '`ruff check` on `packages/cli/`.'

  cli-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'cli')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — cli
        run: uv run ruff format --check packages/cli
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: cli-format
          body: '`ruff format --check` on `packages/cli/`.'

  cli-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'cli')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — cli
        run: uv run --with mypy mypy --strict packages/cli/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: cli-typecheck
          body: '`mypy --strict` on `packages/cli/src/`.'

  cli-test:
    needs: [cli-lint, cli-format, cli-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest — cli
        run: uv run pytest packages/cli/tests -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: cli-test
          body: '`pytest` on `packages/cli/tests/`.'

  cli-bandit:
    needs: [cli-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — cli
        run: bandit -r packages/cli/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: cli-bandit
          body: '`bandit -r` on `packages/cli/src/`.'

  cli-deb:
    needs: [cli-bandit, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build cli .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-cli
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/cli "$WORK/shomer-cli"
          cd "$WORK/shomer-cli"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-cli_*.deb "$WORK"/shomer-cli_*.buildinfo "$WORK"/shomer-cli_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: cli-deb, path: /tmp/shomer-cli_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: cli-deb
          body: 'Built `shomer-cli_*.deb` (artifact `cli-deb`).'

  cli-deb-validate:
    needs: [cli-deb]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: cli
          has-systemd: "false"   # cli ships no .service unit
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: cli-deb-validate
          body: 'lintian + `tests/install/test_cli.py` (no systemd unit on the cli package).'

  # ─────────────────────── audit (workspace-wide) ───────────────────────

  audit:
    # Single workspace-level audit on the locked, non-dev dependency
    # closure. Fans into every container job — but doesn't require
    # every test to have run (audits the workspace lockfile, not a
    # specific component's tests). So we drop the default "all needs
    # must succeed" gate and run as long as the workflow hasn't
    # failed or been cancelled. Without this, a partial-change PR
    # (e.g. only api changed → cli-test skipped) would skip audit
    # → skip every container → no fresh image artifact for owasp.
    needs: [api-test, job-test, ssr-test, cli-test]
    if: '!failure() && !cancelled()'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v8.1.0
        with: { python-version: "3.12" }
      - run: uv tool install pip-audit
      - name: Audit resolved dependencies
        run: |
          uv export --no-dev --no-emit-project \
            --format requirements-txt -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --no-deps
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: audit
          body: '`pip-audit` on the resolved, non-dev dependency closure (`uv export --no-dev`).'

  # ─────────────────────── helm charts ───────────────────────

  chart-api-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - name: helm lint — chart-api
        run: helm lint packages/api/chart
      - name: helm template smoke — chart-api
        run: helm template ci packages/api/chart > /tmp/chart-api.yaml
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-api-lint
          body: '`helm lint` + `helm template` smoke on `packages/api/chart/`.'

  chart-api-checkov:
    needs: [chart-api-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: packages/api/chart
          framework: helm
          quiet: true
          output_format: cli
          soft_fail: false
          # CKV_K8S_21: namespace is deploy-time (--namespace), not a
          # chart concern. CKV_K8S_43: image digest pinning is
          # incompatible with our `:VERSION` + `:latest` tag scheme
          # and is enforced via cosign attestation instead.
          skip_check: CKV_K8S_21,CKV_K8S_43
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-api-checkov
          body: '`checkov --framework helm` static security scan on `packages/api/chart/`.'

  chart-api-package:
    # Package the chart with the bumped version + rewritten name so
    # `release-chart-api` can just download + helm push — no helm
    # package at release time.
    needs: [chart-api-checkov]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - name: Rewrite Chart.yaml name for this repo's namespace
        run: |
          REPO='${{ github.event.repository.name }}'
          sed -i "s/^name: shomer-api$/name: ${REPO}-api/" packages/api/chart/Chart.yaml
      - name: helm package
        run: |
          mkdir -p /tmp/chart-api
          helm package packages/api/chart --destination /tmp/chart-api
      - uses: actions/upload-artifact@v7
        with:
          name: chart-api-tgz
          path: /tmp/chart-api/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-api-package
          body: '`helm package` (bump-previewed version + rewritten name) → `chart-api-tgz` artifact.'

  chart-job-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'chart-job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - name: helm lint — chart-job
        run: helm lint packages/job/chart
      - name: helm template smoke — chart-job
        run: helm template ci packages/job/chart > /tmp/chart-job.yaml
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-job-lint
          body: '`helm lint` + `helm template` smoke on `packages/job/chart/`.'

  chart-job-checkov:
    needs: [chart-job-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: packages/job/chart
          framework: helm
          quiet: true
          output_format: cli
          soft_fail: false
          # Plus CKV_K8S_8 / CKV_K8S_9: job is a polling loop with
          # no HTTP server (no /healthz). Chainguard distroless ships
          # no shell, so an `exec` probe isn't feasible either.
          skip_check: CKV_K8S_21,CKV_K8S_43,CKV_K8S_8,CKV_K8S_9
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-job-checkov
          body: '`checkov --framework helm` static security scan on `packages/job/chart/`.'

  chart-job-package:
    needs: [chart-job-checkov]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - name: Rewrite Chart.yaml name for this repo's namespace
        run: |
          REPO='${{ github.event.repository.name }}'
          sed -i "s/^name: shomer-job$/name: ${REPO}-job/" packages/job/chart/Chart.yaml
      - name: helm package
        run: |
          mkdir -p /tmp/chart-job
          helm package packages/job/chart --destination /tmp/chart-job
      - uses: actions/upload-artifact@v7
        with:
          name: chart-job-tgz
          path: /tmp/chart-job/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-job-package
          body: '`helm package` (bump-previewed version + rewritten name) → `chart-job-tgz` artifact.'

  chart-ssr-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'chart-ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - name: helm lint — chart-ssr
        run: helm lint packages/ssr/chart
      - name: helm template smoke — chart-ssr
        run: helm template ci packages/ssr/chart > /tmp/chart-ssr.yaml
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-ssr-lint
          body: '`helm lint` + `helm template` smoke on `packages/ssr/chart/`.'

  chart-ssr-checkov:
    needs: [chart-ssr-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: packages/ssr/chart
          framework: helm
          quiet: true
          output_format: cli
          soft_fail: false
          skip_check: CKV_K8S_21,CKV_K8S_43
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-ssr-checkov
          body: '`checkov --framework helm` static security scan on `packages/ssr/chart/`.'

  chart-ssr-package:
    needs: [chart-ssr-checkov]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - name: Rewrite Chart.yaml name for this repo's namespace
        run: |
          REPO='${{ github.event.repository.name }}'
          sed -i "s/^name: shomer-ssr$/name: ${REPO}-ssr/" packages/ssr/chart/Chart.yaml
      - name: helm package
        run: |
          mkdir -p /tmp/chart-ssr
          helm package packages/ssr/chart --destination /tmp/chart-ssr
      - uses: actions/upload-artifact@v7
        with:
          name: chart-ssr-tgz
          path: /tmp/chart-ssr/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-ssr-package
          body: '`helm package` (bump-previewed version + rewritten name) → `chart-ssr-tgz` artifact.'

  # ─────────────────────── OWASP baseline (kind + ZAP, per HTTP service) ───────────────────────

  owasp-api:
    # Spin up an ephemeral kind cluster, deploy the FULL stack
    # (api + job + ssr) so the scan target has its real
    # neighbours, then port-forward api and run an OWASP ZAP baseline.
    # Images come from CI artifacts when their component changed this
    # run, else are pulled from `ghcr.io/.../<X>:latest` (the load-image
    # composite handles the fallback). Runs as long as SOMETHING
    # upstream succeeded — a single api/chart change is enough.
    needs:
      - api-grype
      - job-grype
      - ssr-grype
      - chart-api-checkov
      - chart-job-checkov
      - chart-ssr-checkov
    if: >-
      !failure() && !cancelled() && (
        needs.api-grype.result == 'success' ||
        needs.job-grype.result == 'success' ||
        needs.ssr-grype.result == 'success' ||
        needs.chart-api-checkov.result == 'success' ||
        needs.chart-job-checkov.result == 'success' ||
        needs.chart-ssr-checkov.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      packages: read   # load-image's ghcr.io fallback pull
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/owasp-scan
        with:
          component: api
          port: "8000"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp-api
          body: 'kind + helm install api/job/ssr (fresh artifact when changed, ghcr `:latest` otherwise) + OWASP ZAP baseline on api (`zap-api-baseline`).'

  owasp-ssr:
    # Same shape as owasp-api but targeting ssr. Both jobs install
    # the same 3 charts; only the ZAP-scan target differs.
    needs:
      - api-grype
      - job-grype
      - ssr-grype
      - chart-api-checkov
      - chart-job-checkov
      - chart-ssr-checkov
    if: >-
      !failure() && !cancelled() && (
        needs.api-grype.result == 'success' ||
        needs.job-grype.result == 'success' ||
        needs.ssr-grype.result == 'success' ||
        needs.chart-api-checkov.result == 'success' ||
        needs.chart-job-checkov.result == 'success' ||
        needs.chart-ssr-checkov.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/owasp-scan
        with:
          component: ssr
          port: "8080"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp-ssr
          body: 'kind + helm install api/job/ssr (fresh artifact when changed, ghcr `:latest` otherwise) + OWASP ZAP baseline on ssr (`zap-ssr-baseline`).'

  # ─────────────────────── web (Node) ───────────────────────

  web-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web
      - name: Biome lint — web
        run: npm run lint
        working-directory: packages/web
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-lint
          body: '`biome lint` (via `npm run lint`) on `packages/web/`.'

  web-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web
      - name: Biome format check — web
        run: npm run format:check
        working-directory: packages/web
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-format
          body: '`biome format --check` (via `npm run format:check`) on `packages/web/`.'

  web-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web
      - name: tsc --noEmit — web
        run: npm run typecheck
        working-directory: packages/web
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-typecheck
          body: '`tsc --noEmit` (via `npm run typecheck`) on `packages/web/`.'

  web-test:
    needs: [web-lint, web-format, web-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web
      - name: Vitest — web
        run: npm test
        working-directory: packages/web
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-test
          body: '`vitest` (via `npm test`) on `packages/web/`.'

  web-build:
    # Build the JS/CSS bundle + Jinja templates and publish them as
    # the `web-dist` artifact. The downstream Python ssr
    # package consumes the artifact (ssr-test / ssr-container /
    # ssr-deb) so a stale committed dist on a contributor's branch
    # never sneaks into a release — CI always rebuilds.
    needs: [web-typecheck, web-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web
      - name: Build → packages/ssr/src/shomer_ssr/{static,templates}/
        run: npm run build
        working-directory: packages/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            packages/ssr/src/shomer_ssr/static/
            packages/ssr/src/shomer_ssr/templates/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-build
          body: '`npm run build` → `static/{main.js, main.css}` + `templates/*.html`, uploaded as `web-dist`.'

  # ─────────────────────── release (main only, full graph green) ───────────────────────

  release-bump:
    # Single bump stage that the whole CI graph funnels into. multicz
    # discovers which components changed since their last tag,
    # commits + tags + pushes ALL of them in one atomic commit. The
    # bumped versions are exposed as job outputs; downstream
    # `release-<component>` publish jobs consume those outputs to
    # decide whether to run.
    #
    # Triple gate:
    #   1. On `main` only — PRs and other branches skip.
    #   2. The HEAD commit must NOT itself be a chore(release) bump
    #      (otherwise the release commit re-triggers CI and we loop).
    #   3. All upstream test / validate / scan needs passed (or were
    #      skipped). Any failure aborts the release.
    needs:
      - validate
      - owasp-api
      - owasp-ssr
      - api-deb-validate
      - job-deb-validate
      - ssr-deb-validate
      - cli-deb-validate
      - chart-api-package
      - chart-job-package
      - chart-ssr-package
      - docs-build
    if: >-
      !failure() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push release commit + tags
    outputs:
      api_version: ${{ steps.bump.outputs.api_version }}
      job_version: ${{ steps.bump.outputs.job_version }}
      cli_version: ${{ steps.bump.outputs.cli_version }}
      ssr_version: ${{ steps.bump.outputs.ssr_version }}
      chart_api_version: ${{ steps.bump.outputs.chart_api_version }}
      chart_job_version: ${{ steps.bump.outputs.chart_job_version }}
      chart_ssr_version: ${{ steps.bump.outputs.chart_ssr_version }}
      docs_version: ${{ steps.bump.outputs.docs_version }}
      owner: ${{ steps.owner.outputs.value }}
      repo: ${{ steps.names.outputs.repo }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace (post_bump hooks need uv lock)
        run: uv sync --frozen --all-packages

      # Node is required for web's post_bump hook
      # (`npm run build` regenerates packages/ssr/src/shomer_ssr/{static,templates}/).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: packages/web

      - uses: goabonga/multicz-action@v1

      - name: Configure git
        run: |
          NAME="${{ github.event.head_commit.author.name }}"
          EMAIL="${{ github.event.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: multicz validate
        run: multicz validate --strict

      - name: multicz plan
        id: plan
        run: |
          set -euo pipefail
          multicz plan --summary "$GITHUB_STEP_SUMMARY" \
            --output json | tee /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag, push (signed)
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available == 'true'
        run: |
          multicz bump --commit --tag --push --sign \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available != 'true'
        run: |
          multicz bump --commit --tag --push \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json

      - name: Extract bumped versions
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          API=$(jq -r          '.bumps.api.next_version           // empty' /tmp/release.json)
          JOB=$(jq -r       '.bumps.job.next_version        // empty' /tmp/release.json)
          CLI=$(jq -r          '.bumps.cli.next_version           // empty' /tmp/release.json)
          SSR=$(jq -r          '.bumps.ssr.next_version           // empty' /tmp/release.json)
          CHART_API=$(jq -r    '.bumps["chart-api"].next_version    // empty' /tmp/release.json)
          CHART_JOB=$(jq -r '.bumps["chart-job"].next_version // empty' /tmp/release.json)
          CHART_SSR=$(jq -r    '.bumps["chart-ssr"].next_version    // empty' /tmp/release.json)
          DOCS=$(jq -r         '.bumps.docs.next_version          // empty' /tmp/release.json)
          echo "api_version=$API"                   >> "$GITHUB_OUTPUT"
          echo "job_version=$JOB"             >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI"                   >> "$GITHUB_OUTPUT"
          echo "ssr_version=$SSR"                   >> "$GITHUB_OUTPUT"
          echo "chart_api_version=$CHART_API"       >> "$GITHUB_OUTPUT"
          echo "chart_job_version=$CHART_JOB" >> "$GITHUB_OUTPUT"
          echo "chart_ssr_version=$CHART_SSR"       >> "$GITHUB_OUTPUT"
          echo "docs_version=$DOCS"                 >> "$GITHUB_OUTPUT"

      - name: Compute lowercase owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Output the bare repo name for downstream publish jobs to build
      # their image/chart names (`<repo>-<component>`). Lets a fork
      # publish under its own namespace without overwriting upstream.
      - name: Compute repo name
        id: names
        run: |
          echo "repo=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-bump
          body: |
            `multicz bump --commit --tag --push` (signed when
            `GPG_PRIVATE_KEY` + `GPG_PASSPHRASE` are set). Per-component
            publish jobs (`release-<component>`) read this job's
            outputs to know what to publish.

  # ─────────────────────── per-component publish jobs ───────────────────────

  release-api:
    needs: [release-bump]
    if: needs.release-bump.outputs.api_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      packages: write   # docker push
      actions: write    # delete-artifact (cleanup after publish)
      id-token: write   # cosign keyless via GitHub OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@v1
      - uses: ./.github/actions/publish-image
        with:
          component: api
          version: ${{ needs.release-bump.outputs.api_version }}
          owner: ${{ needs.release-bump.outputs.owner }}
          repo: ${{ needs.release-bump.outputs.repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-deb
        with:
          component: api
      - name: gh release create api-v${{ needs.release-bump.outputs.api_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="api-v${{ needs.release-bump.outputs.api_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file - /tmp/shomer-api_*.deb
      # Published — the CI artifacts are now obsolete (image lives in
      # ghcr, .deb is a release asset). Drop them so the workflow
      # run page doesn't carry duplicates after retention.
      - name: Delete consumed CI artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            api-image
            api-deb
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-api
          body: |
            Pushed `ghcr.io/${{ needs.release-bump.outputs.owner }}/${{ needs.release-bump.outputs.repo }}-api:${{ needs.release-bump.outputs.api_version }}` (+ `latest`),
            built `shomer-api_${{ needs.release-bump.outputs.api_version }}-1_all.deb`, cut GitHub Release `api-v${{ needs.release-bump.outputs.api_version }}` with the .deb attached.
            CI artifacts (`api-image`, `api-deb`) deleted post-publish.

  release-job:
    needs: [release-bump]
    if: needs.release-bump.outputs.job_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
      id-token: write   # cosign keyless via GitHub OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@v1
      - uses: ./.github/actions/publish-image
        with:
          component: job
          version: ${{ needs.release-bump.outputs.job_version }}
          owner: ${{ needs.release-bump.outputs.owner }}
          repo: ${{ needs.release-bump.outputs.repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-deb
        with:
          component: job
      - name: gh release create job-v${{ needs.release-bump.outputs.job_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="job-v${{ needs.release-bump.outputs.job_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file - /tmp/shomer-job_*.deb
      - name: Delete consumed CI artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            job-image
            job-deb
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-job
          body: |
            Pushed `ghcr.io/${{ needs.release-bump.outputs.owner }}/${{ needs.release-bump.outputs.repo }}-job:${{ needs.release-bump.outputs.job_version }}` (+ `latest`),
            built `shomer-job_${{ needs.release-bump.outputs.job_version }}-1_all.deb`, cut GitHub Release `job-v${{ needs.release-bump.outputs.job_version }}` with the .deb attached.
            CI artifacts (`job-image`, `job-deb`) deleted post-publish.

  release-ssr:
    needs: [release-bump]
    if: needs.release-bump.outputs.ssr_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
      id-token: write   # cosign keyless via GitHub OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@v1
      - uses: ./.github/actions/publish-image
        with:
          component: ssr
          version: ${{ needs.release-bump.outputs.ssr_version }}
          owner: ${{ needs.release-bump.outputs.owner }}
          repo: ${{ needs.release-bump.outputs.repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-deb
        with:
          component: ssr
      - name: gh release create ssr-v${{ needs.release-bump.outputs.ssr_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ssr-v${{ needs.release-bump.outputs.ssr_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file - /tmp/shomer-ssr_*.deb
      # Also drop the web-dist (consumed only by ssr-* jobs
      # which are now done) — no separate release-web job
      # exists since web ships through the ssr image/.deb.
      - name: Delete consumed CI artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            ssr-image
            ssr-deb
            web-dist
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-ssr
          body: |
            Pushed `ghcr.io/${{ needs.release-bump.outputs.owner }}/${{ needs.release-bump.outputs.repo }}-ssr:${{ needs.release-bump.outputs.ssr_version }}` (+ `latest`),
            built `shomer-ssr_${{ needs.release-bump.outputs.ssr_version }}-1_all.deb`, cut GitHub Release `ssr-v${{ needs.release-bump.outputs.ssr_version }}` with the .deb attached.
            CI artifacts (`ssr-image`, `ssr-deb`, `web-dist`) deleted post-publish.

  release-cli:
    # cli has no docker image and no helm chart — just a .deb + tag.
    needs: [release-bump]
    if: needs.release-bump.outputs.cli_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@v1
      - uses: ./.github/actions/publish-deb
        with:
          component: cli
      - name: gh release create cli-v${{ needs.release-bump.outputs.cli_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="cli-v${{ needs.release-bump.outputs.cli_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file - /tmp/shomer-cli_*.deb
      - name: Delete consumed CI artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: cli-deb
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-cli
          body: |
            Built `shomer-cli_${{ needs.release-bump.outputs.cli_version }}-1_all.deb`, cut GitHub Release `cli-v${{ needs.release-bump.outputs.cli_version }}` with the .deb attached.
            CI artifact (`cli-deb`) deleted post-publish.

  release-chart-api:
    needs: [release-bump]
    if: needs.release-bump.outputs.chart_api_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@v1
      - uses: ./.github/actions/publish-chart
        with:
          component: api
          owner: ${{ needs.release-bump.outputs.owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: gh release create chart-api-v${{ needs.release-bump.outputs.chart_api_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="chart-api-v${{ needs.release-bump.outputs.chart_api_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Delete consumed CI artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: chart-api-tgz
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-chart-api
          body: |
            Pushed `oci://ghcr.io/${{ needs.release-bump.outputs.owner }}/charts/${{ needs.release-bump.outputs.repo }}-api:${{ needs.release-bump.outputs.chart_api_version }}`,
            cut GitHub Release `chart-api-v${{ needs.release-bump.outputs.chart_api_version }}`.
            CI artifact (`chart-api-tgz`) deleted post-publish.

  release-chart-job:
    needs: [release-bump]
    if: needs.release-bump.outputs.chart_job_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@v1
      - uses: ./.github/actions/publish-chart
        with:
          component: job
          owner: ${{ needs.release-bump.outputs.owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: gh release create chart-job-v${{ needs.release-bump.outputs.chart_job_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="chart-job-v${{ needs.release-bump.outputs.chart_job_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Delete consumed CI artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: chart-job-tgz
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-chart-job
          body: |
            Pushed `oci://ghcr.io/${{ needs.release-bump.outputs.owner }}/charts/${{ needs.release-bump.outputs.repo }}-job:${{ needs.release-bump.outputs.chart_job_version }}`,
            cut GitHub Release `chart-job-v${{ needs.release-bump.outputs.chart_job_version }}`.
            CI artifact (`chart-job-tgz`) deleted post-publish.

  release-chart-ssr:
    needs: [release-bump]
    if: needs.release-bump.outputs.chart_ssr_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@v1
      - uses: ./.github/actions/publish-chart
        with:
          component: ssr
          owner: ${{ needs.release-bump.outputs.owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: gh release create chart-ssr-v${{ needs.release-bump.outputs.chart_ssr_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="chart-ssr-v${{ needs.release-bump.outputs.chart_ssr_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Delete consumed CI artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: chart-ssr-tgz
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-chart-ssr
          body: |
            Pushed `oci://ghcr.io/${{ needs.release-bump.outputs.owner }}/charts/${{ needs.release-bump.outputs.repo }}-ssr:${{ needs.release-bump.outputs.chart_ssr_version }}`,
            cut GitHub Release `chart-ssr-v${{ needs.release-bump.outputs.chart_ssr_version }}`.
            CI artifact (`chart-ssr-tgz`) deleted post-publish.

  release-docs:
    # Consume the already-built `docs-site` artifact (produced by
    # `docs-build` earlier in this run with the same bump-previewed
    # version that `release-bump` then committed) — no rebuild. Upload
    # to GitHub Pages, then cut the docs-vX.Y.Z GitHub Release.
    needs: [release-bump]
    if: needs.release-bump.outputs.docs_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      pages: write      # actions/deploy-pages
      id-token: write   # OIDC for upload-pages-artifact + deploy-pages
      actions: write    # delete-artifact (cleanup after publish)
    concurrency:
      group: pages      # one in-flight Pages deploy per repo
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@v1
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: gh release create docs-v${{ needs.release-bump.outputs.docs_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="docs-v${{ needs.release-bump.outputs.docs_version }}"
          multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
      - name: Delete consumed CI artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: docs-site
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-docs
          body: |
            Reused `docs-site` artifact from `docs-build`, deployed docs `${{ needs.release-bump.outputs.docs_version }}` to ${{ steps.deploy.outputs.page_url }},
            cut GitHub Release `docs-v${{ needs.release-bump.outputs.docs_version }}`.
            CI artifact (`docs-site`) deleted post-publish.
