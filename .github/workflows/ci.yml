  chart-web-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'chart-web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - name: helm lint — chart-web
        run: helm lint packages/web/chart
      - name: helm template smoke — chart-web
        run: helm template ci packages/web/chart > /tmp/chart-web.yaml
      - name: Summary
        if: always()
