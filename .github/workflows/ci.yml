# CI + release pipeline. Per-component named jobs — no matrix, every
# job is its own graph node so dependencies are explicit and the
# GitHub Actions UI tells you at a glance which component broke.
#
# ─── Graph entry (linear, every job downstream skips on failure):
#
#   validate ── detect ── headers ──> per-component chains
#                                     docs-build
#
# ─── Per-component chain (python/buildable — api / job / ssr):
#
#                    ┌─ X-lint     ─┐                            ┌─ X-container ─ X-sbom ─ X-grype ─┐
#   detect, headers ─┼─ X-format   ─┼─ X-test ─ X-bandit ─ audit ┤                                  ├─ owasp-X (kind+ZAP, ssr/api only)
#                    └─ X-typecheck┘                             └─ X-deb ─ X-deb-validate ────────┘
#
# - cli has the same lint/test/bandit/deb chain, no container/sbom/grype/owasp.
# - charts (chart-{api,job,ssr}) have chart-X-lint → chart-X-checkov.
# - web has its own JS chain that feeds web-build,
#   consumed by ssr-{test,container,deb} via `web-dist` artifact.
#
# Per-component change-gating uses
#   `if: contains(fromJson(needs.detect.outputs.changed).changed, '<name>')`
# on the *-lint/format/typecheck/test entry points. The skip then
# cascades down via `needs:` so unchanged components produce no work.
# detect must sit in `needs:` directly because GitHub Actions only
# exposes outputs for *direct* needs, not transitive.
#
# ─── Release fan-out (main only, !chore(release), all upstream green):
#
#   owasp-api ─┐
#   owasp-ssr ─┤
#   *-deb-validate (4) ─┤
#   docs-build         ─┼─> release-bump  ┬─> release-api          (docker + .deb + gh release)
#   validate           ─┘                 ├─> release-job       (idem)
#                                         ├─> release-ssr          (idem)
#                                         ├─> release-cli          (.deb + gh release, no docker)
#                                         ├─> release-chart-api    (helm OCI push + gh release)
#                                         ├─> release-chart-job (idem)
#                                         ├─> release-chart-ssr    (idem)
#                                         └─> release-docs         (zensical build + Pages + gh release)
#
# release-bump runs `multicz bump --commit --tag --push` for ALL
# components that bumped — one atomic commit, N per-component tags.
# Each downstream `release-<X>` job has `if: needs.release-bump.outputs.<X>_version != ''`,
# so a component that didn't bump produces no publish.

name: ci

on:
  # `branches: [main]` is load-bearing. Without it `pull_request` fires on
  # PRs into ANY branch, including the main -> deploy/<env> PRs that
  # infra-plan opens — 119 jobs re-validating content identical to main,
  # which CI already ran on the push. It has not bitten yet only because
  # those PRs are created with GITHUB_TOKEN, whose events do not start
  # workflows; opening one by hand would.
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default for every job — anything that needs to write
# (push commits/tags, create GitHub Releases, push to GHCR, deploy
# Pages, sign with OIDC) declares an override in its own `permissions:`
# block. Plumber's ISSUE-801 wants explicit permissions everywhere; the
# workflow-level default satisfies it for jobs that don't override.
permissions:
  contents: read

jobs:
  # ─────────────────────── graph entry: validate ─ detect ─ headers + docs-build ───────────────────────

  # Compliance audit over .github/** — the whole graph funnels through
  # `detect`, which needs this, so a workflow finding stops the run before
  # any other job spends a runner. That ordering matters beyond cost:
  # template injection and impostor-commit findings describe cases where
  # *running* the pipeline is itself the exploit, so gating afterwards is
  # too late.
  #
  # It is not a security boundary on its own — whoever can edit a workflow
  # can edit this job in the same commit. Make it a required status check
  # in branch protection; that is what actually blocks a merge.
  #
  # ~90s, on every push and PR. plumber.yml keeps only the weekly cron.
  plumber:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # SARIF upload to Code Scanning
      actions: read            # Plumber parses every workflow, not just this one
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/plumber-scan
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: plumber
          body: 'Plumber compliance audit on `.github/**` (threshold 100 — any finding fails).'

  detect:
    # Gate on validate so a broken multicz.toml fails loudly upfront
    # rather than cryptically inside the `changed` action below.
    #
    # Two paths:
    #
    # 1. `chore(release):` head commit — that's multicz's own
    #    release commit looping back through CI. There's nothing
    #    new to build (artefacts were already produced by the
    #    upstream release-bump → release-<component> chain that
    #    *created* this commit), so we short-circuit: write a
    #    summary of what was published and emit `changed=[]`
    #    explicitly. Every downstream job is gated on
    #    `contains(fromJson(needs.detect.outputs.changed).changed,
    #    '<comp>')` — an empty array cascades the skip across the
    #    whole graph (per-component jobs skip directly; the
    #    `!failure() && !cancelled() && needs.X.result == 'success'`
    #    override jobs skip because their upstream becomes
    #    'skipped' ≠ 'success'). The workflow run is still
    #    auditable but reads as a one-page release notice.
    # 2. Anything else — run `multicz changed` to compute the real
    #    per-component diff.
    # plumber runs alongside validate, not behind it: they answer
    # independent questions and both are cheap. detect waits on both, so
    # nothing else in the graph starts until the workflows themselves
    # have been audited.
    needs: [validate, plumber]
    runs-on: ubuntu-latest
    outputs:
      # `||` returns the first non-empty branch: the release-bypass
      # output wins on `chore(release):` commits, the multicz-action
      # output wins otherwise.
      changed: ${{ steps.release-bypass.outputs.changed || steps.changed.outputs.json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: release-bypass
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Parse the multicz commit body: the first line is shaped
          # `chore(release): bump api 0.1.1 -> 0.1.2, job 1.0.0 ->
          # 1.0.1, ssr 1.0.2 -> 1.0.3, ...`. Split on commas after
          # the leading `bump ` literal to get one entry per
          # component, then render each as a markdown bullet.
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          bumps=${subject#chore(release): bump }
          {
            printf '## chore(release) — pipeline short-circuited\n\n'
            printf 'This run targets multicz'"'"'s own release commit'
            printf ' (`%s`). The Docker images, `.deb` packages,'    \
                   "${GITHUB_SHA:0:7}"
            printf ' Helm charts and GitHub releases were already'
            printf ' produced by the upstream `release-bump → release-<comp>`'
            printf ' chain that *created* this commit, so re-running'
            printf ' the full CI graph would produce identical artifacts.\n\n'
            printf '### Versions published\n\n'
            printf '%s' "$bumps" | tr ',' '\n' | sed -E 's/^ *//; s/^/- /'
            printf '\n### Skipped\n\n'
            printf 'Every per-component lint/format/typecheck/test/'
            printf 'container/sbom/grype/deb/e2e/owasp/release-* job'
            printf ' skips on this commit via the empty `changed=[]`'
            printf ' output below. `validate`, `detect` and `headers`'
            printf ' still run as smoke checks.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          # Empty `changed` array — every downstream `contains(...)`
          # gate evaluates false and the cascade skips.
          printf 'changed={"changed":[],"unchanged":[]}\n' >> "$GITHUB_OUTPUT"

      - id: changed
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        uses: goabonga/multicz-action/changed@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
        with:
          output: json

      - name: Summary
        # Skip on the release-bypass path — we already wrote a
        # richer summary up there.
        if: always() && !startsWith(github.event.head_commit.message, 'chore(release):')
        uses: ./.github/actions/summary
        with:
          title: detect
          body: |
            Changed components: `${{ steps.changed.outputs.json }}`

  headers:
    # Two gates:
    #
    # 1. `needs: [detect]` so a broken multicz config kills the run
    #    upstream before headers (and everything downstream) starts.
    # 2. `toJSON(... .changed) != '[]'` so headers only fires when
    #    at least one tracked component actually moved — pure
    #    `fix(ci):` / `chore(release):` / docs-only commits leave
    #    nothing for `scripts/add_license_header.py --check` to
    #    re-validate. GitHub Actions expressions don't expose a
    #    `length()` function, so we round-trip the array through
    #    `toJSON()` and compare against the literal empty-array
    #    string instead.
    #
    # Trade-off: a commit that ONLY touches `scripts/` won't trigger
    # the headers check, because `scripts/` isn't a multicz-tracked
    # component. That's intentional — scripts/ changes are rare, the
    # check is local-cheap (`uv run ... --check`), and missed headers
    # there get caught on the next commit that does move a tracked
    # component.
    needs: [detect]
    if: toJSON(fromJson(needs.detect.outputs.changed).changed) != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"
      - name: SPDX license headers
        run: |
          uv run python scripts/add_license_header.py --path packages --check
          uv run python scripts/add_license_header.py --path scripts --check
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: headers
          body: SPDX header check on `packages/` and `scripts/`.

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      - name: multicz validate
        run: multicz validate --strict
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: '`multicz validate --strict` on the workspace config.'

  docs-build:
    # Build the zensical site on every docs change (PR + main). On
    # main, `release-docs` reuses the resulting `docs-site` artifact
    # instead of rebuilding — bump-preview already wrote the next
    # version into the working tree, so the bytes are identical to
    # what release-docs would produce.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"
      - name: Install workspace + doc group
        run: uv sync --frozen --all-packages --group doc
      - name: Zensical build
        run: uv run zensical build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs-build
          body: '`zensical build` → uploaded as `docs-site` for `release-docs` to consume.'

  # docs-deploy is gone. The bump for `docs` now happens in
  # `release-bump` alongside the other components; the build +
  # Pages deploy + GitHub Release moved to `release-docs` (after
  # `release-bump`, mirroring `release-api` / `release-chart-X`).

  # ─────────────────────── api ───────────────────────

  api-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — api
        run: uv run ruff check packages/api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-lint
          body: '`ruff check` on `packages/api/`.'

  api-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — api
        run: uv run ruff format --check packages/api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-format
          body: '`ruff format --check` on `packages/api/`.'

  api-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — api
        run: uv run --with mypy mypy --strict packages/api/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-typecheck
          body: '`mypy --strict` on `packages/api/src/`.'

  api-test:
    needs: [api-lint, api-format, api-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest + coverage — api
        run: uv run --with pytest-cov pytest packages/api/tests --cov=shomer_api --cov-report=term-missing --cov-fail-under=100 -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-test
          body: '`pytest` on `packages/api/tests/`.'

  api-bandit:
    needs: [api-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — api
        run: bandit -r packages/api/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-bandit
          body: '`bandit -r` on `packages/api/src/`.'

  api-hadolint:
    # Dockerfile lint — runs parallel to the Python lint family,
    # gates `api-container` so a broken Dockerfile fails before
    # consuming a builder.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: packages/api/Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-hadolint
          body: '`hadolint` on `packages/api/Dockerfile`.'

  api-container:
    # Explicit per-component gate. Without it the job hits GitHub
    # Actions' implicit transitive-skip cascade: `audit` runs (its
    # own `!failure() && !cancelled() && contains(...)` if passes)
    # but pulls `job-test` / `ssr-test` / `cli-test` as `skipped`
    # needs on a partial-change run — that "skipped" status
    # propagates downstream and quietly marks api-container as
    # skipped even though its own direct needs (api-bandit, audit,
    # api-hadolint) are all success. Same pattern as the explicit
    # gates on api-sbom / api-grype / api-deb-validate; surfaced by
    # run 27478713539 where api-only changes left api-container
    # un-built and the whole release-api / e2e-with-fresh-image
    # path silently dead.
    needs: [api-bandit, audit, api-hadolint, detect]
    if: '!failure() && !cancelled() && contains(fromJson(needs.detect.outputs.changed).changed, ''api'')'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      # The three OCI annotation values that cannot be static. The rest
      # are LABELs in the Dockerfile itself, so a local `docker build`
      # carries them too and — the Dockerfile being in the component's
      # multicz paths — editing them actually releases an image that has
      # them. bump-preview has already rewritten VERSION to the version
      # this build will be released as.
      - name: OCI image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(sed -n 's/^api=//p' VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build api image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: packages/api
          load: true
          # `provenance` / `sbom` flags are incompatible with `load:
          # true` (manifest lists don't go through the docker
          # exporter). Provenance + SBOM attestation are attached at
          # push time via cosign in `.github/actions/publish-image`.
          tags: api:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=api
          # ignore-error: the GHA cache export can fail to reserve its key
          # even when the image built fine (see ssr). A cache miss must not
          # fail a green build — degrade to "no cache written" instead.
          cache-to: type=gha,mode=max,scope=api,ignore-error=true
      - name: Assert the OCI annotations landed
        run: |
          set -euo pipefail
          for k in version revision created source title licenses; do
            v=$(docker image inspect api:ci \
                  --format "{{ index .Config.Labels \"org.opencontainers.image.$k\" }}")
            [ -n "$v" ] || { echo "::error::org.opencontainers.image.$k is empty"; exit 1; }
            printf '  %-14s %s\n' "$k" "$v"
          done
      - name: Save image tarball
        run: docker save api:ci -o /tmp/api.tar
      - uses: actions/upload-artifact@v7
        with: { name: api-image, path: /tmp/api.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-container
          body: 'Built `api:ci` (saved to artifact `api-image`).'

  api-sbom:
    needs: [api-container]
    # Explicit gate so we don't inherit github actions' implicit
    # "all transitive needs must have succeeded" — upstream
    # api-container has its own conditional if, and the cascade
    # silently skips this job otherwise even when api-container
    # itself ran fine.
    if: '!failure() && !cancelled() && needs.api-container.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # need .github/actions/summary on disk
      - uses: actions/download-artifact@v8
        with: { name: api-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/api.tar -o spdx-json=/tmp/api.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: api-sbom, path: /tmp/api.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-sbom
          body: 'SPDX SBOM via `syft` (artifact `api-sbom`).'

  api-grype:
    needs: [api-sbom]
    if: '!failure() && !cancelled() && needs.api-sbom.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: api-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        working-directory: packages/api
        run: grype sbom:/tmp/api.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-grype
          body: '`grype --fail-on high` on the api SBOM.'

  api-deb:
    # Smoke-build the .deb on every api change so packaging
    # regressions surface in PR CI, not only when release.yml fires.
    # Explicit `contains(changed, 'api')` gate for the same reason
    # api-container above carries one — `audit` has skipped needs on
    # partial-change runs and the implicit transitive-skip cascade
    # otherwise marks api-deb as skipped despite its own needs being
    # green.
    needs: [api-bandit, audit, detect]
    if: '!failure() && !cancelled() && contains(fromJson(needs.detect.outputs.changed).changed, ''api'')'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build api .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-api
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/api "$WORK/shomer-api"
          cd "$WORK/shomer-api"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-api_*.deb "$WORK"/shomer-api_*.buildinfo "$WORK"/shomer-api_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: api-deb, path: /tmp/shomer-api_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-deb
          body: 'Built `shomer-api_*.deb` (artifact `api-deb`).'

  api-deb-validate:
    needs: [api-deb]
    # Explicit gate (see api-sbom rationale): default `if:` would
    # inherit the cascaded skip from api-deb's own conditional even
    # when api-deb itself ran fine.
    if: '!failure() && !cancelled() && needs.api-deb.result == ''success'''
    # Three independent gates against the just-built .deb (lintian,
    # pytest, systemd-analyze security). On any failure the artifact
    # is deleted so a broken build can't be mistaken for a working
    # one downstream. See `.github/actions/validate-deb/action.yml`.
    runs-on: ubuntu-latest
    permissions:
      actions: write   # delete-artifact (cleanup on validation failure)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-deb-validate
          body: 'lintian + `tests/install/test_api.py` + `systemd-analyze security` (display score ≤ 1.0).'

  # ─────────────────────── job ───────────────────────

  job-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — job
        run: uv run ruff check packages/job
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-lint
          body: '`ruff check` on `packages/job/`.'

  job-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — job
        run: uv run ruff format --check packages/job
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-format
          body: '`ruff format --check` on `packages/job/`.'

  job-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — job
        run: uv run --with mypy mypy --strict packages/job/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-typecheck
          body: '`mypy --strict` on `packages/job/src/`.'

  job-test:
    needs: [job-lint, job-format, job-typecheck]
    runs-on: ubuntu-latest
    # Redis broker / result backend for the Celery worker. The unit
    # suite runs tasks eagerly (no broker needed), but the service is
    # here so integration-style checks can reach a live broker.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest + coverage — job
        env:
          REDIS_URL: redis://localhost:6379/0
        run: uv run --with pytest-cov pytest packages/job/tests --cov=shomer_job --cov-report=term-missing --cov-fail-under=100 -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-test
          body: '`pytest` on `packages/job/tests/`.'

  job-bandit:
    needs: [job-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — job
        run: bandit -r packages/job/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-bandit
          body: '`bandit -r` on `packages/job/src/`.'

  job-hadolint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: packages/job/Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-hadolint
          body: '`hadolint` on `packages/job/Dockerfile`.'

  job-container:
    # See api-container — same explicit gate to defeat the implicit
    # transitive-skip cascade from audit's mixed-status needs.
    needs: [job-bandit, audit, job-hadolint, detect]
    if: '!failure() && !cancelled() && contains(fromJson(needs.detect.outputs.changed).changed, ''job'')'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      # The three OCI annotation values that cannot be static. The rest
      # are LABELs in the Dockerfile itself, so a local `docker build`
      # carries them too and — the Dockerfile being in the component's
      # multicz paths — editing them actually releases an image that has
      # them. bump-preview has already rewritten VERSION to the version
      # this build will be released as.
      - name: OCI image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(sed -n 's/^job=//p' VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build job image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: packages/job
          load: true
          # See api-container: attestations done via cosign post-push.
          tags: job:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=job
          cache-to: type=gha,mode=max,scope=job,ignore-error=true
      - name: Assert the OCI annotations landed
        run: |
          set -euo pipefail
          for k in version revision created source title licenses; do
            v=$(docker image inspect job:ci \
                  --format "{{ index .Config.Labels \"org.opencontainers.image.$k\" }}")
            [ -n "$v" ] || { echo "::error::org.opencontainers.image.$k is empty"; exit 1; }
            printf '  %-14s %s\n' "$k" "$v"
          done
      - name: Save image tarball
        run: docker save job:ci -o /tmp/job.tar
      - uses: actions/upload-artifact@v7
        with: { name: job-image, path: /tmp/job.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-container
          body: 'Built `job:ci` (saved to artifact `job-image`).'

  job-sbom:
    needs: [job-container]
    if: '!failure() && !cancelled() && needs.job-container.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: job-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/job.tar -o spdx-json=/tmp/job.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: job-sbom, path: /tmp/job.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-sbom
          body: 'SPDX SBOM via `syft` (artifact `job-sbom`).'

  job-grype:
    needs: [job-sbom]
    if: '!failure() && !cancelled() && needs.job-sbom.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: job-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        working-directory: packages/job
        run: grype sbom:/tmp/job.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-grype
          body: '`grype --fail-on high` on the job SBOM.'

  job-deb:
    # See api-deb — same explicit gate.
    needs: [job-bandit, audit, detect]
    if: '!failure() && !cancelled() && contains(fromJson(needs.detect.outputs.changed).changed, ''job'')'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build job .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-job
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/job "$WORK/shomer-job"
          cd "$WORK/shomer-job"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-job_*.deb "$WORK"/shomer-job_*.buildinfo "$WORK"/shomer-job_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: job-deb, path: /tmp/shomer-job_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-deb
          body: 'Built `shomer-job_*.deb` (artifact `job-deb`).'

  job-deb-validate:
    needs: [job-deb]
    if: '!failure() && !cancelled() && needs.job-deb.result == ''success'''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/validate-deb
        with:
          component: job
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-deb-validate
          body: 'lintian + `tests/install/test_job.py` + `systemd-analyze security` (display score ≤ 1.0).'

  # ─────────────────────── ssr ───────────────────────

  ssr-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff lint — ssr
        run: uv run ruff check packages/ssr
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-lint
          body: '`ruff check` on `packages/ssr/`.'

  ssr-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Ruff format check — ssr
        run: uv run ruff format --check packages/ssr
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-format
          body: '`ruff format --check` on `packages/ssr/`.'

  ssr-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Mypy --strict — ssr
        run: uv run --with mypy mypy --strict packages/ssr/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-typecheck
          body: '`mypy --strict` on `packages/ssr/src/`.'

  ssr-test:
    needs: [ssr-lint, ssr-format, ssr-typecheck, web-build]
    # Run if ssr changed (lint/format/typecheck succeeded) OR
    # web changed (build succeeded). When only one side
    # changes, the other's needs entry is `skipped` — the OR keeps
    # us going.
    if: >-
      !failure() && !cancelled() && (
        needs.ssr-lint.result == 'success' ||
        needs.web-build.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      # Only overwrite the committed `static/` + `templates/` if the
      # frontend was actually rebuilt this run; otherwise pytest uses
      # whatever is on disk (= the committed dist on `main`).
      - if: needs.web-build.result == 'success'
        uses: actions/download-artifact@v8
        with: { name: web-dist, path: . }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --frozen --all-packages
      - name: Pytest + coverage — ssr
        run: uv run --with pytest-cov pytest packages/ssr/tests --cov=shomer_ssr --cov-report=term-missing --cov-fail-under=100 -q
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-test
          body: '`pytest` on `packages/ssr/tests/`.'

  ssr-bandit:
    needs: [ssr-test]
    # Explicit gate — NOT the implicit `success()`. `ssr-test` overrides
    # its own default gate to survive a skipped `web-build` (web
    # unchanged), but the implicit gate on a child evaluates over the
    # TRANSITIVE needs closure, where `web-build` is still skipped. Left
    # bare, this job skipped on an ssr-only commit and cascade-skipped
    # ssr-container -> ssr-deb -> ssr-deb-validate, which made
    # release-bump's `ssr changed => ssr-deb-validate succeeded` gate
    # false and dropped the whole release (runs 30399596663 /
    # 30433088863: ssr + migrations both went unbumped).
    if: "!failure() && !cancelled() && needs.ssr-test.result == 'success'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with: { python-version: "3.12" }
      - run: uv tool install bandit
      - name: Bandit — ssr
        run: bandit -r packages/ssr/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-bandit
          body: '`bandit -r` on `packages/ssr/src/`.'

  ssr-hadolint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'ssr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: packages/ssr/Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-hadolint
          body: '`hadolint` on `packages/ssr/Dockerfile`.'

  ssr-container:
    needs: [ssr-bandit, audit, web-build, ssr-hadolint]
    # Run when the ssr image actually needs rebuilding — i.e. ssr's
    # Python passed bandit AND audit succeeded. web-build
    # being skipped is fine: we fall back to the committed dist.
    if: >-
      !failure() && !cancelled() &&
      needs.ssr-bandit.result == 'success' &&
      needs.audit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - if: needs.web-build.result == 'success'
        uses: actions/download-artifact@v8
        with: { name: web-dist, path: . }
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      # The three OCI annotation values that cannot be static. The rest
      # are LABELs in the Dockerfile itself, so a local `docker build`
      # carries them too and — the Dockerfile being in the component's
      # multicz paths — editing them actually releases an image that has
      # them. bump-preview has already rewritten VERSION to the version
      # this build will be released as.
      - name: OCI image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(sed -n 's/^ssr=//p' VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build ssr image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: packages/ssr
          load: true
          # See api-container: attestations done via cosign post-push.
          tags: ssr:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=ssr
          cache-to: type=gha,mode=max,scope=ssr,ignore-error=true
      - name: Assert the OCI annotations landed
        run: |
          set -euo pipefail
          for k in version revision created source title licenses; do
            v=$(docker image inspect ssr:ci \
                  --format "{{ index .Config.Labels \"org.opencontainers.image.$k\" }}")
            [ -n "$v" ] || { echo "::error::org.opencontainers.image.$k is empty"; exit 1; }
            printf '  %-14s %s\n' "$k" "$v"
          done
      - name: Save image tarball
        run: docker save ssr:ci -o /tmp/ssr.tar
      - uses: actions/upload-artifact@v7
        with: { name: ssr-image, path: /tmp/ssr.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-container
          body: 'Built `ssr:ci` (saved to artifact `ssr-image`).'

  ssr-sbom:
    needs: [ssr-container]
    if: '!failure() && !cancelled() && needs.ssr-container.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ssr-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/ssr.tar -o spdx-json=/tmp/ssr.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: ssr-sbom, path: /tmp/ssr.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-sbom
          body: 'SPDX SBOM via `syft` (artifact `ssr-sbom`).'

  ssr-grype:
    needs: [ssr-sbom]
    if: '!failure() && !cancelled() && needs.ssr-sbom.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ssr-sbom, path: /tmp }
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan SBOM (--fail-on high)
        working-directory: packages/ssr
        run: grype sbom:/tmp/ssr.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-grype
          body: '`grype --fail-on high` on the ssr SBOM.'

  ssr-deb:
    needs: [ssr-bandit, audit, web-build]
    if: >-
      !failure() && !cancelled() &&
      needs.ssr-bandit.result == 'success' &&
      needs.audit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - if: needs.web-build.result == 'success'
        uses: actions/download-artifact@v8
        with: { name: web-dist, path: . }
      - name: Install debian build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev
      - name: Build ssr .deb
        run: |
          set -euo pipefail
          WORK=/tmp/build-ssr
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/ssr "$WORK/shomer-ssr"
          cd "$WORK/shomer-ssr"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-ssr_*.deb "$WORK"/shomer-ssr_*.buildinfo "$WORK"/shomer-ssr_*.changes /tmp/
      - uses: actions/upload-artifact@v7
        with: { name: ssr-deb, path: /tmp/shomer-ssr_*.deb, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: ssr-deb
          body: 'Built `shomer-ssr_*.deb` (artifact `ssr-deb`).'

  ssr-deb-validate:
    needs: [ssr-deb]
    if: '!failure() && !cancelled() && needs.ssr-deb.result == ''success'''
