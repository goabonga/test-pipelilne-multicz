      - run: npm ci   # root install — hoists the npm workspace (lib + web)
      - name: Build → packages/ssr/src/shomer_ssr/{static,templates}/
        run: npm run build
        working-directory: packages/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            packages/ssr/src/shomer_ssr/static/
            packages/ssr/src/shomer_ssr/templates/
          retention-days: 1
      - name: Summary
        if: always()
