  chart-web-checkov:
    needs: [chart-web-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: packages/web/chart
          framework: helm
