            CI artifact (`cli-deb`) deleted post-publish.

  release-app-gate:
    # Detect which store-publishing secrets are configured so the Android
    # and iOS release jobs light up real signing + store uploads only
    # when the keys exist. Without them: debug-signed artifacts on the
    # GitHub Release, nothing pushed to a store. Job-level `if:` can't
    # read `secrets`, so their presence is surfaced as booleans here.
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.app_version != ''
    runs-on: ubuntu-latest
    outputs:
      android_sign: ${{ steps.detect.outputs.android_sign }}
      play: ${{ steps.detect.outputs.play }}
      apple: ${{ steps.detect.outputs.apple }}
    steps:
      - id: detect
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APPLE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          {
            echo "android_sign=${KS:+yes}"
            echo "play=${PLAY:+yes}"
            echo "apple=${APPLE:+yes}"
          } >> "$GITHUB_OUTPUT"

  release-app-android:
    # Android half of the app release. The app-vX.Y.Z GitHub Release is
    # ALWAYS cut (so the tag carries notes), but the signed AAB + APK are
    # built and attached ONLY when the upload keystore secrets are set —
    # we never publish a debug-signed binary as a release. The AAB is
    # pushed to Google Play when the service-account secret is also set.
    #
    # Optional secrets (absent => notes-only GitHub Release, no binaries):
    #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
    #   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD     — upload signing
    #   PLAY_SERVICE_ACCOUNT_JSON                    — Play Console upload
    needs: [release-bump, release-app-gate]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.app_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2  # v1
      # Build toolchain + signed build only run when a keystore is set —
      # no keystore => no binaries to produce, just the notes-only release.
      - uses: actions/setup-java@v5
        if: needs.release-app-gate.outputs.android_sign == 'yes'
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        if: needs.release-app-gate.outputs.android_sign == 'yes'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        if: needs.release-app-gate.outputs.android_sign == 'yes'
        working-directory: packages/app
      - name: Stamp native version from app_version
        if: needs.release-app-gate.outputs.android_sign == 'yes'
        env:
          VER: ${{ needs.release-bump.outputs.app_version }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gradle=packages/app/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" "$gradle"
          sed -i "s/versionCode [0-9]\+/versionCode $RUN/" "$gradle"
      - name: Decode upload keystore
        if: needs.release-app-gate.outputs.android_sign == 'yes'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > /tmp/upload.keystore
      - name: Build signed release (AAB + APK)
        if: needs.release-app-gate.outputs.android_sign == 'yes'
        working-directory: packages/app/android
        env:
          ORG_GRADLE_PROJECT_SHOMER_UPLOAD_STORE_FILE: /tmp/upload.keystore
          ORG_GRADLE_PROJECT_SHOMER_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SHOMER_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SHOMER_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Upload AAB to Google Play
        # Real signing AND a service account are both required: Play
        # rejects a debug-signed bundle.
        if: needs.release-app-gate.outputs.android_sign == 'yes' && needs.release-app-gate.outputs.play == 'yes'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shomerapp
          releaseFiles: packages/app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
      - name: gh release create app-v${{ needs.release-bump.outputs.app_version }}
        # The GitHub Release is always created; binaries are attached only
        # when they were built (keystore present).
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-bump.outputs.app_version }}
          ANDROID_SIGN: ${{ needs.release-app-gate.outputs.android_sign }}
        run: |
          set -euo pipefail
          TAG="app-v${VERSION}"
          if [ "${ANDROID_SIGN}" = "yes" ]; then
            APK=packages/app/android/app/build/outputs/apk/release/app-release.apk
            AAB=packages/app/android/app/build/outputs/bundle/release/app-release.aab
            multicz release-notes --tag "$TAG" \
              | gh release create "$TAG" --title "$TAG" --notes-file - "$APK" "$AAB"
          else
            multicz release-notes --tag "$TAG" \
              | gh release create "$TAG" --title "$TAG" --notes-file -
          fi
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-app-android
          body: |
            Cut GitHub Release `app-v${{ needs.release-bump.outputs.app_version }}` (binaries attached=`${{ needs.release-app-gate.outputs.android_sign == 'yes' }}`, Play upload=`${{ needs.release-app-gate.outputs.android_sign == 'yes' && needs.release-app-gate.outputs.play == 'yes' }}`). Without the upload keystore the release carries notes only — no debug-signed APK/AAB is published.

  release-app-ios:
    # iOS half of the app release — runs ONLY when the Apple signing
    # secrets are configured (free-runner pipelines without an Apple
    # Developer account skip it; the simulator build + Maestro E2E still
    # verify iOS in PR CI). Archives a signed device build and uploads it
    # to TestFlight / App Store Connect.
    #
    # Required secrets (all must be set for this job to run / succeed):
    #   APPLE_CERTIFICATE_BASE64 / APPLE_CERTIFICATE_PASSWORD   — .p12
    #   APPLE_PROVISIONING_PROFILE_BASE64                       — profile
    #   APPLE_BUNDLE_ID / APPLE_TEAM_ID                         — identity
    #   APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID /
    #   APP_STORE_CONNECT_PRIVATE_KEY                           — ASC API
    #
    # NOTE: the bundle id / team / profile must match the app you created
    # in App Store Connect. This path can't be exercised on a free public
    # runner without those secrets, so expect to tune it on the first run.
    needs: [release-bump, release-app-gate]
    if: |
      !failure() && !cancelled() &&
      needs.release-bump.outputs.app_version != '' &&
      needs.release-app-gate.outputs.apple == 'yes'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci
        working-directory: packages/app
      - name: CocoaPods install
        working-directory: packages/app/ios
        run: pod install
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466  # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          echo "$PROFILE_B64" | base64 -d > /tmp/profile.mobileprovision
          cp /tmp/profile.mobileprovision "$dir/"
          name=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract Name raw -)
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
      - name: Archive + export signed IPA
        working-directory: packages/app/ios
        env:
          VER: ${{ needs.release-bump.outputs.app_version }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${APPLE_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -workspace ShomerApp.xcworkspace -scheme ShomerApp \
            -configuration Release -sdk iphoneos \
            -archivePath /tmp/ShomerApp.xcarchive \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$RUN" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
          xcodebuild -exportArchive -archivePath /tmp/ShomerApp.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist -exportPath /tmp/export
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@1ad58030672057aa084b4e96beb6f7a8c627f9e6  # v5.2.1
        with:
          app-path: /tmp/export/ShomerApp.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-app-ios
          body: 'Archived a signed iOS build at `${{ needs.release-bump.outputs.app_version }}` and uploaded it to TestFlight / App Store Connect.'

