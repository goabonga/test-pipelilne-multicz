          output_format: cli
          soft_fail: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-web-checkov
          body: '`checkov --framework helm` static security scan on `packages/web/chart/`.'

  # ─────────────────────── OWASP baseline (kind + ZAP, per HTTP service) ───────────────────────

  owasp-api:
    # Spin up an ephemeral kind cluster, deploy the FULL stack
    # (api + worker + web) from CI image artifacts so the scan target
    # has its real neighbours, then port-forward api and run an OWASP
    # ZAP baseline against it. Gated on grype (not just container
    # build) so a known-vulnerable image never reaches dynamic-scan.
    needs:
      - api-grype
      - worker-grype
      - web-grype
      - chart-api-checkov
      - chart-worker-checkov
      - chart-web-checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/owasp-scan
        with:
          component: api
          port: "8000"
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp-api
          body: 'kind + helm install api/worker/web + OWASP ZAP baseline scan on api (report: `zap-api-baseline`).'

  owasp-web:
    # Same shape as owasp-api but targeting web. Both jobs install
    # the same 3 charts; only the ZAP-scan target differs. Runs in a
    # separate kind cluster so the two scans are fully independent
    # and parallel.
    needs:
      - api-grype
      - worker-grype
      - web-grype
      - chart-api-checkov
      - chart-worker-checkov
      - chart-web-checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/owasp-scan
        with:
          component: web
          port: "8080"
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp-web
          body: 'kind + helm install api/worker/web + OWASP ZAP baseline scan on web (report: `zap-web-baseline`).'

  # ─────────────────────── web-frontend (Node) ───────────────────────

  web-frontend-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web-frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web-frontend/package-lock.json
      - run: npm ci
        working-directory: packages/web-frontend
      - name: Biome lint — web-frontend
        run: npm run lint
        working-directory: packages/web-frontend
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-frontend-lint
          body: '`biome lint` (via `npm run lint`) on `packages/web-frontend/`.'

  web-frontend-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web-frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web-frontend/package-lock.json
      - run: npm ci
        working-directory: packages/web-frontend
      - name: Biome format check — web-frontend
        run: npm run format:check
        working-directory: packages/web-frontend
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-frontend-format
          body: '`biome format --check` (via `npm run format:check`) on `packages/web-frontend/`.'

  web-frontend-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'web-frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web-frontend/package-lock.json
      - run: npm ci
        working-directory: packages/web-frontend
      - name: tsc --noEmit — web-frontend
        run: npm run typecheck
        working-directory: packages/web-frontend
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-frontend-typecheck
          body: '`tsc --noEmit` (via `npm run typecheck`) on `packages/web-frontend/`.'

  web-frontend-test:
    needs: [web-frontend-lint, web-frontend-format, web-frontend-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web-frontend/package-lock.json
      - run: npm ci
        working-directory: packages/web-frontend
      - name: Vitest — web-frontend
        run: npm test
        working-directory: packages/web-frontend
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-frontend-test
          body: '`vitest` (via `npm test`) on `packages/web-frontend/`.'

  web-frontend-build:
    # Build the JS/CSS bundle + Jinja templates and publish them as
    # the `web-frontend-dist` artifact. The downstream Python web
    # package consumes the artifact (web-test / web-container /
    # web-deb) so a stale committed dist on a contributor's branch
    # never sneaks into a release — CI always rebuilds.
    needs: [web-frontend-typecheck, web-frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web-frontend/package-lock.json
      - run: npm ci
        working-directory: packages/web-frontend
      - name: Build → packages/web/src/shomer_web/{static,templates}/
        run: npm run build
        working-directory: packages/web-frontend
      - uses: actions/upload-artifact@v7
        with:
          name: web-frontend-dist
          path: |
            packages/web/src/shomer_web/static/
            packages/web/src/shomer_web/templates/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-frontend-build
          body: '`npm run build` → `static/{main.js, main.css}` + `templates/*.html`, uploaded as `web-frontend-dist`.'

  # ─────────────────────── release (main only, full graph green) ───────────────────────

  release:
    # Single release stage the whole CI graph funnels into. Replaces
    # the separate release.yml workflow_run pipeline so the entire
    # path "tested → bumped → tagged → published" lives in one run.
    #
    # Triple gate:
    #   1. On `main` only — PRs and other branches skip.
    #   2. The HEAD commit must NOT itself be a chore(release) bump
    #      (otherwise the release commit re-triggers CI and we loop).
    #   3. All upstream test / validate / scan needs passed (or were
    #      skipped). Any failure aborts the release.
    needs:
      - validate
      - owasp-api
      - owasp-web
      - api-deb-validate
      - worker-deb-validate
      - web-deb-validate
      - cli-deb-validate
      - docs-deploy
    if: >-
      !failure() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push release commit + tags
      packages: write   # push docker image + helm chart to ghcr.io

    steps:
      # `ref: main` (not the push SHA) so docs-deploy's potential bump
      # commit is picked up — we want to release on top of any
      # upstream-in-this-run state change.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace (post_bump hooks need uv lock)
        run: uv sync --frozen --all-packages

      # Node is required for web-frontend's post_bump hook
      # (`npm run build` regenerates packages/web/src/shomer_web/{static,templates}/).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web-frontend/package-lock.json

      - name: Install web-frontend deps
        run: npm ci
        working-directory: packages/web-frontend

      - uses: goabonga/multicz-action@v1

      - name: Configure git
        run: |
          NAME="${{ github.event.head_commit.author.name }}"
          EMAIL="${{ github.event.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        # Secrets can't be referenced from `if:` directly, so promote
        # their presence to a step output.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: multicz validate
        run: multicz validate --strict

      - name: multicz plan
        id: plan
        run: |
          set -euo pipefail
          multicz plan --summary "$GITHUB_STEP_SUMMARY" \
            --output json | tee /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag, push (signed)
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available == 'true'
        run: |
          multicz bump --commit --tag --push --sign \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available != 'true'
        run: |
          multicz bump --commit --tag --push \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json

      - name: Extract bumped versions
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          API=$(jq -r          '.bumps.api.next_version           // empty' /tmp/release.json)
          WORKER=$(jq -r       '.bumps.worker.next_version        // empty' /tmp/release.json)
          CLI=$(jq -r          '.bumps.cli.next_version           // empty' /tmp/release.json)
          WEB=$(jq -r          '.bumps.web.next_version           // empty' /tmp/release.json)
          CHART_API=$(jq -r    '.bumps["chart-api"].next_version    // empty' /tmp/release.json)
          CHART_WORKER=$(jq -r '.bumps["chart-worker"].next_version // empty' /tmp/release.json)
          CHART_WEB=$(jq -r    '.bumps["chart-web"].next_version    // empty' /tmp/release.json)
          echo "api_version=$API"                   >> "$GITHUB_OUTPUT"
          echo "worker_version=$WORKER"             >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI"                   >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB"                   >> "$GITHUB_OUTPUT"
          echo "chart_api_version=$CHART_API"       >> "$GITHUB_OUTPUT"
          echo "chart_worker_version=$CHART_WORKER" >> "$GITHUB_OUTPUT"
          echo "chart_web_version=$CHART_WEB"       >> "$GITHUB_OUTPUT"

      - name: Compute lowercase owner
        if: steps.plan.outputs.release == 'true'
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Derive artifact names from the repository name so a fork (or a
      # `shomer-test` sibling) builds + pushes under its own namespace
      # rather than overwriting the upstream `shomer-*` images and
      # charts. On the canonical repo this is a no-op: repository.name
      # is "shomer" -> name = "shomer-api", same as before.
      - name: Compute artifact names
        if: steps.plan.outputs.release == 'true'
        id: names
        run: |
          REPO='${{ github.event.repository.name }}'
          echo "api=${REPO}-api"       >> "$GITHUB_OUTPUT"
          echo "worker=${REPO}-worker" >> "$GITHUB_OUTPUT"
          echo "web=${REPO}-web"       >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io (docker)
        if: >-
          steps.bump.outputs.api_version != '' ||
          steps.bump.outputs.worker_version != '' ||
          steps.bump.outputs.web_version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: >-
          steps.bump.outputs.api_version != '' ||
          steps.bump.outputs.worker_version != '' ||
          steps.bump.outputs.web_version != ''

      - name: Build and push api image
        id: push_api
        if: steps.bump.outputs.api_version != ''
        uses: docker/build-push-action@v7
        with:
          context: packages/api
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.api }}:${{ steps.bump.outputs.api_version }}
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.api }}:latest
          cache-from: type=gha,scope=${{ steps.names.outputs.api }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.api }}

      - name: Build and push worker image
        id: push_worker
        if: steps.bump.outputs.worker_version != ''
        uses: docker/build-push-action@v7
        with:
          context: packages/worker
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.worker }}:${{ steps.bump.outputs.worker_version }}
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.worker }}:latest
          cache-from: type=gha,scope=${{ steps.names.outputs.worker }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.worker }}

      - name: Build and push web image
        id: push_web
        if: steps.bump.outputs.web_version != ''
        uses: docker/build-push-action@v7
        with:
          context: packages/web
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.web }}:${{ steps.bump.outputs.web_version }}
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.web }}:latest
          cache-from: type=gha,scope=${{ steps.names.outputs.web }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.web }}

      - name: Summarise pushed images
        if: steps.push_api.outcome == 'success' || steps.push_worker.outcome == 'success' || steps.push_web.outcome == 'success'
        run: |
          {
            echo "## release"
            echo
            echo "### Pushed docker images"
            echo
            echo "| image | tag | digest |"
            echo "|---|---|---|"
            if [ -n "${{ steps.push_api.outputs.digest }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.api }} | \`${{ steps.bump.outputs.api_version }}\` + \`latest\` | \`${{ steps.push_api.outputs.digest }}\` |"
            fi
            if [ -n "${{ steps.push_worker.outputs.digest }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.worker }} | \`${{ steps.bump.outputs.worker_version }}\` + \`latest\` | \`${{ steps.push_worker.outputs.digest }}\` |"
            fi
            if [ -n "${{ steps.push_web.outputs.digest }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.names.outputs.web }} | \`${{ steps.bump.outputs.web_version }}\` + \`latest\` | \`${{ steps.push_web.outputs.digest }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/setup-helm@v5
        if: >-
          steps.bump.outputs.chart_api_version != '' ||
          steps.bump.outputs.chart_worker_version != '' ||
          steps.bump.outputs.chart_web_version != ''

      - name: Helm registry login
        if: >-
          steps.bump.outputs.chart_api_version != '' ||
          steps.bump.outputs.chart_worker_version != '' ||
          steps.bump.outputs.chart_web_version != ''
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io \
            -u '${{ github.actor }}' --password-stdin

      # Rewrite each Chart.yaml's `name:` to use the dynamic
      # ${reponame}-{api,worker,web} value before packaging. The
      # committed value (`shomer-api` / `shomer-worker` / `shomer-web`)
      # stays canonical for local `helm install`; this rewrite only
      # affects the working tree during the workflow run, and the
      # templates already pull the name via `.Chart.Name` so the
      # rendered manifests follow.
      - name: Rewrite chart names
        if: >-
          steps.bump.outputs.chart_api_version != '' ||
          steps.bump.outputs.chart_worker_version != '' ||
          steps.bump.outputs.chart_web_version != ''
        run: |
          set -euo pipefail
          sed -i "s/^name: shomer-api$/name: ${{ steps.names.outputs.api }}/" \
            packages/api/chart/Chart.yaml
          sed -i "s/^name: shomer-worker$/name: ${{ steps.names.outputs.worker }}/" \
            packages/worker/chart/Chart.yaml
          sed -i "s/^name: shomer-web$/name: ${{ steps.names.outputs.web }}/" \
            packages/web/chart/Chart.yaml

      - name: Package and push api chart
        if: steps.bump.outputs.chart_api_version != ''
        run: |
          set -euo pipefail
          helm package packages/api/chart --destination /tmp
          helm push "/tmp/${{ steps.names.outputs.api }}-${{ steps.bump.outputs.chart_api_version }}.tgz" \
            "oci://ghcr.io/${{ steps.owner.outputs.value }}/charts" 2>&1 | tee /tmp/push-chart-api.out
          DIGEST=$(awk '/^Digest:/{print $2}' /tmp/push-chart-api.out)
          echo "PUSH_CHART_API_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Package and push worker chart
        if: steps.bump.outputs.chart_worker_version != ''
        run: |
          set -euo pipefail
          helm package packages/worker/chart --destination /tmp
          helm push "/tmp/${{ steps.names.outputs.worker }}-${{ steps.bump.outputs.chart_worker_version }}.tgz" \
            "oci://ghcr.io/${{ steps.owner.outputs.value }}/charts" 2>&1 | tee /tmp/push-chart-worker.out
          DIGEST=$(awk '/^Digest:/{print $2}' /tmp/push-chart-worker.out)
          echo "PUSH_CHART_WORKER_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Package and push web chart
        if: steps.bump.outputs.chart_web_version != ''
        run: |
          set -euo pipefail
          helm package packages/web/chart --destination /tmp
          helm push "/tmp/${{ steps.names.outputs.web }}-${{ steps.bump.outputs.chart_web_version }}.tgz" \
            "oci://ghcr.io/${{ steps.owner.outputs.value }}/charts" 2>&1 | tee /tmp/push-chart-web.out
          DIGEST=$(awk '/^Digest:/{print $2}' /tmp/push-chart-web.out)
          echo "PUSH_CHART_WEB_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Summarise pushed charts
        if: >-
          steps.bump.outputs.chart_api_version != '' ||
          steps.bump.outputs.chart_worker_version != '' ||
          steps.bump.outputs.chart_web_version != ''
        run: |
          {
            echo
            echo "### Pushed helm charts"
            echo
            echo "| chart | version | digest |"
            echo "|---|---|---|"
            if [ -n "${PUSH_CHART_API_DIGEST:-}" ]; then
              echo "| ${{ steps.names.outputs.api }} | \`${{ steps.bump.outputs.chart_api_version }}\` | \`${PUSH_CHART_API_DIGEST}\` |"
            fi
            if [ -n "${PUSH_CHART_WORKER_DIGEST:-}" ]; then
              echo "| ${{ steps.names.outputs.worker }} | \`${{ steps.bump.outputs.chart_worker_version }}\` | \`${PUSH_CHART_WORKER_DIGEST}\` |"
            fi
            if [ -n "${PUSH_CHART_WEB_DIGEST:-}" ]; then
              echo "| ${{ steps.names.outputs.web }} | \`${{ steps.bump.outputs.chart_web_version }}\` | \`${PUSH_CHART_WEB_DIGEST}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install debian build tooling
        if: >-
          steps.bump.outputs.api_version != '' ||
          steps.bump.outputs.worker_version != '' ||
          steps.bump.outputs.cli_version != '' ||
          steps.bump.outputs.web_version != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject dpkg-dev

      # dpkg-source enforces that the source dir name match the
      # package name from debian/control. Our workspace layout is
      # packages/{api,worker,cli,web}/ but the packages are
      # shomer-{api,worker,cli,web} — so copy each one to a tmp dir
      # at the correct name and build from there.
      - name: Build api debian package
        if: steps.bump.outputs.api_version != ''
        run: |
          set -euo pipefail
          WORK=/tmp/build-api
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/api "$WORK/shomer-api"
          cd "$WORK/shomer-api"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-api_*.deb "$WORK"/shomer-api_*.buildinfo "$WORK"/shomer-api_*.changes /tmp/

      - name: Build worker debian package
        if: steps.bump.outputs.worker_version != ''
        run: |
          set -euo pipefail
          WORK=/tmp/build-worker
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/worker "$WORK/shomer-worker"
          cd "$WORK/shomer-worker"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-worker_*.deb "$WORK"/shomer-worker_*.buildinfo "$WORK"/shomer-worker_*.changes /tmp/

      - name: Build cli debian package
        if: steps.bump.outputs.cli_version != ''
        run: |
          set -euo pipefail
          WORK=/tmp/build-cli
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/cli "$WORK/shomer-cli"
          cd "$WORK/shomer-cli"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-cli_*.deb "$WORK"/shomer-cli_*.buildinfo "$WORK"/shomer-cli_*.changes /tmp/

      - name: Build web debian package
        if: steps.bump.outputs.web_version != ''
        run: |
          set -euo pipefail
          WORK=/tmp/build-web
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp -r packages/web "$WORK/shomer-web"
          cd "$WORK/shomer-web"
          dpkg-buildpackage -us -uc -b
          mv "$WORK"/shomer-web_*.deb "$WORK"/shomer-web_*.buildinfo "$WORK"/shomer-web_*.changes /tmp/

      - name: Summarise built debian packages
        if: >-
          steps.bump.outputs.api_version != '' ||
          steps.bump.outputs.worker_version != '' ||
          steps.bump.outputs.cli_version != '' ||
          steps.bump.outputs.web_version != ''
        run: |
          {
            echo
            echo "### Built debian packages"
            echo
            echo "| package | filename |"
            echo "|---|---|"
            for f in /tmp/shomer-*.deb; do
              [ -f "$f" ] || continue
              echo "| $(dpkg-deb --field "$f" Package) | \`$(basename "$f")\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cut a GitHub Release per bumped component
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in
              *-v*.*.*) ;;
              *) continue ;;
            esac
            ASSETS=()
            case "$tag" in
              api-v*)    [ -f /tmp/shomer-api_*.deb    ] && ASSETS=(/tmp/shomer-api_*.deb) ;;
              worker-v*) [ -f /tmp/shomer-worker_*.deb ] && ASSETS=(/tmp/shomer-worker_*.deb) ;;
              cli-v*)    [ -f /tmp/shomer-cli_*.deb    ] && ASSETS=(/tmp/shomer-cli_*.deb) ;;
              web-v*)    [ -f /tmp/shomer-web_*.deb    ] && ASSETS=(/tmp/shomer-web_*.deb) ;;
            esac
            multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file - "${ASSETS[@]}"
          done

      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release
          body: |
            multicz plan → bump → tag → push, then docker/helm push to
            `ghcr.io` and one GitHub Release per tag with the .deb
            attached as an asset. Skipped when no commits since the
            last tag bump anything (plan empty).
