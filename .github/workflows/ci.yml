          body: 'kind + helm install api/job/ssr (fresh artifact when changed, ghcr `:latest` otherwise) + OWASP ZAP baseline on ssr (`zap-ssr-baseline`).'

  e2e-api:
    # Behave BDD smoke against a kind-deployed api. Runs in parallel
    # with owasp-api on the same upstream gate so a green security
    # scan and a green behavioural surface land together.
    needs:
