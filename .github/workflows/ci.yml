  web-container:
    needs: [web-bandit, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@v4
      - name: Build web image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: packages/web
          load: true
          tags: web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Save image tarball
        run: docker save web:ci -o /tmp/web.tar
      - uses: actions/upload-artifact@v7
        with: { name: web-image, path: /tmp/web.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: web-container
          body: 'Built `web:ci` (saved to artifact `web-image`).'

  web-sbom:
    needs: [web-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: web-image, path: /tmp }
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (SPDX JSON)
        run: syft docker-archive:/tmp/web.tar -o spdx-json=/tmp/web.sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: web-sbom, path: /tmp/web.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
