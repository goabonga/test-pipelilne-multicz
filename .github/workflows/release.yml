# Release pipeline: each multicz component (api / worker / cli + the
# matching helm subcharts) has its own tag stream and CHANGELOG.md.
# multicz writes pyproject.toml + CHANGELOG, regenerates uv.lock via
# the per-component `post_bump`, prepends a fresh stanza to each
# debian/changelog (via the `debian-changelog` writer), commits, tags,
# pushes. Then we cut one GitHub Release per new tag.
#
# Optional GPG signing: define repository secrets `GPG_PRIVATE_KEY`
# (ASCII-armored, e.g. `gpg --armor --export-secret-keys`) and
# `GPG_PASSPHRASE` to sign the release commit and every tag. When
# either secret is missing the workflow still runs, just unsigned.

name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write   # push the release commit and tags
  packages: write   # push docker image + helm chart to ghcr.io

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace (post_bump hooks need uv lock)
        run: uv sync --frozen --all-packages

      - uses: goabonga/multicz-action@v1

      - name: Configure git
        run: |
          NAME="${{ github.event.workflow_run.head_commit.author.name }}"
          EMAIL="${{ github.event.workflow_run.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        # Secrets can't be referenced from `if:` directly, so promote
        # their presence to a step output.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Pre-cache the passphrase so subsequent `git commit -S` /
          # `git tag -s` don't prompt.
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: Validate
        run: multicz validate --strict

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          multicz plan --summary "$GITHUB_STEP_SUMMARY" \
            --output json | tee /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag, push (signed)
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available == 'true'
        run: |
          multicz bump --commit --tag --push --sign \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available != 'true'
        run: |
          multicz bump --commit --tag --push \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json

      - name: Extract bumped versions
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          API=$(jq -r          '.bumps.api.next_version           // empty' /tmp/release.json)
          WORKER=$(jq -r       '.bumps.worker.next_version        // empty' /tmp/release.json)
          CLI=$(jq -r          '.bumps.cli.next_version           // empty' /tmp/release.json)
          CHART_API=$(jq -r    '.bumps["chart-api"].next_version    // empty' /tmp/release.json)
          CHART_WORKER=$(jq -r '.bumps["chart-worker"].next_version // empty' /tmp/release.json)
          echo "api_version=$API"                   >> "$GITHUB_OUTPUT"
          echo "worker_version=$WORKER"             >> "$GITHUB_OUTPUT"
          echo "cli_version=$CLI"                   >> "$GITHUB_OUTPUT"
          echo "chart_api_version=$CHART_API"       >> "$GITHUB_OUTPUT"
          echo "chart_worker_version=$CHART_WORKER" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase owner
        if: steps.plan.outputs.release == 'true'
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io (docker)
        if: steps.bump.outputs.api_version != '' || steps.bump.outputs.worker_version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: steps.bump.outputs.api_version != '' || steps.bump.outputs.worker_version != ''

      - name: Build and push api image
        id: push_api
        if: steps.bump.outputs.api_version != ''
        uses: docker/build-push-action@v7
        with:
          context: packages/api
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/shomer-api:${{ steps.bump.outputs.api_version }}
            ghcr.io/${{ steps.owner.outputs.value }}/shomer-api:latest
          cache-from: type=gha,scope=shomer-api
          cache-to: type=gha,mode=max,scope=shomer-api

      - name: Build and push worker image
        id: push_worker
        if: steps.bump.outputs.worker_version != ''
        uses: docker/build-push-action@v7
        with:
          context: packages/worker
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/shomer-worker:${{ steps.bump.outputs.worker_version }}
            ghcr.io/${{ steps.owner.outputs.value }}/shomer-worker:latest
          cache-from: type=gha,scope=shomer-worker
          cache-to: type=gha,mode=max,scope=shomer-worker

      - name: Summarise pushed images
        if: steps.push_api.outcome == 'success' || steps.push_worker.outcome == 'success'
        run: |
          {
            echo "## release"
            echo
            echo "### Pushed docker images"
            echo
            echo "| image | tag | digest |"
            echo "|---|---|---|"
            if [ -n "${{ steps.push_api.outputs.digest }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/shomer-api | \`${{ steps.bump.outputs.api_version }}\` + \`latest\` | \`${{ steps.push_api.outputs.digest }}\` |"
            fi
            if [ -n "${{ steps.push_worker.outputs.digest }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/shomer-worker | \`${{ steps.bump.outputs.worker_version }}\` + \`latest\` | \`${{ steps.push_worker.outputs.digest }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/setup-helm@v5
        if: steps.bump.outputs.chart_api_version != '' || steps.bump.outputs.chart_worker_version != ''

      - name: Helm registry login
        if: steps.bump.outputs.chart_api_version != '' || steps.bump.outputs.chart_worker_version != ''
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io \
            -u '${{ github.actor }}' --password-stdin

      - name: Package and push shomer-api subchart
        if: steps.bump.outputs.chart_api_version != ''
        run: |
          set -euo pipefail
          helm package packages/api/chart --destination /tmp
          helm push "/tmp/shomer-api-${{ steps.bump.outputs.chart_api_version }}.tgz" \
            "oci://ghcr.io/${{ steps.owner.outputs.value }}/charts" 2>&1 | tee /tmp/push-chart-api.out
          DIGEST=$(awk '/^Digest:/{print $2}' /tmp/push-chart-api.out)
          echo "PUSH_CHART_API_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Package and push shomer-worker subchart
        if: steps.bump.outputs.chart_worker_version != ''
        run: |
          set -euo pipefail
          helm package packages/worker/chart --destination /tmp
          helm push "/tmp/shomer-worker-${{ steps.bump.outputs.chart_worker_version }}.tgz" \
            "oci://ghcr.io/${{ steps.owner.outputs.value }}/charts" 2>&1 | tee /tmp/push-chart-worker.out
          DIGEST=$(awk '/^Digest:/{print $2}' /tmp/push-chart-worker.out)
          echo "PUSH_CHART_WORKER_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Summarise pushed charts
        if: steps.bump.outputs.chart_api_version != '' || steps.bump.outputs.chart_worker_version != ''
        run: |
          {
            echo
            echo "### Pushed helm charts"
            echo
            echo "| chart | version | digest |"
            echo "|---|---|---|"
            if [ -n "${PUSH_CHART_API_DIGEST:-}" ]; then
              echo "| shomer-api | \`${{ steps.bump.outputs.chart_api_version }}\` | \`${PUSH_CHART_API_DIGEST}\` |"
            fi
            if [ -n "${PUSH_CHART_WORKER_DIGEST:-}" ]; then
              echo "| shomer-worker | \`${{ steps.bump.outputs.chart_worker_version }}\` | \`${PUSH_CHART_WORKER_DIGEST}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cut a GitHub Release per bumped component
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in
              *-v*.*.*) ;;
              *) continue ;;
            esac
            multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file -
          done
