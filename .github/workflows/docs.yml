# Documentation publish pipeline.
#
# Triggers on any push to main that touches docs source or the
# aggregate VERSION file. The latter changes on every release (each
# component's bump_files entry rewrites its line in VERSION via a
# regex), so a release implicitly rebuilds the docs without us having
# to also watch every per-component pyproject.toml / Chart.yaml.
#
# Setup: one-time, in repo settings -> Pages, set "Source" to
# "GitHub Actions". No PAT required — `actions/deploy-pages@v4` uses
# the workflow's id-token for OIDC-style auth against Pages.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "VERSION"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; cancel any in-flight run when a fresh
# push lands so the latest version is what ends up live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install workspace + doc group
        run: uv sync --frozen --all-packages --group doc

      - name: Build site
        run: uv run zensical build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
