name: validate deb
description: |
  Install a freshly-built .deb on the runner and run three independent
  gates against it:

    1. lintian — packaging QA (errors fail the gate)
    2. pytest — install-validation suite under `tests/install/`
    3. systemd-analyze security — display score ≤ 1.0 ("OK :-)" zone),
       skipped when `has-systemd: "false"` (e.g. cli ships no unit).
       Note: `--threshold=N` is a *percentage* (0–100) on the internal
       exposure (= display_score / 10), so 10 means "fail if internal
       exposure > 10%", i.e. display score > 1.0.

  On any failure the upstream `<component>-deb` artifact is deleted so
  a broken build cannot be picked up downstream by humans inspecting
  the run or by any consumer that downloads CI artifacts.

  Caller MUST set `permissions: actions: write` on the job — the
  artifact-delete step uses the GITHUB_TOKEN with that scope.

inputs:
  component:
    required: true
    description: Component name — api / job / ssr / cli.
  has-systemd:
    required: false
    default: "true"
    description: |
      Set to "false" when the .deb ships no systemd unit (skips
      step 3). Components without a `debian/<pkg>.service` file
      (e.g. cli) must pass "false" here.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-deb
        path: /tmp

    - name: Install pytest, lintian + the .deb (system-wide)
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends python3-pytest lintian
        sudo apt-get install -y --no-install-recommends /tmp/shomer-${{ inputs.component }}_*.deb
        sudo systemctl daemon-reload

    - name: lintian — packaging QA (errors fail the gate)
      shell: bash
      run: lintian --fail-on error /tmp/shomer-${{ inputs.component }}_*.deb

    - name: pytest — install-validation suite
      shell: bash
      run: python3 -m pytest tests/install/test_${{ inputs.component }}.py -v

    - name: systemd-analyze security — display score ≤ 1.0 ("OK :-)")
      if: ${{ inputs.has-systemd == 'true' }}
      shell: bash
      run: systemd-analyze security --threshold=10 shomer-${{ inputs.component }}.service

    - name: Delete artifact on any validation failure
      if: failure()
      # No failOnError. v6 dropped it from its declared inputs, so passing it
      # now earns an "unexpected input" warning — and its default was already
      # this behaviour: a delete that finds nothing logs and carries on. The
      # step exists to stop a broken .deb reaching a later job, never to stack
      # a second failure on top of the real one.
      uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118  # v6
      with:
        name: ${{ inputs.component }}-deb
