name: fetch debian package artifact
description: |
  Download the `<component>-deb` CI artifact (a .deb produced upstream
  by the matching `*-deb` job) into `/tmp/` for the caller to attach
  to a GitHub Release.

  No rebuild — the `*-deb-validate` chain (lintian + pytest +
  systemd-analyze) already proved this .deb installs and behaves
  correctly. Re-running dpkg-buildpackage here would just burn ~1 min
  for an identical artifact.

inputs:
  component:
    required: true
    description: Component name — api / worker / web / cli.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-deb
        path: /tmp
