name: publish docker image
description: |
  Download the `<component>-image` CI artifact (a `docker save`
  tarball produced upstream by the matching `*-container` job),
  `docker load` it, retag to ghcr, and push the version + latest
  tags. Byte-identical to what `docker build` would produce now — the
  upstream container was built with `bump-preview` writing the same
  version that `release-bump` then committed.

  No rebuild: we trust the CI artifact. Faster (~3 min saved per
  image) and removes the divergence risk between "what got tested"
  and "what got published".

inputs:
  component:
    required: true
    description: Component name — api / worker / web.
  version:
    required: true
    description: Version to tag (also publishes `latest`).
  owner:
    required: true
    description: Lowercase ghcr namespace.
  repo:
    required: true
    description: Repo name — used as image-name prefix (`<repo>-<component>`).
  token:
    required: true
    description: Token with `packages:write` scope on ghcr.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-image
        path: /tmp

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: docker load + retag + push
      shell: bash
      run: |
        set -euo pipefail
        docker load -i /tmp/${{ inputs.component }}.tar
        TARGET="ghcr.io/${{ inputs.owner }}/${{ inputs.repo }}-${{ inputs.component }}"
        docker tag "${{ inputs.component }}:ci" "$TARGET:${{ inputs.version }}"
        docker tag "${{ inputs.component }}:ci" "$TARGET:latest"
        docker push "$TARGET:${{ inputs.version }}"
        docker push "$TARGET:latest"
