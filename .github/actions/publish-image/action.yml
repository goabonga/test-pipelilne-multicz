name: publish docker image
description: |
  Download the `<component>-image` CI artifact (a `docker save`
  tarball produced upstream by the matching `*-container` job),
  `docker load` it, retag to ghcr, and push the version + latest
  tags.

  Then sign the pushed image keylessly with cosign (GitHub OIDC
  via Sigstore Fulcio — no managed keys), and attach the syft SBOM
  (from the `<component>-sbom` artifact) as an SPDX attestation so
  consumers can verify provenance + ingredients.

inputs:
  component:
    required: true
    description: Component name — api / job / ssr.
  version:
    required: true
    description: Version to tag (also publishes `latest`).
  owner:
    required: true
    description: Lowercase ghcr namespace.
  repo:
    required: true
    description: Repo name — used as image-name prefix (`<repo>-<component>`).
  token:
    required: true
    description: Token with `packages:write` scope on ghcr.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-image
        path: /tmp

    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-sbom
        path: /tmp

    - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: docker load + retag + push
      id: push
      shell: bash
      run: |
        set -euo pipefail
        docker load -i /tmp/${{ inputs.component }}.tar
        TARGET="ghcr.io/${{ inputs.owner }}/${{ inputs.repo }}-${{ inputs.component }}"
        docker tag "${{ inputs.component }}:ci" "$TARGET:${{ inputs.version }}"
        docker tag "${{ inputs.component }}:ci" "$TARGET:latest"
        docker push "$TARGET:${{ inputs.version }}"
        docker push "$TARGET:latest"
        # Manifest digest for cosign — it operates on immutable
        # references (tag@digest), not floating tags.
        DIGEST=$(docker inspect "$TARGET:${{ inputs.version }}" --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - uses: sigstore/cosign-installer@v3.7.0

    - name: cosign sign (keyless via GitHub OIDC)
      shell: bash
      env:
        COSIGN_YES: "true"
      run: |
        cosign sign --yes "${{ steps.push.outputs.target }}@${{ steps.push.outputs.digest }}"

    - name: cosign attest (attach syft SBOM as SPDX predicate)
      shell: bash
      env:
        COSIGN_YES: "true"
      run: |
        cosign attest --yes \
          --predicate /tmp/${{ inputs.component }}.sbom.spdx.json \
          --type spdxjson \
          "${{ steps.push.outputs.target }}@${{ steps.push.outputs.digest }}"
