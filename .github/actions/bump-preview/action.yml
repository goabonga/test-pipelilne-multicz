name: bump preview
description: |
  Run `multicz bump` write-only so the workspace reflects the planned
  next version. Every bump_file (pyproject.toml, VERSION line, dunder
  __version__, Chart.yaml, debian/changelog stanza, ...) is updated
  in place. No commit / tag / push / post_bump hook / Markdown
  CHANGELOG write fires.

  Use this at the start of any test / audit / build job that should
  observe the post-bump version (so the produced artifact carries the
  version that release.yml will publish).

  REQUIRES the calling job to have already run `actions/checkout`
  with `fetch-depth: 0` — multicz needs the full tag history to
  compute the next version.
runs:
  using: composite
  steps:
    - uses: goabonga/multicz-action@v1
    - name: Bump (write only — no commit / tag / push / hooks / CHANGELOG)
      shell: bash
      run: multicz bump --no-post-bump --no-changelog
