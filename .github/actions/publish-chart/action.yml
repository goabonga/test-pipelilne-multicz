name: publish helm chart
description: |
  Download the `chart-<component>-tgz` CI artifact (a pre-packaged
  .tgz produced upstream by the matching `chart-<X>-package` job,
  with the bumped version baked in and the chart name already
  rewritten for this repo's namespace), then push it as an OCI
  artifact to `oci://ghcr.io/<owner>/charts`.

  No re-package — the CI job already built it with the correct
  version + name.

  Then sign the pushed chart keylessly with cosign, exactly as
  publish-image signs the container images: an OCI artifact is an OCI
  artifact, and a chart is as worth signing as the image it deploys.
  Requires `id-token: write` on the calling job.

inputs:
  component:
    required: true
    description: Component name — api / job / ssr.
  owner:
    required: true
    description: Lowercase ghcr namespace.
  token:
    required: true
    description: Token with `packages:write` scope on ghcr.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: chart-${{ inputs.component }}-tgz
        path: /tmp/chart

    - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5

    - name: registry login (helm and docker)
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "$TOKEN" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
        # cosign reads the docker keychain (~/.docker/config.json), which
        # `helm registry login` does not populate — it keeps its own
        # credential store. Without this the chart pushes fine and the
        # signature upload then dies with
        #   UNAUTHORIZED: unauthenticated ... /blobs/uploads/
        # publish-image never hit this because it pushes through docker.
        echo "$TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

    - name: helm push
      id: push
      shell: bash
      run: |
        set -euo pipefail
        # One .tgz expected per chart-<X>-tgz artifact.
        TGZ=$(ls /tmp/chart/*.tgz | head -1)
        # `helm push` prints the pushed digest on stderr; capture it rather
        # than re-deriving it, since cosign must operate on the immutable
        # digest and not on the version tag.
        helm push "$TGZ" "oci://ghcr.io/${{ inputs.owner }}/charts" 2>&1 | tee /tmp/helm-push.log
        DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/helm-push.log | head -1)
        CHART=$(basename "$TGZ" .tgz)
        # <name>-<semver>.tgz -> strip the trailing version to get the name.
        NAME=${CHART%-*}
        echo "target=ghcr.io/${{ inputs.owner }}/charts/${NAME}" >> "$GITHUB_OUTPUT"
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409  # v3.7.0

    - name: cosign sign (keyless via GitHub OIDC)
      shell: bash
      env:
        COSIGN_YES: "true"
      run: |
        set -euo pipefail
        cosign sign --yes "${{ steps.push.outputs.target }}@${{ steps.push.outputs.digest }}"

    - name: cosign verify
      # Signing without ever verifying is a gesture, not a control. This
      # reads the signature back through Fulcio's root and the Rekor log,
      # and pins BOTH the issuer and the workflow identity — so a signature
      # made by some other repository, or by a personal account, fails here
      # rather than in a consumer's cluster.
      shell: bash
      run: |
        set -euo pipefail
        cosign verify \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
          "${{ steps.push.outputs.target }}@${{ steps.push.outputs.digest }}" > /dev/null
        echo "signature verified for ${{ steps.push.outputs.target }}@${{ steps.push.outputs.digest }}"
