name: load image
description: |
  Ensure `/tmp/<component>.tar` exists, containing the
  `<component>:ci` docker image. Two paths:

  1. **Artifact**: this run's matching `*-container` job uploaded
     `<component>-image`. Download it, done.
  2. **Pull fallback**: no artifact (component didn't change this
     run). Pull `ghcr.io/<owner>/<repo>-<component>:latest`, retag
     to `<component>:ci`, save to `/tmp/<component>.tar`.

  Downstream `kind load image-archive /tmp/<component>.tar` works
  unchanged in both cases — so a partial-change run still gets the
  full system loaded into its kind cluster, with the unchanged
  components served from their last released image.

inputs:
  component:
    required: true
    description: Component name — api / job / ssr.
  token:
    required: true
    description: Token with `packages:read` on ghcr (for the pull fallback).

runs:
  using: composite
  steps:
    # Pre-check whether this run actually uploaded the artifact. The
    # `*-container` job is gated on detect.changed, so on a partial-
    # change PR (e.g. only ssr touched) the api/job artifacts simply
    # don't exist — calling actions/download-artifact in that case
    # emits a workflow-level error annotation that survives even
    # under continue-on-error. Asking the API first lets us skip the
    # download cleanly and let the next step pull from ghcr instead.
    #
    # Needs `actions: read` on the calling job's permissions block
    # to read the artifact index; the caller already passes a token
    # with packages:read for the ghcr pull, and the same grant covers
    # this call when RELEASE_PAT isn't set. If the probe itself fails
    # (auth missing, API hiccup), we fall through to ghcr — same
    # observable behaviour as before the probe was added.
    - id: probe
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if gh api \
             "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
             --jq '.artifacts[].name' 2>/dev/null \
             | grep -qx "${{ inputs.component }}-image"; then
          echo "[load-image] artifact ${{ inputs.component }}-image present"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "[load-image] artifact ${{ inputs.component }}-image absent; will pull from ghcr"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.probe.outputs.exists == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-image
        path: /tmp

    - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
      if: steps.probe.outputs.exists != 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Resolve ${{ inputs.component }} → /tmp/${{ inputs.component }}.tar
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f /tmp/${{ inputs.component }}.tar ]]; then
          echo "[load-image] using fresh artifact for ${{ inputs.component }}"
          exit 0
        fi
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        REPO="${{ github.event.repository.name }}"
        IMAGE="ghcr.io/${OWNER}/${REPO}-${{ inputs.component }}:latest"
        echo "[load-image] no fresh artifact, pulling $IMAGE"
        docker pull "$IMAGE"
        docker tag "$IMAGE" "${{ inputs.component }}:ci"
        docker save "${{ inputs.component }}:ci" -o /tmp/${{ inputs.component }}.tar
