name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

        For security-sensitive issues (auth, tokens, sessions), do NOT open
        a public issue — use the private advisory link instead.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which package(s) in the Shomer monorepo are affected?
      multiple: true
      options:
        - shomer-api
        - shomer-worker
        - shomer-web
        - shomer-web-frontend
        - shomer-cli
        - chart-api
        - chart-worker
        - chart-web
        - docs / website
        - release / CI tooling
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Component version
      description: "Output of `<component> --version`, the Docker image tag, the Helm chart version, or the `.deb` version."
      placeholder: "e.g. shomer-api 0.4.2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue? Include the exact command line, request, or config snippet.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python version
      options:
        - "3.11"
        - "3.12"
        - "3.13"
        - "N/A (chart / web-frontend / docs)"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment surface
      description: How is the component running?
      options:
        - "Python wheel / uv run"
        - "Docker image"
        - "Helm chart on Kubernetes"
        - "Debian .deb"
        - "Local development"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
