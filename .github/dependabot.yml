# Dependabot v2 configuration for the Shomer monorepo.
#
# The signed dependabot-rewrite workflow re-authors every Dependabot commit
# with a Conventional-Commits subject that reflects what the bump touches:
# runtime deps -> fix(deps), dev tooling -> chore(deps), GitHub Actions -> ci.
# The prefixes below match what the rewrite would emit, so PRs read sensibly
# even before the rewrite runs (e.g. on a fresh fork without GPG secrets).

# Re-scan trigger: manual refresh 2026-07-21

version: 2

updates:
  # Python deps via uv (root uv.lock spans every workspace member).
  - package-ecosystem: "uv"
    directory: "/"
    # Dependabot uv's FileUpdater can't reliably edit pyproject.toml
    # when the existing specifier is a permissive lower-bound like
    # `fastapi>=0.115`: `versioning-strategy: increase` ends up
    # tightening only the `requires-dist` mirror inside uv.lock and
    # leaves pyproject.toml untouched, which drifts the two files
    # until the next `uv lock` silently undoes the mirror change.
    #
    # `lockfile-only` is the honest setting given that limitation:
    # Dependabot only updates the resolved version in uv.lock and
    # never touches the mirror, so no drift is introduced. The
    # signed dependabot-rewrite workflow then picks the bump up,
    # rewrites the matching `packages/<pkg>/pyproject.toml` spec
    # to `>=<new_version>`, and re-runs `uv lock` so the lockfile
    # mirror lines up — landing pyproject + lock as one consistent
    # commit that multicz's detect step can actually see.
    versioning-strategy: lockfile-only
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    ignore:
      # `hatchling` lives in [build-system].requires; Dependabot's uv
      # FileUpdater cannot write that table. Bump it by hand; pip-audit and
      # osv-scanner still flag any CVEs.
      - dependency-name: "hatchling"
    groups:
      # Bundle routine dev-tooling bumps into a single weekly PR. The
      # signed-rewrite script keys "dev-tools group" -> chore(deps).
      dev-tools:
        applies-to: version-updates
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pre-commit"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
      - "dependabot"
      - "python"

  # Root npm workspace (lib + web). The single root package-lock.json
  # spans both members. React/react-dom are runtime (-> fix(deps)); the
  # rest are build/test tooling grouped into one chore(deps) PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      web-dev-tools:
        applies-to: version-updates
        patterns:
          - "@biomejs/*"
          - "@testing-library/*"
          - "@types/*"
          - "esbuild"
          - "jsdom"
          - "typescript"
          - "vitest"
    commit-message:
      # No `include: scope` — the prefix already carries the scope, so
      # adding it would double it into `chore(deps)(deps-dev):` (invalid
      # Conventional Commit). Runtime bumps -> fix(deps), dev tooling ->
      # chore(deps), matching the rewritten commit subjects.
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
      - "dependabot"
      - "web"

  # React Native app — its own standalone lockfile (not a workspace
  # member). Mostly RN/build tooling -> chore(deps).
  - package-ecosystem: "npm"
    directory: "/packages/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      app-dev-tools:
        applies-to: version-updates
        patterns:
          - "@babel/*"
          - "@biomejs/*"
          - "@react-native*/*"
          - "@types/*"
          - "jest"
          - "react-test-renderer"
          - "typescript"
    ignore:
      # RN 0.86 pins its toolchain to Babel 7 (@react-native/babel-preset)
      # and Jest 29 (@react-native/jest-preset bundles jest-environment-node
      # 29). The major bumps break `npm test` (Babel 8 fails assertVersion;
      # Jest 30 runtime calls clearMocksOnScope on the preset's Jest-29 mock).
      # Bump these only together with a React Native upgrade.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
    commit-message:
      # No `include: scope` — the prefix already carries the scope, so
      # adding it would double it into `chore(deps)(deps-dev):` (invalid
      # Conventional Commit). Runtime bumps -> fix(deps), dev tooling ->
      # chore(deps), matching the rewritten commit subjects.
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
      - "dependabot"
      - "app"

  # Android native (Gradle) deps of the app.
  - package-ecosystem: "gradle"
    directory: "/packages/app/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "fix(deps)"
    ignore:
      # The Gradle wrapper version is pinned by the React Native release
      # (RN 0.86 -> Gradle 9.3.1); a newer Gradle ships a Kotlin stdlib
      # the RN gradle plugin can't read (metadata 2.3 vs compiler 2.1).
      # Bump it together with a RN upgrade, never on its own.
      - dependency-name: "gradle"
    labels:
      - "dependencies"
      - "dependabot"
      - "app"
      - "android"

  # iOS tooling: RN drives CocoaPods through a Gemfile. Dependabot no
  # longer supports the CocoaPods ecosystem directly, so we track the
  # Ruby Gemfile (the `cocoapods` gem) via bundler instead.
  - package-ecosystem: "bundler"
    directory: "/packages/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
      - "dependabot"
      - "app"
      - "ios"

  # Container base images for the three runtime services. Base-image bumps
  # ship in production, so the rewrite classifies them as fix(deps).
  - package-ecosystem: "docker"
    directory: "/packages/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
      - "dependabot"
      - "docker"
      - "api"

  - package-ecosystem: "docker"
    directory: "/packages/job"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
      - "dependabot"
      - "docker"
      - "job"

  - package-ecosystem: "docker"
    directory: "/packages/ssr"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
      - "dependabot"
      - "docker"
      - "ssr"

  # Pinned versions of GitHub Actions in `.github/workflows/*.yml` and
  # `.github/actions/*/action.yml`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
          - "astral-sh/*"
          - "azure/*"
          - "bridgecrewio/*"
          - "codecov/*"
          - "compilerla/*"
          - "docker/*"
          - "geekyeggo/*"
          - "getplumber/*"
          - "goabonga/*"
          - "google/*"
          - "hadolint/*"
          - "peter-evans/*"
          - "pre-commit/*"
          - "pypa/*"
          - "softprops/*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "dependabot"
      - "github-actions"
