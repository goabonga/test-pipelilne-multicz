[project]
name = "shomer-web"
version = "0.0.0"
description = "Shomer authorization web frontend (login pages, account UI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
shomer-web = "shomer_web.app:run"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shomer_web"]

[tool.hatch.build.targets.wheel.force-include]
"src/shomer_web/templates" = "shomer_web/templates"
