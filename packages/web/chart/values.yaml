image:
  repository: ghcr.io/goabonga/shomer-web
  tag: ""              # falls back to .Chart.AppVersion
  pullPolicy: Always   # CI kind smoke overrides to IfNotPresent via --set

replicaCount: 2

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
