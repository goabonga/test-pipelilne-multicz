image:
  repository: ghcr.io/goabonga/shomer-api
  tag: ""              # falls back to .Chart.AppVersion
  pullPolicy: Always   # CI kind smoke overrides to IfNotPresent via --set

replicaCount: 2

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
