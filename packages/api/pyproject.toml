[project]
name = "shomer-api"
version = "0.2.5"
description = "Shomer authorization HTTP API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
shomer-api = "shomer_api.app:run"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shomer_api"]
