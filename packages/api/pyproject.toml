[project]
name = "shomer-api"
version = "0.1.1"
description = "Shomer authorization HTTP API."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["shomer", "authorization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.48.0",
]

[project.urls]
Homepage = "https://github.com/goabonga/test-pipelilne-multicz"
Source = "https://github.com/goabonga/test-pipelilne-multicz"
Issues = "https://github.com/goabonga/test-pipelilne-multicz/issues"

[project.scripts]
shomer-api = "shomer_api.app:run"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shomer_api"]

# Part of the 2026-07 synchronized release baseline.
