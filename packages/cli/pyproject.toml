[project]
name = "shomer-cli"
version = "0.0.0"
description = "Shomer admin CLI."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["shomer", "authorization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.26.7",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/goabonga/test-pipelilne-multicz"
Source = "https://github.com/goabonga/test-pipelilne-multicz"
Issues = "https://github.com/goabonga/test-pipelilne-multicz/issues"

[project.scripts]
shomer = "shomer_cli.main:app"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shomer_cli"]

# Part of the 2026-07 synchronized release baseline.
