[project]
name = "shomer-cli"
version = "0.1.2"
description = "Shomer admin CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.26.7",
    "httpx>=0.27",
]

[project.scripts]
shomer = "shomer_cli.main:app"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shomer_cli"]

# Part of the 2026-07 synchronized release baseline.
