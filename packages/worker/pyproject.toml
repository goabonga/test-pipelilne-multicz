[project]
name = "shomer-worker"
version = "0.0.0"
description = "Shomer background worker (token cleanup, audit replication)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shomer-worker = "shomer_worker.main:run"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shomer_worker"]
