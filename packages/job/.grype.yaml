# Per-component grype allowlist (auto-discovered when grype runs with this
# directory as CWD — see the `working-directory: packages/job` on the
# job-grype step in .github/workflows/ci.yml).
#
# Every entry MUST be preceded by a `# expires: YYYY-MM-DD` marker comment
# AND pin `package.name` + `package.version`, so:
#
#   1. The marker is the single source of truth read by the weekly
#      grype-allowlist-sweep workflow (scripts/grype-allowlist-sweep.py).
#      Don't bury the date in prose — the script greps `# expires:`.
#   2. The version pin auto-resolves the ignore the moment Chainguard
#      ships a patched apk: version mismatch -> no match -> CVE surfaces
#      again under --fail-on high.

ignore:
  # CVE-2026-7210 (Critical) — upstream Chainguard python-3.14 in
  # cgr.dev/chainguard/python:latest. Chainguard re-built the apk
  # (3.14.5-r1 -> -r2 on 2026-05-27) but the CVE is still present in
  # the grype DB, so the original version-pin expired on intent (good)
  # but the underlying issue isn't resolved — bump the pin to -r2 and
  # extend the expiry by a week. If Chainguard ships -r3 without a
  # fix, the version mismatch will trip again and we re-evaluate.
  # expires: 2026-06-09
  - vulnerability: CVE-2026-7210
    reason: "Upstream Chainguard python:latest apk; awaiting patched base image."
    package:
      name: python-3.14
      version: 3.14.5-r2
      type: apk
