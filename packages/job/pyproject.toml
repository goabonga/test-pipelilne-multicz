[project]
name = "shomer-job"
version = "0.0.0"
description = "Shomer background job (token cleanup, audit replication)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shomer-job = "shomer_job.main:run"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shomer_job"]
