[project]
name = "shomer-job"
version = "1.2.1"
description = "Shomer background job (token cleanup, audit replication)."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["shomer", "authorization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

# Celery worker with a Redis broker + result backend. The `redis` extra
# pulls the Python redis client; the Debian package declares the system
# python3-celery / python3-redis / redis-server equivalents.
dependencies = ["celery[redis]>=5.3"]

[project.urls]
Homepage = "https://github.com/goabonga/test-pipelilne-multicz"
Source = "https://github.com/goabonga/test-pipelilne-multicz"
Issues = "https://github.com/goabonga/test-pipelilne-multicz/issues"

[project.scripts]
shomer-job = "shomer_job.main:run"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shomer_job"]

# Part of the 2026-07 synchronized release baseline.
