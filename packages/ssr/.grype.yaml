# Per-component grype allowlist (auto-discovered when grype runs with this
# directory as CWD — see the `working-directory: packages/ssr` on the
# ssr-grype step in .github/workflows/ci.yml).
#
# Every entry MUST be preceded by a `# expires: YYYY-MM-DD` marker comment
# AND pin `package.name` + `package.version`, so:
#
#   1. The marker is the single source of truth read by the weekly
#      grype-allowlist-sweep workflow (scripts/grype-allowlist-sweep.py).
#      Don't bury the date in prose — the script greps `# expires:`.
#   2. The version pin auto-resolves the ignore the moment Chainguard
#      ships a patched apk: version mismatch -> no match -> CVE surfaces
#      again under --fail-on high.

ignore:

  # CVE-2026-15308 (High) — newly surfaced on the same pinned python-3.14
  # apk; grype reports no "fixed in", so there is no patched build to bump
  # to. Third High CVE on this base in as many weeks: the recurring churn
  # here is what the grype-allowlist-sweep automation is meant to absorb.
  # expires: 2026-08-03
  - vulnerability: CVE-2026-15308
    reason: "Upstream Chainguard python-3.14 apk on the pinned base; no patched build yet."
    package:
      name: python-3.14
      version: 3.14.6-r3
      type: apk
