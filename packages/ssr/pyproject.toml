[project]
name = "shomer-ssr"
version = "1.0.1"
description = "Shomer authorization ssr frontend (login pages, account UI)."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["shomer", "authorization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.141.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.48.0",
]

[project.urls]
Homepage = "https://github.com/goabonga/test-pipelilne-multicz"
Source = "https://github.com/goabonga/test-pipelilne-multicz"
Issues = "https://github.com/goabonga/test-pipelilne-multicz/issues"

[project.scripts]
shomer-ssr = "shomer_ssr.app:run"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = [...]` recursively includes every file under the
# directory (including non-.py assets like templates/*.html and
# static/*.{js,css}), so no separate force-include block is needed.
# Re-declaring them in force-include made pybuild's installer module
# trip on the duplicate when building the .deb.
packages = ["src/shomer_ssr"]

# Part of the 2026-07 synchronized release baseline.
