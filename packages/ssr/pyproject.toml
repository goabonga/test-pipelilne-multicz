[project]
name = "shomer-ssr"
version = "0.0.0"
description = "Shomer authorization ssr frontend (login pages, account UI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
shomer-ssr = "shomer_ssr.app:run"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = [...]` recursively includes every file under the
# directory (including non-.py assets like templates/*.html and
# static/*.{js,css}), so no separate force-include block is needed.
# Re-declaring them in force-include made pybuild's installer module
# trip on the duplicate when building the .deb.
packages = ["src/shomer_ssr"]
