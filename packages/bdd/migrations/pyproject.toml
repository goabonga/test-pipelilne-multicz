[project]
name = "shomer-migrations"
version = "0.2.0"
description = "Shomer database migrations (Alembic). Ships the revisions + runner; depends on shomer-database for the model metadata. Only the migration image installs this."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["shomer", "authorization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

dependencies = [
    "shomer-database",
    "alembic>=1.13",
]

# Driver extras forward to shomer-database so the migration image can connect.
[project.optional-dependencies]
postgres = ["shomer-database[postgres]"]
mysql = ["shomer-database[mysql]"]
mssql = ["shomer-database[mssql]"]

[project.urls]
Homepage = "https://github.com/goabonga/test-pipelilne-multicz"
Source = "https://github.com/goabonga/test-pipelilne-multicz"
Issues = "https://github.com/goabonga/test-pipelilne-multicz/issues"

[project.scripts]
# Migration runner used by the chart-migrations Job: `alembic upgrade head`.
shomer-migrate = "shomer_migrations.migrate:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The revision tree (migrations/env.py, *.mako, versions/*) ships in this
# wheel so `shomer-migrate` runs from the installed package in the image.
packages = ["src/shomer_migrations"]

# Part of the 2026-07 synchronized release baseline.
