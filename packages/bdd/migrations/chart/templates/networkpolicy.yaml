apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  policyTypes:
    - Ingress
    - Egress
  # Permissive baseline — satisfies checkov's "pod has a NetworkPolicy"
  # rule (CKV2_K8S_6), like the other charts. Production deployments
  # should override this to allow only the migration → database egress.
  ingress:
    - {}
  egress:
    - {}
