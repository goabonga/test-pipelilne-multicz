# Standalone migration Job: `alembic upgrade head` (applies pending revisions
# only — never recreates). The name carries the appVersion so a new shomer-bdd
# version produces a new Job (Jobs are immutable); GitOps runs it on a lower
# sync-wave so it completes before the app rolls. ttl cleans finished Jobs.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Chart.AppVersion }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.migration.syncWave | quote }}
    argocd.argoproj.io/hook: Sync
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          {{- if .Values.database.existingSecret }}
          env:
            - name: SHOMER_BDD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
          {{- else if .Values.database.env }}
          env:
            {{- range $k, $v := .Values.database.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.migration.resources | nindent 12 }}
