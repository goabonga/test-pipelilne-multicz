# Alembic configuration for shomer-bdd.
#
# Run migrations from this directory (packages/bdd):
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head
#
# The database URL is NOT stored here: env.py reads it from SHOMER_BDD_* env
# vars (see shomer_bdd.config.DatabaseSettings.from_env). You can still override
# it with `alembic -x url=...` or by setting sqlalchemy.url below.

[alembic]
script_location = src/shomer_migrations/migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url =   ; left blank on purpose — resolved in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
