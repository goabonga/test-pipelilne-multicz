# Per-component grype allowlist for the migration image (auto-discovered when
# grype runs with this directory as CWD — see `working-directory:
# packages/bdd/migrations` on the migrations-grype step in ci.yml). Same
# Chainguard base as api / job / ssr, so the same base-image apk CVEs apply.
#
# Every entry pins package.name + package.version and carries a `# expires:`
# marker (read by the weekly grype-allowlist-sweep workflow). The version pin
# auto-resolves each ignore the moment the base image ships a patched apk.

ignore:

  # CVE-2026-15308 (High) — Chainguard python-3.14 apk on the pinned base;
  # no upstream fix yet.
  # expires: 2026-08-03
  - vulnerability: CVE-2026-15308
    reason: "Upstream Chainguard python-3.14 apk on the pinned base; no patched build yet."
    package:
      name: python-3.14
      version: 3.14.6-r3
      type: apk
