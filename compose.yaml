# Local dev environment for the Shomer monorepo.
#
# Five workspace members run side-by-side with bind-mounted sources:
#
#   web   esbuild --watch loop. Writes the bundles into the host's
#         packages/ssr/src/shomer_ssr/{static,templates}/ via a shared
#         bind mount so the ssr container picks them up on the next
#         HTTP request without restarting.
#
#   ssr   uvicorn --reload — restarts the Python process on any
#         packages/ssr/src/**/*.py change, serves the regenerated
#         assets/templates on the way back up.
#
#   api   same shape as ssr, on port 8000.
#
#   job   long-running Celery worker (Redis broker + result backend),
#         no native --reload. Wrapped in `watchfiles` (the same
#         rust-backed watcher uvicorn uses under the hood) so the
#         worker restarts on any packages/job/src/**/*.py edit, working
#         off the bind mount. Waits for the `redis` healthcheck.
#
#   cli   long-lived `sleep infinity` container that lets a Windows /
#         macOS dev run `docker compose exec cli shomer …` (or
#         `compose run --rm cli shomer …`) inside a Linux env without
#         shipping the full uv toolchain to the host.
#
# Plus the database tier:
#
#   postgres  PostgreSQL 17 with a named volume for persistence and a
#             pg_isready healthcheck.
#
#   redis     Redis 7 — Celery broker + result backend for `job`, with
#             a redis-cli ping healthcheck.
#
#   migrate   one-shot `alembic upgrade head` (the shomer-migrations
#             image). Runs once postgres is healthy; `api` waits for it
#             to complete successfully before starting.
#
# Bring it up:                docker compose up --build --watch
# CLI one-off in container:   docker compose run --rm cli shomer health http://api:8000
# Tear it down:               docker compose down -v
#
# Required env: copy .env.example → .env (gitignored) and adjust
# USER_UID / USER_GID to match `id -u` / `id -g` on Linux so the bind
# mounts don't end up root-owned. Defaults to 1000:1000 if .env is
# absent, which works for the most common Linux setup.

name: shomer-dev

services:
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dev
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    volumes:
      # Sources read by esbuild + the template copier (workspace layout)
      - ./packages/web/src:/app/packages/web/src
      - ./packages/web/scripts:/app/packages/web/scripts
      - ./packages/web/tsconfig.json:/app/packages/web/tsconfig.json:ro
      - ./packages/web/biome.json:/app/packages/web/biome.json:ro
      # Shared @shomer/lib source — bundled into the web output, so live
      # edits here must reach the watch build too.
      - ./packages/lib/src:/app/packages/lib/src
      # Build output target — shared with the ssr container
      - ./packages/ssr/src/shomer_ssr/static:/output/static
      - ./packages/ssr/src/shomer_ssr/templates:/output/templates
    command: ["node", "packages/web/scripts/build.mjs", "--watch"]
    # Source changes are handled by esbuild --watch inside the
    # container (the bind mount above shows them instantly). The
    # `rebuild` action below catches dep changes: a manifest or the root
    # lockfile edit invalidates `npm ci`'s cache, so the only correct
    # response is rebuilding the image.
    develop:
      watch:
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./packages/web/package.json
        - action: rebuild
          path: ./packages/lib/package.json

  ssr:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    volumes:
      # Only mount what changes; everything else is in the image.
      - ./packages/ssr/src:/workspace/packages/ssr/src
    ports:
      - "${SSR_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    command:
      - uv
      - run
      - --package
      - shomer-ssr
      - uvicorn
      - shomer_ssr.app:app
      - --reload
      - --reload-dir
      - /workspace/packages/ssr/src
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    depends_on:
      web:
        # No healthcheck on web — it's "ready" the moment esbuild has
        # finished its first build, which uvicorn doesn't need anyway
        # because the static files only matter at request time.
        condition: service_started
    # Bind mount + uvicorn --reload handles every src edit. Only
    # rebuild when the dep closure shifts.
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./packages/ssr/pyproject.toml

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shomer
      POSTGRES_PASSWORD: shomer
      POSTGRES_DB: shomer
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shomer -d shomer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Celery broker + result backend for the `job` worker. A redis-cli
  # ping healthcheck gates `job` so the worker never starts against a
  # broker that isn't accepting connections yet.
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner: `alembic upgrade head` against postgres. Built
  # from the real migration image (shomer-migrations + psycopg). api waits for
  # this to complete successfully before it starts.
  migrate:
    build:
      context: packages/bdd
      dockerfile: migrations/Dockerfile
    environment:
      SHOMER_BDD_URL: postgresql+psycopg://shomer:shomer@postgres:5432/shomer
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    volumes:
      - ./packages/api/src:/workspace/packages/api/src
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SHOMER_BDD_URL: postgresql+psycopg://shomer:shomer@postgres:5432/shomer
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - uv
      - run
      - --package
      - shomer-api
      - uvicorn
      - shomer_api.app:app
      - --reload
      - --reload-dir
      - /workspace/packages/api/src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./packages/api/pyproject.toml

  job:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    volumes:
      - ./packages/job/src:/workspace/packages/job/src
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # `watchfiles` (rust-backed, the same watcher uvicorn ships with
    # --reload) re-execs the command whenever a .py file under the
    # bind-mounted src dir changes. `--filter python` skips noise from
    # editor swap files, pycache, etc.
    command:
      - watchfiles
      - --filter
      - python
      - shomer-job
      - /workspace/packages/job/src
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./packages/job/pyproject.toml

  cli:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    volumes:
      - ./packages/cli/src:/workspace/packages/cli/src
    env_file:
      - path: .env
        required: false
    # Keep the container warm so `docker compose exec cli shomer …`
    # works without rebooting the venv between commands. `tini` would
    # be cleaner than sleep for signal handling, but sleep is in the
    # base image and we're not piping signals here.
    command: [sleep, infinity]
    # Stop signal is sent to PID 1; sleep ignores SIGTERM, so request
    # SIGINT (which sleep handles) to avoid a 10s timeout on `down`.
    stop_signal: SIGINT

volumes:
  postgres-data:
