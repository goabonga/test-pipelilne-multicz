[theme]
name    = "material"
logo    = "shomer.svg"
favicon = "favicon.ico"

[theme.palette]
scheme  = "default"
primary = "deep purple"
accent  = "amber"

[nav]
"Home"             = "index.md"
"Contributing"     = "contributing.md"
"Security"         = "security.md"
"Code of Conduct"  = "code_of_conduct.md"
