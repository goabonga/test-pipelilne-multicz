[project]
site_name        = "Shomer"
site_description = "OAuth2/OIDC authorization server with multi-tenant support, MFA and federation."
site_author      = "Chris <goabonga@pm.me>"
site_url         = "https://goabonga.github.io/shomer/"

repo_url   = "https://github.com/goabonga/shomer"
repo_name  = "goabonga/shomer"
edit_uri   = "edit/main/docs/"

copyright = """
Shomer &middot; Copyright &copy; 2026 Chris &middot;
<a href="https://github.com/goabonga/shomer/blob/main/LICENSE">MIT License</a>
"""

# Organised by who is reading rather than by what the repository contains.
# The four audiences ask different questions of the same system, and a
# single page answering all of them answers none of them first.
nav = [
  { "Home" = "index.md" },
  { "Users" = "users/index.md" },
  { "Developers" = "developers/index.md" },
  { "DevOps" = [
    { "Overview" = "devops/index.md" },
    { "Teardown" = "devops/teardown.md" },
  ] },
  { "DevSecOps" = [
    { "Overview" = "devsecops/index.md" },
    { "Creating an exception" = "devsecops/exceptions.md" },
  ] },
  { "Changelog" = "changelog.md" },
  { "Versions" = "versions.md" },
]

# Zensical falls back to its default extension set only when this table is
# absent — `config.get("markdown_extensions", DEFAULT_...)` is a fallback,
# not a merge. Declaring one extension therefore silently dropped every
# default, superfences among them, and fenced code blocks came out as
# inline code. The defaults are restated here so `macros` can be added to
# them; keep them in step with Zensical's own DEFAULT_MARKDOWN_EXTENSIONS.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
"pymdownx.betterem" = {}
"pymdownx.caret" = {}
"pymdownx.details" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.tilde" = {}
"zensical.extensions.macros" = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

# Per-component versions surfaced on docs/versions.md through the
# `macros` extension ({{ config.extra.versions.* }}). multicz rewrites
# each value on bump: every component lists the matching key in its
# `bump_files` (see multicz.toml), and the `docs` component `depends_on`
# them all so this page is regenerated whenever any version changes.
#
# NOTE: keys use underscores (chart_api, not chart-api) — a dash reads
# as subtraction inside the Jinja `{{ ... }}` macro expression.
[project.extra.versions]
api       = "0.1.1"
job       = "1.0.2"
cli       = "0.1.0"
database  = "0.1.1"
migrations = "0.1.1"
ssr       = "1.0.1"
web       = "1.0.1"
lib       = "0.1.0"
app       = "0.1.1"
chart_api = "1.1.0"
chart_job = "1.0.2"
chart_ssr = "1.0.1"
chart_migrations = "0.1.1"
docs      = "1.0.34"
# Infrastructure. `configs_*` are DEPLOYED versions — what is actually live
# in that environment — not library versions like everything above.
infra     = "0.15.0"
infra_modules_example = "0.2.0"
infra_modules_vms_proxy_aws = "0.2.0"
infra_modules_vms_proxy_gcp = "0.2.0"
infra_modules_k8s_nodes_aws = "0.2.0"
infra_modules_k8s_nodes_gcp = "0.2.0"
infra_modules_k8s_cluster_aws = "0.2.0"
infra_modules_k8s_cluster_gcp = "0.2.0"
infra_modules_dns_public_aws = "0.2.0"
infra_modules_dns_public_gcp = "0.2.0"
infra_modules_dns_private_aws = "0.2.0"
infra_modules_dns_private_gcp = "0.2.0"
infra_modules_network_nat_aws = "0.2.0"
infra_modules_network_nat_gcp = "0.2.0"
infra_modules_network_routes_aws = "0.2.0"
infra_modules_network_routes_gcp = "0.2.0"
infra_modules_network_firewall_aws = "0.2.0"
infra_modules_network_firewall_gcp = "0.2.0"
infra_modules_network_addresses_public_aws = "0.2.0"
infra_modules_network_addresses_public_gcp = "0.2.0"
infra_modules_network_addresses_private_aws = "0.2.0"
infra_modules_network_addresses_private_gcp = "0.2.0"
infra_modules_network_subnets_aws = "0.3.0"
infra_modules_network_subnets_gcp = "0.2.0"
infra_modules_network_vpc_aws = "0.3.0"
infra_modules_network_vpc_gcp = "0.2.0"
infra_bootstrap_aws   = "0.2.0"
infra_bootstrap_gcp   = "0.2.0"
configs_staging       = "0.0.0"
configs_production    = "0.0.0"
gitops                = "0.1.0"
gitops_staging        = "0.1.4"
gitops_production     = "0.0.0"
[project.theme]
variant  = "classic"
logo     = "shomer.svg"
favicon  = "favicon.ico"
language = "en"

[[project.theme.palette]]
scheme  = "default"
primary = "deep purple"
accent  = "amber"

