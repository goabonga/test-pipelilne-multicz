# multicz config: shomer monorepo (api / job / cli + 2 helm charts).
#
# Five components:
#
#   api / job  — Python + Docker + Helm chart + Debian package.
#                   bump_files is the source of truth (pyproject.toml);
#                   a debian-changelog writer prepends a stanza on every
#                   bump; a mirror writes the new version into the
#                   matching chart's appVersion (cascading a patch onto
#                   chart-api / chart-job).
#
#   cli           — Python wheel only (PyPI).
#
#   chart-api / chart-job — Helm charts. Bump on their own template
#                   changes AND when their parent component (api / job)
#                   ships a new image via the appVersion mirror cascade.

[project]
commit_convention = "conventional"
tag_format        = "{component}-v{version}"
initial_version   = "0.0.0"
post_bump_policy  = "allow"   # opt in: enables the `uv lock` hook below
# Aggregated cross-component CHANGELOG.md at the repo root. Per-component
# files (packages/<comp>/CHANGELOG.md) still get written; this one adds
# the bird's-eye view so a release commit lists every component that
# bumped + a type-grouped digest of the driving commits in one place.
root_changelog    = "CHANGELOG.md"
# `skip-checks: true` so GitHub creates no workflow run at all for a release
# commit. GitHub honours two forms: an `[skip ci]`-style marker, which has to
# sit on the FIRST line, and this trailer, which sits in the footer after a
# blank line. The trailer is the better one here — the subject is what shows
# in `git log --oneline`, in the changelogs and in the release notes, and
# tooling noise does not belong there permanently.
#
# Nothing useful ran on those commits anyway: release-bump already refuses a
# `chore(release):` head commit, and every component is freshly tagged so the
# per-component jobs all skip. What was left was a full graph of skipped jobs
# cluttering the run list.
#
# It skips EVERY workflow. infra-plan is unaffected: it triggers on
# `workflow_run` when ci completes, not on the push itself.
#
# WHY `[skip ci]` AND NOT THE `skip-checks: true` TRAILER
#
# The trailer was tried first, to keep the marker out of the subject line.
# It cannot work here. GitHub requires two empty lines before it, and
# `git commit` with its default cleanup collapses consecutive empty lines —
# measured: `\n\n\n` goes in, `\n\n` is stored. Only
# `--cleanup=verbatim` preserves it, and multicz does not use it. The
# trailer was therefore silently ignored on every release commit.
#
# The cost was not one extra run. One push produces four release commits —
# release-bump, promote-staging, and their cascades — each starting a ci
# run, and each ci completion fires infra-plan through `workflow_run`. Five
# infra-plan runs, three of them planning a main the next push had already
# replaced.
#
# `[skip ci]` is matched anywhere in the message, so it survives the
# cleanup and still stays off the subject line.
release_commit_message = "chore(release): bump {summary}\n\n{body}\n\n[skip ci]"

[components.api]
paths      = [
    "packages/api/src/**",
    "packages/api/pyproject.toml",
    "packages/api/Dockerfile",
    "packages/api/debian/**",
]
bump_files = [
    { file = "packages/api/pyproject.toml", key = "project.version" },
    { file = "packages/api/src/shomer_api/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^api=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.api" },
]
mirrors    = [
    { file = "packages/api/chart/Chart.yaml", key = "appVersion" },
]
changelog  = "packages/api/CHANGELOG.md"
# api consumes the shomer-database library — a database bump cascades a
# patch here so a fresh image ships with the updated models/connector.
depends_on = ["database"]
post_bump  = ["uv lock"]

[[components.api.writers]]
type            = "debian-changelog"
file            = "packages/api/debian/changelog"
package         = "shomer-api"
distribution    = "unstable"
maintainer      = "Chris <goabonga@pm.me>"
debian_revision = 1

[[components.api.artifacts]]
type = "docker"
ref  = "ghcr.io/goabonga/shomer-api:{version}"

[[components.api.artifacts]]
type = "debian"
ref  = "shomer-api_{version}-1_all.deb"

[components.job]
paths      = [
    "packages/job/src/**",
    "packages/job/pyproject.toml",
    "packages/job/Dockerfile",
    "packages/job/debian/**",
]
bump_files = [
    { file = "packages/job/pyproject.toml", key = "project.version" },
    { file = "packages/job/src/shomer_job/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^job=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.job" },
]
mirrors    = [
    { file = "packages/job/chart/Chart.yaml", key = "appVersion" },
]
changelog  = "packages/job/CHANGELOG.md"
# job consumes the shomer-database library — a database bump cascades a
# patch here so a fresh image ships with the updated models/connector.
depends_on = ["database"]
post_bump  = ["uv lock"]

[[components.job.writers]]
type            = "debian-changelog"
file            = "packages/job/debian/changelog"
package         = "shomer-job"
distribution    = "unstable"
maintainer      = "Chris <goabonga@pm.me>"
debian_revision = 1

[[components.job.artifacts]]
type = "docker"
ref  = "ghcr.io/goabonga/shomer-job:{version}"

[[components.job.artifacts]]
type = "debian"
ref  = "shomer-job_{version}-1_all.deb"

[components.ssr]
# `static/**` and `templates/**` are NOT in paths — they're build
# outputs of `web`. Cascade flows in via `depends_on` below.
paths      = [
    "packages/ssr/src/shomer_ssr/*.py",
    "packages/ssr/pyproject.toml",
    "packages/ssr/Dockerfile",
    "packages/ssr/debian/**",
]
bump_files = [
    { file = "packages/ssr/pyproject.toml", key = "project.version" },
    { file = "packages/ssr/src/shomer_ssr/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^ssr=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.ssr" },
]
mirrors    = [
    { file = "packages/ssr/chart/Chart.yaml", key = "appVersion" },
]
changelog  = "packages/ssr/CHANGELOG.md"
# Bumping web (TS/CSS/templates) auto-bumps ssr because the
# regenerated assets land under packages/ssr/ and need a fresh
# wheel + Docker image + .deb.
depends_on = ["web"]
post_bump  = ["uv lock"]

[[components.ssr.writers]]
type            = "debian-changelog"
file            = "packages/ssr/debian/changelog"
package         = "shomer-ssr"
distribution    = "unstable"
maintainer      = "Chris <goabonga@pm.me>"
debian_revision = 1

[[components.ssr.artifacts]]
type = "docker"
ref  = "ghcr.io/goabonga/shomer-ssr:{version}"

[[components.ssr.artifacts]]
type = "debian"
ref  = "shomer-ssr_{version}-1_all.deb"

# `web` is the Node project that builds shomer-ssr's TS/CSS
# bundle and copies the Jinja templates into packages/ssr/. It has
# its own tag stream (web-vX.Y.Z) and changelog. The
# post_bump runs the build, which writes into packages/ssr/src/
# shomer_ssr/{static,templates}/ — those files are detected by hash
# diff and added to the release commit. `ssr` cascades a patch
# through depends_on, so a fresh image / chart / .deb is produced.
[components.web]
paths      = [
    "packages/web/src/**",
    "packages/web/scripts/**",
    "packages/web/package.json",
    "packages/web/tsconfig.json",
    "packages/web/biome.json",
]
bump_files = [
    { file = "packages/web/package.json", key = "version" },
    { file = "VERSION", key = 'regex:^web=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.web" },
]
changelog  = "packages/web/CHANGELOG.md"
# web imports the shared @shomer/lib package — a lib bump cascades a
# patch here so the regenerated bundle ships the updated shared code
# (and ssr cascades on from web in turn).
depends_on = ["lib"]
post_bump  = ["npm --prefix packages/web run build"]

# `lib` is the shared TypeScript package (@shomer/lib): framework-
# agnostic validation + types consumed by `web` (React) and `app`
# (React Native). Pure source with no build artifact — consumers bundle
# it straight from source — so it carries no `artifacts` block (like
# `database`). Its own tag stream (lib-vX.Y.Z) + changelog.
[components.lib]
paths      = [
    "packages/lib/src/**",
    "packages/lib/package.json",
    "packages/lib/tsconfig.json",
    "packages/lib/biome.json",
]
bump_files = [
    { file = "packages/lib/package.json", key = "version" },
    { file = "VERSION", key = 'regex:^lib=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.lib" },
]
changelog  = "packages/lib/CHANGELOG.md"

# `app` is the React Native (bare) mobile app. It consumes `lib`, so a
# lib bump cascades a patch here (a fresh APK/IPA ships the shared
# code). Native version sync (android versionName / iOS marketing
# version) happens at build time in the release-app CI job, not via a
# bump_files rewrite, to keep this config independent of the generated
# native project layout. No multicz `artifacts` type covers an APK/IPA;
# the release-app job attaches them to the GitHub release.
[components.app]
paths      = [
    "packages/app/src/**",
    "packages/app/index.js",
    "packages/app/app.json",
    "packages/app/package.json",
    "packages/app/tsconfig.json",
    "packages/app/biome.json",
    "packages/app/metro.config.js",
    "packages/app/jest.config.js",
    "packages/app/.maestro/**",
    "packages/app/android/**",
    "packages/app/ios/**",
]
bump_files = [
    { file = "packages/app/package.json", key = "version" },
    { file = "VERSION", key = 'regex:^app=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.app" },
]
changelog  = "packages/app/CHANGELOG.md"
depends_on = ["lib"]

[components.cli]
# Source + packaging only — NOT `**`, which would include `tests/` and
# flag cli as changed on a test-only commit.
paths      = [
    "packages/cli/src/**",
    "packages/cli/pyproject.toml",
    "packages/cli/debian/**",
    "packages/cli/data/**",
]
bump_files = [
    { file = "packages/cli/pyproject.toml", key = "project.version" },
    { file = "packages/cli/src/shomer_cli/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^cli=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.cli" },
]
changelog  = "packages/cli/CHANGELOG.md"
post_bump  = ["uv lock"]

[[components.cli.writers]]
type            = "debian-changelog"
file            = "packages/cli/debian/changelog"
package         = "shomer-cli"
distribution    = "unstable"
maintainer      = "Chris <goabonga@pm.me>"
debian_revision = 1

[[components.cli.artifacts]]
type = "pypi"
ref  = "shomer-cli=={version}"

[[components.cli.artifacts]]
type = "debian"
ref  = "shomer-cli_{version}-1_all.deb"

# `database` — Python library: SQLAlchemy models + injectable connector
# (postgres / mysql / mssql). Consumed by api / job; carries NO migration
# tooling. Pure wheel, no release artifact (add a `pypi` one if published).
[components.database]
# Source + manifest only — NOT `**`, which would sweep in `tests/` and
# make a test-only commit cascade a spurious "changed" through every
# api / job / migrations consumer (matches the src-scoped paths the
# other components use).
paths      = [
    "packages/bdd/database/src/**",
    "packages/bdd/database/pyproject.toml",
]
bump_files = [
    { file = "packages/bdd/database/pyproject.toml", key = "project.version" },
    { file = "packages/bdd/database/src/shomer_database/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^database=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.database" },
]
changelog  = "packages/bdd/database/CHANGELOG.md"
post_bump  = ["uv lock"]

# `migrations` — Alembic revisions + runner, shipped as the migration image.
# Depends on `database` for the model metadata. appVersion mirrors into the
# chart-migrations Helm chart (cascade like api -> chart-api).
[components.migrations]
paths      = [
    "packages/bdd/migrations/src/**",
    "packages/bdd/migrations/pyproject.toml",
    "packages/bdd/migrations/Dockerfile",
    "packages/bdd/migrations/alembic.ini",
    "packages/bdd/migrations/debian/**",
]
bump_files = [
    { file = "packages/bdd/migrations/pyproject.toml", key = "project.version" },
    { file = "packages/bdd/migrations/src/shomer_migrations/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^migrations=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.migrations" },
]
mirrors    = [
    { file = "packages/bdd/migrations/chart/Chart.yaml", key = "appVersion" },
]
changelog  = "packages/bdd/migrations/CHANGELOG.md"
# migrations imports shomer_database (models metadata) — a database bump
# cascades a patch so the migration image rebuilds with the new models.
depends_on = ["database"]
post_bump  = ["uv lock"]

[[components.migrations.writers]]
type            = "debian-changelog"
file            = "packages/bdd/migrations/debian/changelog"
package         = "shomer-migrations"
distribution    = "unstable"
maintainer      = "Chris <goabonga@pm.me>"
debian_revision = 1

[[components.migrations.artifacts]]
type = "docker"
ref  = "ghcr.io/goabonga/shomer-migrations:{version}"

# `chart-migrations` — Helm chart deploying the migration Job. Bumps on its own
# template changes and when `migrations` ships a new image via the appVersion
# mirror cascade.
[components.chart-migrations]
paths      = ["packages/bdd/migrations/chart/**"]
bump_files = [
    { file = "packages/bdd/migrations/chart/Chart.yaml", key = "version" },
    { file = "VERSION", key = 'regex:^chart-migrations=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.chart_migrations" },
]
changelog  = "packages/bdd/migrations/chart/CHANGELOG.md"

[[components.chart-migrations.artifacts]]
type = "helm"
ref  = "shomer-migrations-{version}.tgz"

[components.chart-api]
paths      = ["packages/api/chart/**"]
bump_files = [
    { file = "packages/api/chart/Chart.yaml", key = "version" },
    { file = "VERSION", key = 'regex:^chart-api=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.chart_api" },
]
changelog  = "packages/api/chart/CHANGELOG.md"

[[components.chart-api.artifacts]]
type = "helm"
ref  = "shomer-api-{version}.tgz"

[components.chart-job]
paths      = ["packages/job/chart/**"]
bump_files = [
    { file = "packages/job/chart/Chart.yaml", key = "version" },
    { file = "VERSION", key = 'regex:^chart-job=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.chart_job" },
]
changelog  = "packages/job/chart/CHANGELOG.md"

[[components.chart-job.artifacts]]
type = "helm"
ref  = "shomer-job-{version}.tgz"

[components.chart-ssr]
paths      = ["packages/ssr/chart/**"]
bump_files = [
    { file = "packages/ssr/chart/Chart.yaml", key = "version" },
    { file = "VERSION", key = 'regex:^chart-ssr=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.chart_ssr" },
]
changelog  = "packages/ssr/chart/CHANGELOG.md"

[[components.chart-ssr.artifacts]]
type = "helm"
ref  = "shomer-ssr-{version}.tgz"

# `docs` is a release-tracked component for the zensical site. Only
# scoped here so `multicz changed` picks up doc-only commits and
# `multicz status` / `plan` show the doc release stream alongside the
# code components. The bump_rules override adds `docs = "patch"` to
# the project defaults — `docs:` commits bump THIS component, but
# stay non-bumping for api / job / cli (which inherit the default
# rules where `docs` is absent / treated as no-op).
[components.docs]
paths      = ["docs/**", "zensical.toml"]
bump_files = [
    { file = "VERSION", key = 'regex:^docs=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.docs" },
]
# Every other component writes its version into zensical.toml's
# `[project.extra.versions]` via its own bump_files. Depending on them
# all means any bump cascades a `docs` patch — regenerating the site so
# docs/versions.md ships the fresh numbers.
depends_on = [
    "api", "job", "cli", "database", "migrations", "ssr", "web", "lib", "app",
    "chart-api", "chart-job", "chart-ssr", "chart-migrations",
    # Infrastructure. configs-* only bump from infra-apply.yml, and that
    # runs `multicz bump --component configs-<env>`, which does NOT drag
    # this cascade along — so the site picks the new deployed version up on
    # the next push to main rather than at apply time. One cycle late, by
    # construction.
    "infra", "infra-modules-example", "configs-staging", "configs-production",
    "gitops", "gitops-staging", "gitops-production",
]
bump_rules = { docs = "patch" }

# ═══════════════════════════ infrastructure ═══════════════════════════
#
# Terragrunt / Terraform, under infrastructure/. Three kinds of component,
# and the difference between them is the whole point of this section:
#
#   infra                  the Terragrunt root wiring (services/**, the
#                          module template, terragrunt.sh). A library.
#   infra-modules-<name>   one per Terraform module. Libraries too —
#                          registered by scripts/new-terraform-module.sh,
#                          no edit here by hand.
#   configs-<env>          what is ACTUALLY APPLIED in an environment. Not
#                          a library: bumped only by infra-apply.yml after
#                          a successful `terragrunt apply`, never by the
#                          push-to-main release-bump job — which filters
#                          out every component whose name starts with
#                          `configs-`. Renaming that prefix breaks the
#                          deploy gate.
#
# `_template/` is deliberately NOT its own component: it is scaffolding
# shipped with `infra`, not something a unit consumes in production.
#
# Like every other component, these write their version into zensical.toml's
# `[project.extra.versions]` and sit in `docs`' depends_on, so docs/versions.md
# ships current numbers. For `configs-<env>` that number is the DEPLOYED
# version — what is actually live in that environment — which is the one
# genuinely worth publishing.
#
# It lands one cycle late on purpose: infra-apply.yml bumps with
# `--component configs-<env>`, which does not drag the docs cascade along,
# so the site catches up on the next push to main rather than during the
# apply. Keeping the apply job to a single tagged component is worth more
# than a same-second docs refresh.

# Surfaces upstream (`depends_on`) commits in a downstream component's
# changelog and release notes — here, which `infra` / `infra-modules-*`
# changes a given environment's deploy actually shipped. Project-scoped:
# it also enriches the existing api/job/ssr/docs changelogs, which already
# carry depends_on.
[plugins.upstream-notes]
max_commits         = 30
include_prereleases = false

[components.infra]
# modules/_template/** is in here on purpose: it means a change to the
# template is a detected change, so CI actually formats and tests it.
paths      = [
    "infrastructure/root.hcl",
    "infrastructure/services/**",
    "infrastructure/modules/_template/**",
    "infrastructure/modules/README.md",
    "infrastructure/README.md",
    # The two helpers live in the repo-wide scripts/ dir, which is not a
    # tracked component — listed one by one so the grype/dependabot
    # scripts sitting next to them don't get swept into infra's history.
    "scripts/terragrunt.sh",
    "scripts/new-terraform-module.sh",
]
bump_files = [
    { file = "infrastructure/VERSION" },
    { file = "zensical.toml", key = "project.extra.versions.infra" },
]
changelog  = "infrastructure/CHANGELOG.md"

[components.configs-staging]
paths      = ["infrastructure/configs/staging/**"]
# The version lives inside config.yaml itself — no VERSION file beside it,
# so the file that describes the environment also states which version of
# it is deployed.
bump_files = [
    { file = "infrastructure/configs/staging/config.yaml", key = "version" },
    { file = "zensical.toml", key = "project.extra.versions.configs_staging" },
]
changelog  = "infrastructure/configs/staging/CHANGELOG.md"
# Whatever this environment deploys. new-terraform-module.sh appends each new
# infra-modules-* here so upstream-notes can resolve it.
depends_on = ["infra", "infra-modules-example"]

[components.configs-production]
paths      = ["infrastructure/configs/production/**"]
# The version lives inside config.yaml itself — no VERSION file beside it,
# so the file that describes the environment also states which version of
# it is deployed.
bump_files = [
    { file = "infrastructure/configs/production/config.yaml", key = "version" },
    { file = "zensical.toml", key = "project.extra.versions.configs_production" },
]
changelog  = "infrastructure/configs/production/CHANGELOG.md"
depends_on = ["infra", "infra-modules-example"]

[components.infra-modules-example]
paths      = ["infrastructure/modules/example/**"]
# The version lives in README.md — there is no VERSION file. post_bump
# regenerates the terraform-docs block right after the rewrite, so a
# released module always ships docs matching the code that was tagged;
# `mode: inject` only touches what sits between the BEGIN/END markers, so
# the **Version:** line survives.
bump_files = [
    { file = "infrastructure/modules/example/README.md", key = 'regex:^\*\*Version:\*\* (.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.infra_modules_example" },
]
changelog  = "infrastructure/modules/example/CHANGELOG.md"
post_bump  = ["terraform-docs -c infrastructure/modules/example/.terraform-docs.yml infrastructure/modules/example"]

# The state-backend bootstraps. Versioned like modules and for the same
# reason — someone has to be able to say which revision created the bucket
# their state lives in — but they are NOT modules: no unit sources them,
# and CI never applies them. They run once, by hand, with local state.
#
# Not deploy-gated: releasing one records that the code changed, which is
# true whether or not anybody has re-run it. That is the opposite of
# configs-<env>, where the version means "this is live".

[components.infra-bootstrap-aws]
paths      = ["infrastructure/bootstrap/aws/**"]
bump_files = [
    { file = "infrastructure/bootstrap/aws/README.md", key = 'regex:^\*\*Version:\*\* (.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.infra_bootstrap_aws" },
]
changelog  = "infrastructure/bootstrap/aws/CHANGELOG.md"
post_bump  = ["terraform-docs -c infrastructure/bootstrap/aws/.terraform-docs.yml infrastructure/bootstrap/aws"]

[components.infra-bootstrap-gcp]
paths      = ["infrastructure/bootstrap/gcp/**"]
bump_files = [
    { file = "infrastructure/bootstrap/gcp/README.md", key = 'regex:^\*\*Version:\*\* (.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.infra_bootstrap_gcp" },
]
changelog  = "infrastructure/bootstrap/gcp/CHANGELOG.md"
post_bump  = ["terraform-docs -c infrastructure/bootstrap/gcp/.terraform-docs.yml infrastructure/bootstrap/gcp"]

# ═══════════════════════════════ gitops ═══════════════════════════════
#
# Flux reconciles gitops/ into two clusters. Both environments pin their
# chart versions; the only difference is who moves the pin — a workflow
# committing to main for staging, a reviewed PR for production.
#
# Like configs-<env>, these are DEPLOYED STATE, not libraries: release-bump
# filters them out and only the promotion workflow bumps them. The filter
# keys on the component-name prefix, so `gitops-` joins `configs-` in that
# rule rather than getting a special case.
#
# One honest caveat, recorded here rather than discovered later: the bump
# attests that the pins were PROMOTED, not that the cluster converged. Flux
# applies asynchronously and nothing waits on it. Closing that needs a Flux
# Alert/Provider notifying GitHub on reconciliation.
#
# `depends_on` is what makes the changelog worth reading: upstream-notes
# lists the chart commits each promotion carries.
#
# Staging deliberately has no semver range. A range would leave git saying
# ">=0.0.0" and nothing more, so the deployed state could not be
# reconstructed from a commit — which is most of the point of GitOps.

# The shared wiring both environments include: the HelmRelease templates,
# the cluster entrypoints, the HelmRepository. A library, exactly like
# `infra` is for terragrunt — and released the same way, because the name
# has no trailing dash and so escapes the `^(configs|gitops)-` deploy gate.
# That is load-bearing: renaming this to `gitops-base` would silently make
# it deploy-gated and it would stop releasing.
[components.gitops]
paths      = [
    "gitops/apps/base/**",
    "gitops/clusters/**",
    "gitops/infrastructure/**",
    "gitops/README.md",
]
bump_files = [
    { file = "gitops/VERSION" },
    { file = "zensical.toml", key = "project.extra.versions.gitops" },
]
changelog  = "gitops/CHANGELOG.md"

[components.gitops-staging]
paths      = ["gitops/apps/staging/**"]
bump_files = [
    { file = "gitops/apps/staging/VERSION" },
    { file = "zensical.toml", key = "project.extra.versions.gitops_staging" },
]
changelog  = "gitops/apps/staging/CHANGELOG.md"
depends_on = ["gitops", "chart-api", "chart-job", "chart-ssr", "chart-migrations"]

[components.gitops-production]
paths      = ["gitops/apps/production/**"]
bump_files = [
    { file = "gitops/apps/production/VERSION" },
    { file = "zensical.toml", key = "project.extra.versions.gitops_production" },
]
changelog  = "gitops/apps/production/CHANGELOG.md"
depends_on = ["gitops", "chart-api", "chart-job", "chart-ssr", "chart-migrations"]

