# terraform-docs config for this module. Copied to every module by
# scripts/new-terraform-module.sh, so each one carries its own and can be
# regenerated on its own (`make infra-docs`, or the post_bump hook multicz
# runs when the module is released).
#
# `mode: inject` rewrites ONLY what sits between the BEGIN_TF_DOCS /
# END_TF_DOCS markers in README.md. Everything else in that file survives —
# which is what lets the **Version:** line live there as the module's single
# source of truth, with no VERSION file beside it.

formatter: markdown table

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: false
  required: true
  sensitive: true
  type: true
