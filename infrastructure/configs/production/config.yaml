# version - the version of this environment's deployed state, and the only
# place it is recorded (there is no VERSION file beside this one). multicz
# rewrites it when infra-apply.yml bumps configs-production after a successful
# apply, so `git show <file>` tells you what is live.
#
# Terragrunt reads it as `local.config.version` like any other key, which
# makes it usable as a resource tag once a provider is wired.
version: 0.0.0
# Inputs for the `production` environment. Same shape as
# config.staging.yaml — the units are shared, only these values differ.
#
# This file IS the deployed state of production as far as versioning goes:
# it belongs to the `configs-production` multicz component, bumped only by
# infra-apply.yml after a real apply. See multicz.toml.

tags:
  environment: production
  managed-by: terragrunt

# provider: {}     # TODO — fill in when a provider is wired.
#
# remote_state — pasted from the bootstrap's `remote_state_yaml` output
# (`make infra-bootstrap CLOUD=aws|gcp ...`). Nothing else to change:
# root.hcl reads this key, and with it absent the backend is local state in
# the terragrunt cache — thrown away with the cache, so every plan on a CI
# runner reads as a first apply. Wire this before the first unit declares a
# resource that costs money.
#
# The bucket must exist first. Terraform cannot keep its state in a bucket
# Terraform has not created yet, which is the only reason bootstrap/ is
# applied by hand.
#
# `backend:` defaults to the provider above — gcp -> gcs, aws -> s3 — so it
# is only worth setting to keep state in one cloud while running in another.
# The key/prefix is derived: <environment>/services/<unit>, so one bucket
# holds every environment without collision.
#
# remote_state:
#   bucket: shomer-tfstate
remote_state:
  backend: s3
  bucket: shomer-tfstate
  region: us-east-1
  encrypt: true
  use_lockfile: true

# ── provider ────────────────────────────────────────────────────────────
# Selects which implementation of each unit runs. Every unit under
# services/ carries an `exclude` keyed on this, so switching it swaps the
# whole stack rather than half of it.
provider: aws

region: eu-west-3
# One zone in staging, three in production. Read by the units that place
# zonal resources; the HA flags below decide whether they spread.
zones: ["eu-west-3a", "eu-west-3b", "eu-west-3c"]

# GCP only — ignored when provider is aws, where the account is
# implicit in the credentials.
project: ""

# ── network ─────────────────────────────────────────────────────────────
network:
  cidr: 10.60.0.0/16

  # Three purposes, three subnets, and the separation is load-bearing:
  # `workload` has NO route to the internet and no NAT, so its only way
  # out is the proxy. Giving it a NAT would make the proxy optional, and
  # optional means bypassed.
  subnets:
    workload: { cidr: 10.60.0.0/20, purpose: workload }
    proxy:    { cidr: 10.60.16.0/24, purpose: egress }
    lb:       { cidr: 10.60.17.0/24, purpose: public-lb }

  # Secondary ranges for pods and services. GKE needs them declared on the
  # subnet; EKS derives them from the subnet itself and ignores these.
  pods:     10.70.0.0/16
  services: 10.80.0.0/20

  nat:
    # Egress addresses reserved by network/addresses/public and consumed by
    # network/nat. Extending the pool is this number — the addresses are
    # created and attached, nothing else changes.
    #
    # It bounds concurrent outbound connections: each address gives ~64k
    # ports shared across the proxy fleet. One is plenty for staging.
    ip_count: 3

# ── access ──────────────────────────────────────────────────────────────
# No bastion VM. Access is tunnelled through the cloud control plane —
# IAP TCP forwarding on GCP, Session Manager on AWS — so there is no host
# to patch, no port 22 reachable, and the right to connect is an IAM grant
# that can be revoked centrally and shows up in the audit log.
access:
  method: control-plane-tunnel
  # Source ranges allowed to reach the tunnel front-end. Not "anywhere":
  # the tunnel authenticates, but an allow-list keeps the attack surface
  # off the public internet in the first place.
  allowed_cidrs: ["0.0.0.0/0"]  # TODO: narrow to the office / VPN ranges

# ── services ────────────────────────────────────────────────────────────
# `enabled: false` removes a unit from the run graph entirely (terragrunt
# `exclude`), so a stack can be brought up in layers.
#
# EVERYTHING BELOW EXCEPT `example` IS OFF, AND THAT IS NOT A PLACEHOLDER.
#
# A unit turns on when two things are true: its module declares real
# resources, AND the provider is wired in root.hcl with credentials CI can
# use. Implementing a module alone is not enough — `network/vpc` was
# enabled with a real google_compute_network and no provider block, and
# every `terragrunt plan` failed with "Invalid provider configuration"
# until it was turned back off. infra-plan is the only thing that noticed,
# and it noticed by going red on an unrelated release.
#
# `example` stays on because it uses `terraform_data`, which needs no
# provider at all — it is what proves the wiring works while the rest
# waits.
#
# `ha` is the only difference between the environments that is not an
# address: false is one zonal instance, true is a managed group spread
# across `zones`.
services:
  network:
    vpc:      { enabled: false }
    subnets:  { enabled: false }
    firewall: { enabled: false }
    routes:   { enabled: false }
    nat:      { enabled: false }
    addresses:
      private: { enabled: false }
      public:  { enabled: false }
  vms:
    proxy:
      enabled: false
      ha: true
      # Squid listener. Workload subnets reach it through the route in
      # network/routes; nothing else may talk to it.
      port: 3128

      # WHAT THE ESTATE MAY REACH. There is no permissive default in the
      # module — an empty list denies everything and a wildcard would make
      # the fleet a router with extra steps, so the policy has to be
      # written out here.
      #
      # Domains rather than addresses: an address list rots silently as
      # services move, and the failure is a timeout with nothing to say a
      # policy caused it.
      #
      # A leading dot matches subdomains. Adding an entry is the normal way
      # to unblock something; it is meant to be a small, reviewed diff on a
      # deploy PR rather than a request to someone with console access.
      # AWS only: the AMI the fleet boots. No default in the module — a
      # wrong image is a fleet that boots and never listens, reported as
      # unhealthy with nothing to say why.
      image_id: ""   # TODO: a Debian 12 AMI in this region

      allowed_domains:
        - .debian.org           # apt, for the proxy's own updates
        - .googleapis.com       # artifact registry, logging, monitoring
        - .pkg.dev              # artifact registry image pulls
        - .github.com           # actions runners fetching the repo
        - .ghcr.io              # published container images
  k8s:
    # THE one place this environment is deliberately reachable from
    # outside: the api and the ssr, through the load balancer.
    #
    # NOT the Kubernetes API endpoint, which stays private here as it is in
    # staging. Two different front doors — conflating them is how one gets
    # opened while somebody is thinking about the other.
    cluster:
      enabled: false
      ha: true
      public_load_balancer: true

      # Pinned rather than defaulted: an unpinned cluster upgrades on the
      # provider's schedule instead of on a reviewed change.
      version: "1.31"

      # ClusterIP range. Virtual, inside the cluster — but it must not
      # overlap the VPC, or some VPC address becomes permanently
      # unreachable from a pod and one service fails for no visible reason.
      service_cidr: 172.20.0.0/16

      # AWS only. The control plane's IAM role, created outside terraform
      # because the apply identity excludes IAM on purpose — granting it
      # role creation would hand the apply path a route to privilege
      # escalation that no plan reviewer would see.
      cluster_role_arn: ""   # TODO: arn:aws:iam::<account>:role/<name>

      # GCP only. The control plane's own endpoints, peered into the VPC.
      # Must be a /28, must not overlap anything above, and cannot be
      # changed after creation.
      master_cidr: 172.16.0.0/28
    nodes:
      enabled: false
      ha: true

      # AWS only. The nodes' IAM role, created outside terraform because the
      # apply identity excludes IAM on purpose.
      node_role_arn: ""   # TODO: arn:aws:iam::<account>:role/<name>
  dns:
    private: { enabled: false }
    # Only the k8s load balancer belongs here. Everything else in this
    # infrastructure is private and must not appear in a public zone.
    public:  { enabled: false }
  example:
    enabled: true
    name: shomer-production-example-probe
