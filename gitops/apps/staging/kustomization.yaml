# Pins for staging. Moved by a workflow, committed straight to `main` — no
# review. Continuous in practice: one CI round-trip after a chart releases.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shomer
resources:
  - ../base
patches:
  - path: api.yaml
  - path: job.yaml
  - path: ssr.yaml
  - path: migrations.yaml
