# Background job worker.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: job
  namespace: shomer
spec:
  interval: 5m
  # Background job worker needs these to be reconciled first.
  dependsOn:
    - name: migrations
  chart:
    spec:
      chart: test-pipelilne-multicz-job
      # Overlaid per environment — base carries no version on purpose, so a
      # missing pin fails loudly instead of silently resolving to "latest".
      sourceRef:
        kind: HelmRepository
        name: shomer-charts
        namespace: shomer
      # Refuse to install a chart this repository's release workflow did not
      # sign. Both the issuer AND the identity are anchored: pinning the
      # issuer alone would accept a signature from any GitHub workflow in
      # any repository.
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
            subject: "^https://github\\.com/goabonga/test-pipelilne-multicz/.*$"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    networkPolicy:
      enabled: true
      # NO INGRESS AT ALL. A worker is reached by nothing: it takes its work
      # from the queue rather than from a request, so an empty list here is
      # the accurate rule and not an oversight.
      ingress: []
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: postgres
          ports:
            - protocol: TCP
              port: 5432
