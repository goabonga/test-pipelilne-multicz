# Server-rendered frontend.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ssr
  namespace: shomer
spec:
  interval: 5m
  # Server-rendered frontend needs these to be reconciled first.
  dependsOn:
    - name: api
  chart:
    spec:
      chart: test-pipelilne-multicz-ssr
      # Overlaid per environment — base carries no version on purpose, so a
      # missing pin fails loudly instead of silently resolving to "latest".
      sourceRef:
        kind: HelmRepository
        name: shomer-charts
        namespace: shomer
      # Refuse to install a chart this repository's release workflow did not
      # sign. Both the issuer AND the identity are anchored: pinning the
      # issuer alone would accept a signature from any GitHub workflow in
      # any repository.
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
            subject: "^https://github\\.com/goabonga/test-pipelilne-multicz/.*$"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    networkPolicy:
      enabled: true
      ingress:
        # Only the ingress controller. The ssr is the one thing users reach
        # in production, and it reaches them through the load balancer
        # rather than directly.
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
          ports:
            - protocol: TCP
              port: 8080
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: shomer-api
          ports:
            - protocol: TCP
              port: 8000
