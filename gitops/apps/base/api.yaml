# Authorization HTTP API.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: api
  namespace: shomer
spec:
  interval: 5m
  # Authorization HTTP API needs these to be reconciled first.
  dependsOn:
    - name: migrations
  chart:
    spec:
      chart: test-pipelilne-multicz-api
      # Overlaid per environment — base carries no version on purpose, so a
      # missing pin fails loudly instead of silently resolving to "latest".
      sourceRef:
        kind: HelmRepository
        name: shomer-charts
        namespace: shomer
      # Refuse to install a chart this repository's release workflow did not
      # sign. Both the issuer AND the identity are anchored: pinning the
      # issuer alone would accept a signature from any GitHub workflow in
      # any repository.
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
            subject: "^https://github\\.com/goabonga/test-pipelilne-multicz/.*$"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    # NARROWING THE CHART'S DEFAULT, which is `ingress: [{}]` — allow from
    # anywhere. NetworkPolicy is additive, so leaving it would union with
    # the deny floor in gitops/infrastructure/network-policies and
    # reinstate open ingress for this pod alone, while the floor still read
    # as a deny-all.
    networkPolicy:
      enabled: true
      ingress:
        # From the ssr, and from the ingress controller that fronts the
        # load balancer. Nothing else in the namespace has business here.
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: shomer-ssr
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
          ports:
            - protocol: TCP
              port: 8000
      egress:
        # The database, wherever it runs.
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: postgres
          ports:
            - protocol: TCP
              port: 5432
