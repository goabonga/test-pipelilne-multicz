# Pins for production. Moved only by a reviewed PR, gated by the
# `production` GitHub Environment. Nothing else writes here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shomer
resources:
  - ../base
  # Environment-specific because the proxy's subnet differs between them.
  - allow-egress-to-proxy.yaml
  # Production only: staging runs GKE Dataplane V2, which is Cilium but
  # does not install the upstream CRDs, so these would be accepted by
  # nothing and silently absent there.
  - cilium-l7.yaml
patches:
  - path: api.yaml
  - path: job.yaml
  - path: ssr.yaml
  - path: migrations.yaml
