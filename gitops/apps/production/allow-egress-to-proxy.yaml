# The one way out of this namespace, and the Kubernetes half of what
# services/network/firewall says at the packet layer.
#
# Everything a pod cannot reach inside the cluster it reaches through the
# Squid proxy, which sits OUTSIDE the cluster in the VPC — so this is an
# ipBlock rule rather than a podSelector one. There is no pod to select.
#
# PER ENVIRONMENT BECAUSE THE RANGE IS. staging's proxy subnet is
# 10.60.16.0/24 and production's is 10.10.16.0/24 — a shared file would have to name
# one of them, and naming the wrong one produces a policy that applies
# cleanly and blocks all egress.
#
# The port is the only one Squid listens on. Widening it here would let a
# pod open an arbitrary connection to a host in the proxy subnet, which is
# the one subnet with a way to the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-proxy
  namespace: shomer
  annotations:
    shomer.dev/why: >-
      Pods reach the internet only through the egress proxy. This permits
      that and nothing else; the proxy's own allow-list decides where the
      request may actually go.
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.60.16.0/24
      ports:
        - protocol: TCP
          port: 3128
