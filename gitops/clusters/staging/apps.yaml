# What `flux bootstrap` points at for the staging cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  # The HelmRepository must exist before any HelmRelease references it.
  dependsOn:
    - name: infrastructure
  path: ./gitops/apps/staging
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
